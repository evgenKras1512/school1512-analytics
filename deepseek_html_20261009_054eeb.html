  if (fClass) filteredStudents = filteredStudents.filter(s => s.classId === +fClass);

  const studentOpts = filteredStudents.map(s =>
    `<option value="${s.id}">${esc(fullName(s))}</option>`).join('');

  const ranking = filteredStudents.map(s => {
    let sum = 0, cnt = 0;
    const subs = fSubj ? [fSubj] : subjects;
    subs.forEach(sub => {
      const gs = DB.getGrades().filter(g => g.studentId === s.id && g.subject === sub
        && /^[2-5]$/.test(g.value) && (!fPeriod || g.period === fPeriod));
      gs.forEach(g => { sum += +g.value; cnt++; });
    });
    return { s, avg: cnt ? sum/cnt : 0, cnt };
  }).filter(x => x.cnt > 0).sort((a,b) => b.avg - a.avg);

  const topRows = ranking.slice(0, 10).map((x, i) => `<tr>
    <td>${i+1}</td>
    <td>${esc(fullName(x.s))}</td>
    <td class="hide-mobile">${esc(DB.getClasses().find(c => c.id === x.s.classId)?.name || '—')}</td>
    <td class="text-right"><b>${x.avg.toFixed(2)}</b></td>
    <td class="text-right hide-mobile">${x.cnt}</td>
  </tr>`).join('');

  page(`
    <h2 style="margin-bottom:16px;color:#1e3a5f;">Аналитика</h2>
    <div class="card">
      <h2>Фильтры</h2>
      <div class="form-grid">
        <div class="form-group"><label>Класс</label>
          <select onchange="analyticsFilter.classId=this.value;renderAnalytics();">
            <option value="">Все</option>
            ${classes.map(c => `<option value="${c.id}" ${analyticsFilter.classId==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Предмет</label>
          <select onchange="analyticsFilter.subject=this.value;renderAnalytics();">
            <option value="">Все</option>
            ${subjects.map(s => `<option ${analyticsFilter.subject===s?'selected':''}>${esc(s)}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Период</label>
          <select onchange="analyticsFilter.period=this.value;renderAnalytics();">
            <option value="">Все</option>
            ${PERIODS.map(p => `<option ${analyticsFilter.period===p?'selected':''}>${esc(p)}</option>`).join('')}
          </select></div>
      </div>
    </div>
    <div class="card">
      <h2>Средний балл по классам</h2>
      <div class="chart-box"><canvas id="anClasses"></canvas></div>
    </div>
    <div class="card">
      <h2>Распределение и уровни</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="chart-box-sm"><canvas id="anPie"></canvas></div>
        <div class="chart-box-sm"><canvas id="anLevels"></canvas></div>
      </div>
    </div>
    <div class="card">
      <h2>Сравнение двух учеников</h2>
      <div class="form-grid mb-16">
        <div class="form-group"><label>Ученик A</label>
          <select onchange="analyticsFilter.studentA=this.value;renderAnalytics();">
            <option value="">— выберите —</option>${studentOpts}
          </select></div>
        <div class="form-group"><label>Ученик B</label>
          <select onchange="analyticsFilter.studentB=this.value;renderAnalytics();">
            <option value="">— выберите —</option>${studentOpts}
          </select></div>
      </div>
      <div class="chart-box-lg"><canvas id="anCompare"></canvas></div>
    </div>
    <div class="card">
      <h2>Динамика по четвертям</h2>
      <div class="chart-box-lg"><canvas id="anDynamics"></canvas></div>
    </div>
    <div class="card">
      <h2>Рейтинг (топ 10)</h2>
      ${ranking.length ? `<div class="table-wrap"><table>
        <thead><tr><th>#</th><th>ФИО</th><th class="hide-mobile">Класс</th>
        <th class="text-right">Ср. балл</th><th class="text-right hide-mobile">Оценок</th></tr></thead>
        <tbody>${topRows}</tbody></table></div>` : '<div class="empty">Нет данных</div>'}
    </div>
    <div class="card">
      <h2>Экспорт</h2>
      <div class="btn-group">
        <button class="btn btn-success" onclick="exportAnalytics()">📄 Все графики</button>
        <button class="btn btn-outline" onclick="exportComparison()">📄 Сравнение</button>
      </div>
    </div>
  `, 'analytics');

  requestAnimationFrame(() => {
    drawClassesAvgChart(classes, students, subjects, 'anClasses');
    drawAllGradesPie(filteredStudents);
    drawDiagLevelsChart(filteredStudents);
    drawCompareStudents();
    drawGlobalDynamics(filteredStudents);
  });
}

function drawAllGradesPie(students) {
  destroyChart('anPie');
  const ctx = document.getElementById('anPie');
  if (!ctx) return;
  const ids = students.map(s => s.id);
  const fSubj = analyticsFilter.subject;
  const fPeriod = analyticsFilter.period;
  const grades = DB.getGrades().filter(g => ids.includes(g.studentId) && /^[2-5]$/.test(g.value)
    && (!fSubj || g.subject === fSubj) && (!fPeriod || g.period === fPeriod));
  const counts = {'5':0,'4':0,'3':0,'2':0};
  grades.forEach(g => counts[g.value]++);
  charts.anPie = new Chart(ctx, {
    type: 'pie',
    data: { labels: ['5','4','3','2'],
      datasets: [{ data: [counts['5'],counts['4'],counts['3'],counts['2']],
        backgroundColor: ['#38a169','#3182ce','#dd6b20','#e53e3e'], borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: CHART_FONT } } } }
  });
}

function drawDiagLevelsChart(students) {
  destroyChart('anLevels');
  const ctx = document.getElementById('anLevels');
  if (!ctx) return;
  const ids = students.map(s => s.id);
  const diags = DB.getDiagnostics().filter(d => ids.includes(d.studentId));
  const counts = {'высокий':0,'повышенный':0,'базовый':0,'низкий':0,'':0};
  diags.forEach(d => counts[d.level || '']++);
  charts.anLevels = new Chart(ctx, {
    type: 'bar',
    data: { labels: ['высок.','повыш.','базов.','низк.','—'],
      datasets: [{ label: 'Диагностик',
        data: [counts['высокий'],counts['повышенный'],counts['базовый'],counts['низкий'],counts['']],
        backgroundColor: ['#38a169','#3182ce','#dd6b20','#e53e3e','#a0aec0'], borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: CHART_FONT } },
                x: { ticks: { font: CHART_FONT } } } }
  });
}

function drawCompareStudents() {
  destroyChart('anCompare');
  const ctx = document.getElementById('anCompare');
  if (!ctx) return;
  const a = +analyticsFilter.studentA;
  const b = +analyticsFilter.studentB;
  if (!a || !b) {
    charts.anCompare = new Chart(ctx, {
      type: 'line', data: { labels: PERIODS, datasets: [] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          title: { display: true, text: 'Выберите двух учеников', font: { ...CHART_FONT, size: 13 } } },
        scales: { y: { min: 2, max: 5, ticks: { stepSize: .5, font: CHART_FONT } },
                  x: { ticks: { font: CHART_FONT } } } }
    });
    return;
  }
  const sA = DB.getStudent(a);
  const sB = DB.getStudent(b);
  const buildData = (sid) => PERIODS.map(p => {
    const gs = DB.getGrades().filter(g => g.studentId === sid && g.period === p && /^[2-5]$/.test(g.value)
      && (!analyticsFilter.subject || g.subject === analyticsFilter.subject));
    return gs.length ? +(gs.reduce((x,y)=>x+ +y.value,0)/gs.length).toFixed(2) : null;
  });
  charts.anCompare = new Chart(ctx, {
    type: 'line',
    data: { labels: PERIODS, datasets: [
      { label: sA ? shortName(sA) : 'A', data: buildData(a),
        borderColor: '#2c5282', fill: false, tension: .3, pointRadius: 5, spanGaps: true },
      { label: sB ? shortName(sB) : 'B', data: buildData(b),
        borderColor: '#dd6b20', fill: false, tension: .3, pointRadius: 5, spanGaps: true }
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: CHART_FONT } } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5, font: CHART_FONT } },
                x: { ticks: { font: CHART_FONT } } } }
  });
}

function drawGlobalDynamics(students) {
  destroyChart('anDynamics');
  const ctx = document.getElementById('anDynamics');
  if (!ctx) return;
  const palette = ['#2c5282','#38a169','#dd6b20','#805ad5','#d53f8c','#3182ce','#b7791f','#e53e3e'];
  const datasets = students.slice(0, 8).map((s, i) => {
    const data = PERIODS.map(p => {
      const gs = DB.getGrades().filter(g => g.studentId === s.id && g.period === p
        && /^[2-5]$/.test(g.value)
        && (!analyticsFilter.subject || g.subject === analyticsFilter.subject));
      return gs.length ? +(gs.reduce((a,b)=>a+ +b.value,0)/gs.length).toFixed(2) : null;
    });
    return { label: shortName(s), data, borderColor: palette[i % palette.length],
             backgroundColor: 'transparent', tension: .3, spanGaps: true, pointRadius: 3 };
  });
  charts.anDynamics = new Chart(ctx, {
    type: 'line',
    data: { labels: PERIODS, datasets },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: CHART_FONT, boxWidth: 12 } } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5, font: CHART_FONT } },
                x: { ticks: { font: CHART_FONT } } } }
  });
}

function exportAnalytics() {
  const classes = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();
  const fSubj = analyticsFilter.subject;
  const fPeriod = analyticsFilter.period;
  let filteredStudents = students;
  if (analyticsFilter.classId) filteredStudents = filteredStudents.filter(s => s.classId === +analyticsFilter.classId);

  let html = `<h1>Аналитический отчёт</h1>`;
  html += '<h3>Средний балл по классам</h3>';
  const labels = [], values = [];
  classes.forEach(c => {
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0;
    sts.forEach(s => subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v) && (!fSubj || sub === fSubj)) { sum += +v; cnt++; }
    }));
    labels.push(c.name);
    values.push(cnt ? +(sum/cnt).toFixed(2) : 0);
  });
  html += renderChartToImage('bar', 900, 400, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Ср. балл', data: values,
      backgroundColor: values.map(v => v>=4.5?'#38a169':v>=3.5?'#3182ce':v>=2.5?'#dd6b20':'#e53e3e'),
      borderRadius: 8 }] },
    options: { animation: false, responsive: false, plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: .5 } } } }
  });
  html += `<div class="sig">
      <div>Ответственный: ___________________</div>
      <div>Дата: «____» ____________ 20___ г.</div>
    </div>`;
  exportPDF(html, 'Аналитический отчёт');
}

function exportComparison() {
  const a = +analyticsFilter.studentA;
  const b = +analyticsFilter.studentB;
  if (!a || !b) { alert('Выберите двух учеников'); return; }
  const sA = DB.getStudent(a);
  const sB = DB.getStudent(b);
  const buildData = (sid) => PERIODS.map(p => {
    const gs = DB.getGrades().filter(g => g.studentId === sid && g.period === p && /^[2-5]$/.test(g.value)
      && (!analyticsFilter.subject || g.subject === analyticsFilter.subject));
    return gs.length ? +(gs.reduce((x,y)=>x+ +y.value,0)/gs.length).toFixed(2) : null;
  });
  let html = `<h1>Сравнительный отчёт</h1>
    <h2>${esc(fullName(sA))} и ${esc(fullName(sB))}</h2>`;
  html += renderChartToImage('line', 900, 400, {
    type: 'line',
    data: { labels: PERIODS, datasets: [
      { label: fullName(sA), data: buildData(a), borderColor: '#2c5282', fill: false, tension: .3, pointRadius: 5, spanGaps: true },
      { label: fullName(sB), data: buildData(b), borderColor: '#dd6b20', fill: false, tension: .3, pointRadius: 5, spanGaps: true }
    ]},
    options: { animation: false, responsive: false,
      plugins: { legend: { position: 'bottom' } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5 } } } }
  });
  exportPDF(html, 'Сравнительный отчёт');
}

function userForm(id) {
  const u = id ? DB.getUsers().find(x => x.id === id) : null;
  const teachers = DB.getTeachers();
  showModal(`
    <h2>${u ? 'Редактирование' : 'Новый'} пользователь</h2>
    <div class="form-grid">
      <div class="form-group"><label>Логин *</label><input id="u_login" value="${esc(u?u.login:'')}"></div>
      <div class="form-group"><label>Пароль ${u?'(пусто — не менять)':''}</label><input id="u_pass" type="text"></div>
      <div class="form-group"><label>ФИО *</label><input id="u_name" value="${esc(u?u.name:'')}"></div>
      <div class="form-group"><label>Роль</label>
        <select id="u_role" onchange="toggleTeacherField()">
          <option value="teacher" ${u&&u.role==='teacher'?'selected':''}>Классный руководитель</option>
          <option value="director" ${u&&u.role==='director'?'selected':''}>Руководитель ОО</option>
          <option value="admin" ${u&&u.role==='admin'?'selected':''}>Администратор</option>
        </select></div>
    </div>
    <div id="teacherBlock" style="margin-top:16px;">
      <div class="form-group"><label>Классное руководство</label>
        <select id="u_teacher">
          <option value="">— создать нового по ФИО —</option>
          ${teachers.map(t => `<option value="${t.id}" ${u&&u.teacherId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
        </select></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveUser(${id||'null'})">Сохранить</button>
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
    </div>
  `);
  toggleTeacherField();
}

function toggleTeacherField() {
  const role = document.getElementById('u_role').value;
  document.getElementById('teacherBlock').style.display = role === 'teacher' ? 'block' : 'none';
}

function saveUser(id) {
  const login = document.getElementById('u_login').value.trim();
  const pass = document.getElementById('u_pass').value;
  const name = document.getElementById('u_name').value.trim();
  const role = document.getElementById('u_role').value;
  if (!login || !name) { alert('Заполните'); return; }
  if (!id && !pass) { alert('Пароль'); return; }
  const all = DB.getUsers();
  if (all.some(u => u.login === login && u.id !== id)) { alert('Логин занят'); return; }
  let teacherId = null;
  if (role === 'teacher') {
    const sel = +document.getElementById('u_teacher').value;
    teacherId = sel || DB.addTeacher(name).id;
  }
  if (id) {
    const patch = { login, name, role, teacherId };
    if (pass) patch.password = pass;
    DB.updateUser(id, patch);
    if (id === SESSION.id) setSession({ ...SESSION, ...patch });
  } else {
    DB.addUser({ login, password: pass, name, role, teacherId });
  }
  closeModal();
  render();
}

function delUser(id) {
  if (!confirm('Удалить?')) return;
  DB.deleteUser(id);
  render();
}

function render() {
  DB.load();
  UndoStack.load();
  if (!SESSION) { renderLogin(); return; }

  const hash = location.hash.replace('#', '') || 'dashboard';
  const [route, param] = hash.split('/');

  switch (route) {
    case 'dashboard':  renderDashboard(); break;
    case 'students':   renderStudents(); break;
    case 'student':    renderStudentDetail(+param); break;
    case 'classes':    renderClasses(); break;
    case 'analytics':  renderAnalytics(); break;
    case 'journal':    renderJournal(); break;
    case 'directories': if (SESSION.role === 'admin') renderDirectories(); else renderDashboard(); break;
    case 'users':       if (SESSION.role === 'admin') renderUsers(); else renderDashboard(); break;
    default: renderDashboard();
  }
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
loadDraft();
UndoStack.load();
initMobileMode();
render();

/* Перехват установки PWA через меню браузера */
window.addEventListener('load', () => {
  // Принудительная проверка обновления SW
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(reg => {
      reg.update();
    });
  }
});
</script>
