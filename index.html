function drawTeacherSubjectsChart(teacherId, perSubject) {
  if (typeof destroyChart === 'function') destroyChart('teacherSubjects');
  const ctx = document.getElementById('teacherSubjects');
  if (!ctx) return;
  const subjects = Object.keys(perSubject);
  const values = subjects.map(sub => perSubject[sub].cnt ? +(perSubject[sub].sum / perSubject[sub].cnt).toFixed(2) : 0);
  const t = chartTheme();
  charts.teacherSubjects = new Chart(ctx, {
    type: 'bar',
    data: { labels: subjects, datasets: [{ label: 'Ср. балл', data: values,
      backgroundColor: values.map(v => v>=4.5?'#38a169':v>=3.5?'#3182ce':v>=2.5?'#dd6b20':'#e53e3e'),
      borderRadius: 8 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: .5, font: t.font, color: t.text }, grid: { color: t.grid } },

  });
}

function drawTeacherDistChart(teacherId, dist) {
  if (typeof destroyChart === 'function') destroyChart('teacherDist');
  const ctx = document.getElementById('teacherDist');

  const t = chartTheme();

function saveTeacherEdit(id) {

  const mckoDate = document.getElementById('et_mcko_date').value;
  if (!name) { showToast('Укажите ФИО', 'error'); return; }
  UndoStack.push('Редактирование учителя');
  DB.updateSubjectTeacher(id, { name, mckoLevel: mcko, mckoDate });
  closeModal();
  showToast('Учитель обновлён', 'success');
  render();
}

/* ---------- Переопределяем роутер ---------- */
function render() {
  DB.load();
  if (typeof UndoStack !== 'undefined') UndoStack.load();
  if (!SESSION) {
    if (typeof renderLogin === 'function') renderLogin();
    return;
  }

  const hash = location.hash.replace('#', '') || 'dashboard';
  const [route, param] = hash.split('/');

  switch (route) {
    case 'dashboard':  renderDashboard(); break;
    case 'students':   renderStudents(); break;
    case 'student':    renderStudentDetail(+param); break;
    case 'classes':    renderClasses(); break;
    case 'analytics':  renderAnalytics(); break;
    case 'journal':    renderJournal(); break;
    case 'subject-teachers': renderSubjectTeachers(); break;
    case 'teacher':    renderTeacherDetail(+param); break;
    case 'directories': renderDirectories(); break;
    case 'users':       renderUsers(); break;
    case 'backup':      renderBackup(); break;
    default: renderDashboard();
  }
}

/* Перезапускаем рендер */
if (SESSION) render();

  /* ============================================================
     РАСШИРЕНИЕ БД
     ============================================================ */
  function migrateData() {
    const d = DB.load();
    let changed = false;
    if (!d.diagnosticTemplates) {
      d.diagnosticTemplates = getDefaultTemplates();
      changed = true;
    }
    if (!d.taskResults) {
      d.taskResults = [];
      changed = true;
    }
    if (!d.nextIds.templateId) {
      d.nextIds.templateId = d.diagnosticTemplates.length + 1;
      changed = true;
    }
    if (!d.nextIds.taskResultId) {
      d.nextIds.taskResultId = 1;
      changed = true;
    }
    if (changed) DB.save();
  }

  /* ---------- Методы БД ---------- */
  function getTemplates() { return DB.load().diagnosticTemplates || []; }
  function getTaskResults() { return DB.load().taskResults || []; }

  function addTemplate(t) {
    const d = DB.load();
    t.id = d.nextIds.templateId++;
    d.diagnosticTemplates.push(t);
    DB.save();
    return t;
  }
  function updateTemplate(id, patch) {
    const d = DB.load();
    const t = d.diagnosticTemplates.find(x => x.id === id);
    if (t) Object.assign(t, patch);
    DB.save();
  }
  function deleteTemplate(id) {
    const d = DB.load();
    d.diagnosticTemplates = d.diagnosticTemplates.filter(t => t.id !== id);
    d.taskResults = d.taskResults.filter(r => r.templateId !== id);
    DB.save();
  }

  function saveTaskResult(studentId, templateId, scores) {
    const d = DB.load();
    const existing = d.taskResults.find(r => r.studentId === studentId && r.templateId === templateId);
    const template = d.diagnosticTemplates.find(t => t.id === templateId);

    if (existing) {
      existing.scores = scores;
      existing.date = _todayStr();
    } else {
      d.taskResults.push({
        id: d.nextIds.taskResultId++,
        studentId, templateId,
        date: _todayStr(),
        scores: { ...scores },
      });
    }

    // Синхронизация с diagnostics — чтобы карточка ученика и графики подтянули
    const total = template.tasks.length;
    const done = template.tasks.filter(t => scores[t.num] === 1).length;
    const percent = total ? Math.round(done / total * 100) : 0;
    const level = percent >= 80 ? 'высокий' : percent >= 50 ? 'базовый' : 'низкий';

    const dgExist = d.diagnostics.find(x => x.studentId === studentId
      && x.templateId === templateId);
    const dgData = {
      studentId,
      title: template.name,
      type: template.type,
      subject: template.subject,
      date: _todayStr(),
      result: `${done}/${total}`,
      score: done,
      maxScore: total,
      level: level,
      comment: `Автоматически из аналитики по темам (${percent}%)`,
      templateId,
    };
    if (dgExist) {
      Object.assign(dgExist, dgData);
    } else {
      dgData.id = d.nextIds.diagnostic++;
      d.diagnostics.push(dgData);
    }
    DB.save();
  }

  function deleteTaskResult(id) {
    const d = DB.load();
    const r = d.taskResults.find(x => x.id === id);
    if (r) {
      d.diagnostics = d.diagnostics.filter(x => !(x.studentId === r.studentId && x.templateId === r.templateId));
    }
    d.taskResults = d.taskResults.filter(x => x.id !== id);
    DB.save();
  }

  /* ============================================================
     АНАЛИТИКА ПО ТЕМАМ
     ============================================================ */
  function computeTopicStats(template, results) {
    if (!template || !results || !results.length) return [];
    const topics = {};
    template.tasks.forEach(t => {
      if (!topics[t.topic]) topics[t.topic] = [];
      topics[t.topic].push(t);
    });
    const out = [];
    Object.entries(topics).forEach(([topic, tasks]) => {
      let done = 0, total = 0;
      results.forEach(r => {
        tasks.forEach(t => {
          total++;
          if (r.scores && r.scores[t.num] === 1) done++;
        });
      });
      const percent = total ? Math.round(done / total * 100) : 0;
      const level = percent >= 80 ? 'высокий' : percent >= 50 ? 'базовый' : 'низкий';
      out.push({ topic, done, total, percent, level, tasksCount: tasks.length });
    });
    out.sort((a, b) => a.percent - b.percent);
    return out;
  }

  function levelBadge(level) {
    if (level === 'высокий') return 'badge-green';
    if (level === 'базовый') return 'badge-orange';
    if (level === 'низкий') return 'badge-red';
    return 'badge-gray';
  }
  function levelColor(level) {
    if (level === 'высокий') return 'var(--success)';
    if (level === 'базовый') return 'var(--warning)';
    if (level === 'низкий') return 'var(--danger)';
    return 'var(--text-muted)';
  }

          let v = inputState.draft[k];
          if (v === undefined) {
            const ex = existingResults[s.id];
            v = ex && ex.scores ? (ex.scores[Number(k.split('|')[1])] === 1 ? 1 : 0) : null;
          }
          if (v === 1) done++;
        });
        const total = template.tasks.length;
        const pct = total ? Math.round(done / total * 100) : 0;
        return `<tr>
          <td class="name-cell" style="position:sticky;left:0;background:var(--bg-card);z-index:2;border-right:2px solid var(--border);min-width:180px;padding:8px 12px;font-weight:600;">
            ${_esc(_fullName(s))}
          </td>
          ${cells}
          <td class="text-right nowrap" style="padding:6px 12px;font-weight:700;color:var(--primary);">
            ${done}/${total} <span class="muted">(${pct}%)</span>
          </td>
        </tr>`;
      }).join('');

      matrix = `
        <div class="table-wrap" style="max-height:60vh;overflow:auto;border:1px solid var(--border);border-radius:10px;">
          <table style="border-collapse:separate;border-spacing:0;font-size:13px;min-width:max-content;">
            <thead>
              <tr>
                <th style="position:sticky;left:0;top:0;z-index:3;background:var(--primary);color:#fff;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);">ФИО</th>
                ${headerTasks}
                <th style="position:sticky;top:0;background:var(--primary);color:#fff;padding:10px 12px;border-bottom:1px solid var(--border);">Итого</th>
              </tr>
            </thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>
      `;
    } else if (!template) {
      matrix = `<div class="empty"><div class="empty-icon">📋</div><div>Сначала создайте шаблон диагностики</div></div>`;
    } else if (!students.length) {
      matrix = `<div class="empty"><div class="empty-icon">👥</div><div>В выбранном классе нет учеников</div></div>`;
    }

    return `
      <div class="card">
        <div class="row-flex" style="justify-content:space-between;margin-bottom:16px;">
          <h2 style="margin:0;">${_icon('edit', 18)} Ввод результатов по заданиям</h2>
          <div class="btn-group">
            <button class="btn btn-outline btn-sm" onclick="diagFillAll(1)">Все ✓</button>
            <button class="btn btn-outline btn-sm" onclick="diagFillAll(0)">Все ✗</button>
            <button class="btn btn-outline btn-sm" onclick="diagClearAll()">Очистить</button>
          </div>
        </div>
        <div class="form-grid mb-16">
          <div class="form-group"><label>Шаблон</label>
            <select onchange="inputState.templateId=this.value;inputState.draft={};renderDiagnosticsPage('input');">
              ${templates.map(t => `<option value="${t.id}" ${inputState.templateId==t.id?'selected':''}>${_esc(t.name)}</option>`).join('')}
            </select></div>
          <div class="form-group"><label>Класс</label>
            <select onchange="inputState.classId=this.value;inputState.draft={};renderDiagnosticsPage('input');">
              ${classes.map(c => `<option value="${c.id}" ${inputState.classId==c.id?'selected':''}>${_esc(c.name)}</option>`).join('')}
            </select></div>
        </div>
        <div class="alert alert-info" style="font-size:13px;">
          ${_icon('info', 14)} Кликните по ячейке, чтобы переключить: <b>·</b> → <b>✓</b> (справился) → <b>✗</b> (не справился) → <b>·</b>.
        </div>
        ${matrix}
        ${(template && students.length) ? `
          <div class="form-actions" style="margin-top:16px;">
            <button class="btn btn-primary" onclick="diagSaveInput()">
              ${_icon('save', 14)} Сохранить результаты
            </button>
          </div>
        ` : ''}
      </div>

      <style>
        .diag-cell-ok { background: #c6f6d5; color: #22543d; border: 2px solid #38a169; }
        .diag-cell-ok:hover { transform: scale(1.05); }
        .diag-cell-fail { background: #fed7d7; color: #742a2a; border: 2px solid #c53030; }
        .diag-cell-fail:hover { transform: scale(1.05); }
        .diag-cell-empty { background: var(--bg-hover); color: var(--text-muted); border: 2px dashed var(--border-strong); }
        .diag-cell-empty:hover { border-color: var(--primary); }
        html[data-theme="dark"] .diag-cell-ok { background: rgba(72,187,120,.25); color: #9ae6b4; }
        html[data-theme="dark"] .diag-cell-fail { background: rgba(229,62,62,.25); color: #fc8181; }
      </style>
    `;
  }

  window.inputState = inputState;

  window.diagToggle = function(sid, num) {
    const key = `${sid}|${num}`;
    const cur = inputState.draft[key];
    if (cur === undefined) inputState.draft[key] = 1;
    else if (cur === 1) inputState.draft[key] = 0;
    else delete inputState.draft[key];
    renderDiagnosticsPage('input');
  };

  window.diagFillAll = function(val) {
    const template = getTemplates().find(t => t.id === +inputState.templateId);
    if (!template) return;
    const students = DB.getStudents().filter(s => s.classId === +inputState.classId);
    students.forEach(s => template.tasks.forEach(t => {
      inputState.draft[`${s.id}|${t.num}`] = val;
    }));
    renderDiagnosticsPage('input');
  };
  window.diagClearAll = function() {
    inputState.draft = {};
    renderDiagnosticsPage('input');
  };

  window.diagSaveInput = function() {
    const template = getTemplates().find(t => t.id === +inputState.templateId);
    if (!template) { _toast('Шаблон не найден', 'error'); return; }
    const students = DB.getStudents().filter(s => s.classId === +inputState.classId);
    if (!students.length) { _toast('Нет учеников', 'error'); return; }

    // Собираем итоговые scores для каждого ученика
    const results = {};
    students.forEach(s => {
      const scores = {};
      let hasAny = false;
      template.tasks.forEach(t => {
        const key = `${s.id}|${t.num}`;
        let v = inputState.draft[key];
        if (v === undefined) {
          // Берём из существующего
          const ex = getTaskResults().find(r => r.studentId === s.id && r.templateId === template.id);
          v = ex && ex.scores ? (ex.scores[t.num] === 1 ? 1 : 0) : null;
        }
        if (v === 1 || v === 0) { scores[t.num] = v; hasAny = true; }
      });
      if (hasAny) results[s.id] = scores;
    });

    const count = Object.keys(results).length;
    if (!count) { _toast('Нет данных для сохранения', 'error'); return; }

    Object.entries(results).forEach(([sid, scores]) => {
      saveTaskResult(+sid, template.id, scores);
    });
    inputState.draft = {};
    _toast(`Сохранено: ${count} учеников`, 'success');
    renderDiagnosticsPage('input');
  };

  /* ============================================================
     ВКЛАДКА «АНАЛИТИКА»
     ============================================================ */
  let analyticsState = {
    mode: 'class', // 'class' | 'student'
    templateId: '',
    classId: '',
    studentId: '',
  };

  function renderAnalyticsTab() {
    const templates = getTemplates();
    const classes = allowedClasses();
    if (!analyticsState.templateId && templates.length) analyticsState.templateId = String(templates[0].id);
    if (!analyticsState.classId && classes.length) analyticsState.classId = String(classes[0].id);

    const controls = `
      <div class="card">
        <div class="subtabs" style="margin-bottom:16px;">
          <button class="${analyticsState.mode==='class'?'active':''}"
                  onclick="analyticsState.mode='class';renderDiagnosticsPage('analytics');">
            ${_icon('users', 14)} По классу
          </button>
          <button class="${analyticsState.mode==='student'?'active':''}"
                  onclick="analyticsState.mode='student';renderDiagnosticsPage('analytics');">
            ${_icon('user', 14)} По ученику
          </button>
        </div>
        <div class="form-grid">
          <div class="form-group"><label>Шаблон</label>
            <select onchange="analyticsState.templateId=this.value;renderDiagnosticsPage('analytics');">
              ${templates.map(t => `<option value="${t.id}" ${analyticsState.templateId==t.id?'selected':''}>${_esc(t.name)}</option>`).join('')}
            </select></div>
          ${analyticsState.mode==='class' ? `
            <div class="form-group"><label>Класс</label>
              <select onchange="analyticsState.classId=this.value;renderDiagnosticsPage('analytics');">
                ${classes.map(c => `<option value="${c.id}" ${analyticsState.classId==c.id?'selected':''}>${_esc(c.name)}</option>`).join('')}
              </select></div>
          ` : `
            <div class="form-group"><label>Класс</label>
              <select onchange="analyticsState.classId=this.value;analyticsState.studentId='';renderDiagnosticsPage('analytics');">
                ${classes.map(c => `<option value="${c.id}" ${analyticsState.classId==c.id?'selected':''}>${_esc(c.name)}</option>`).join('')}
              </select></div>
            <div class="form-group"><label>Ученик</label>
              <select onchange="analyticsState.studentId=this.value;renderDiagnosticsPage('analytics');">
                <option value="">— выберите —</option>
                ${DB.getStudents().filter(s => s.classId === +analyticsState.classId)
                  .sort((a,b) => a.lastName.localeCompare(b.lastName, 'ru'))
                  .map(s => `<option value="${s.id}" ${analyticsState.studentId==s.id?'selected':''}>${_esc(_fullName(s))}</option>`).join('')}
              </select></div>
          `}
        </div>
      </div>
    `;

    if (analyticsState.mode === 'class') {
      return controls + renderClassAnalytics();
    } else {
      return controls + renderStudentAnalytics();
    }
  }

  window.analyticsState = analyticsState;

  function renderClassAnalytics() {
    const template = getTemplates().find(t => t.id === +analyticsState.templateId);
    const students = DB.getStudents().filter(s => s.classId === +analyticsState.classId);
    if (!template) return `<div class="card"><div class="empty">Шаблон не выбран</div></div>`;
    if (!students.length) return `<div class="card"><div class="empty">В классе нет учеников</div></div>`;

    const sids = students.map(s => s.id);
    const results = getTaskResults().filter(r => r.templateId === template.id && sids.includes(r.studentId));
    if (!results.length) return `<div class="card"><div class="empty">
      <div class="empty-icon">📊</div>
      <div>Результатов по этой работе ещё нет</div>
      <button class="btn btn-primary btn-sm" onclick="diagGo('input')">
        ${_icon('edit', 14)} Перейти к вводу результатов
      </button>
    </div></div>`;

    const stats = computeTopicStats(template, results);
    const classObj = DB.getClasses().find(c => c.id === +analyticsState.classId);

    // Общая сводка
    let totalDone = 0, totalTasks = 0;
    results.forEach(r => {
      template.tasks.forEach(t => {
        totalTasks++;
        if (r.scores[t.num] === 1) totalDone++;
      });
    });
    const overallPct = totalTasks ? Math.round(totalDone / totalTasks * 100) : 0;
    const overallLevel = overallPct >= 80 ? 'высокий' : overallPct >= 50 ? 'базовый' : 'низкий';

    const topicRows = stats.map(s => `
      <tr>
        <td><b>${_esc(s.topic)}</b></td>
        <td class="text-right">${s.tasksCount}</td>
        <td class="text-right">${s.done} / ${s.total}</td>
        <td class="text-right">
          <b style="color:${levelColor(s.level)};">${s.percent}%</b>
        </td>
        <td class="text-right">
          <span class="badge ${levelBadge(s.level)}">${s.level}</span>
        </td>
      </tr>
    `).join('');

    // Топ проблемных тем (нижние 3)
    const problems = stats.slice(0, 3).filter(s => s.percent < 80);

    return `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="num">${results.length}</div>
          <div class="lbl">Учеников прошли</div>
        </div>
        <div class="stat-card">
          <div class="num">${template.tasks.length}</div>
          <div class="lbl">Заданий всего</div>
        </div>
        <div class="stat-card">
          <div class="num">${stats.length}</div>
          <div class="lbl">Тем</div>
        </div>
        <div class="stat-card" style="border-left-color:${levelColor(overallLevel)};">
          <div class="num" style="color:${levelColor(overallLevel)};">${overallPct}%</div>
          <div class="lbl">Выполнено · ${overallLevel}</div>
        </div>
      </div>

      ${problems.length ? `<div class="card">
        <h2>${_icon('alert', 18)} Западающие темы в классе</h2>
        <div class="row-flex" style="gap:12px;flex-wrap:wrap;">
          ${problems.map(p => `
            <div class="card" style="flex:1;min-width:220px;margin:0;border-left:4px solid ${levelColor(p.level)};">
              <div style="font-weight:700;color:var(--primary);margin-bottom:6px;">${_esc(p.topic)}</div>
              <div style="font-size:28px;font-weight:700;color:${levelColor(p.level)};">${p.percent}%</div>
              <div class="muted">${p.done} из ${p.total} заданий</div>
            </div>
          `).join('')}
        </div>
      </div>` : ''}

      <div class="card">
        <div class="row-flex" style="justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
          <h2 style="margin:0;">${_icon('chart', 18)} Аналитика по темам · ${_esc(classObj ? classObj.name : '')}</h2>
          <button class="btn btn-success btn-sm" onclick="diagExportClassXlsx()">
            ${_icon('file-excel', 14)} Excel
          </button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Тема</th>
              <th class="text-right">Заданий</th>
              <th class="text-right">Справились</th>
              <th class="text-right">Процент</th>
              <th class="text-right">Уровень</th>
            </tr></thead>
            <tbody>${topicRows}</tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>${_icon('bar-chart', 18)} Процент выполнения по темам</h2>
        <div class="chart-box-lg"><canvas id="diagClassChart"></canvas></div>
      </div>

      <script>window._diagClassChartData = ${JSON.stringify(stats.map(s => ({ topic: s.topic, percent: s.percent, level: s.level })))};<\/script>
    `;
  }

  function renderStudentAnalytics() {
    if (!analyticsState.studentId) {
      return `<div class="card"><div class="empty">
        <div class="empty-icon">👤</div>
        <div>Выберите ученика</div>
      </div></div>`;
    }
    const template = getTemplates().find(t => t.id === +analyticsState.templateId);
    const student = DB.getStudent(+analyticsState.studentId);
    if (!template || !student) return `<div class="card"><div class="empty">Нет данных</div></div>`;

    const result = getTaskResults().find(r =>
      r.templateId === template.id && r.studentId === student.id);
    if (!result) {
      return `<div class="card"><div class="empty">
        <div class="empty-icon">📋</div>
        <div>Этот ученик ещё не проходил работу «${_esc(template.name)}»</div>
        <button class="btn btn-primary btn-sm" onclick="diagGo('input')">
          ${_icon('edit', 14)} Перейти к вводу
        </button>
      </div></div>`;
    }

    const stats = computeTopicStats(template, [result]);

    // Сводка
    let totalDone = 0;
    template.tasks.forEach(t => { if (result.scores[t.num] === 1) totalDone++; });
    const totalTasks = template.tasks.length;
    const overallPct = totalTasks ? Math.round(totalDone / totalTasks * 100) : 0;
    const overallLevel = overallPct >= 80 ? 'высокий' : overallPct >= 50 ? 'базовый' : 'низкий';

    // Для сравнения — данные по классу
    const classMates = DB.getStudents().filter(s => s.classId === student.classId);
    const classResults = getTaskResults().filter(r =>
      r.templateId === template.id && classMates.some(s => s.id === r.studentId));
    const classStats = computeTopicStats(template, classResults);
    const classTopicMap = {};
    classStats.forEach(s => { classTopicMap[s.topic] = s.percent; });

    const topicRows = stats.map(s => {
      const classPct = classTopicMap[s.topic] || 0;
      const diff = s.percent - classPct;
      const diffText = diff > 0 ? `+${diff}%` : diff < 0 ? `${diff}%` : '—';
      const diffColor = diff > 0 ? 'var(--success)' : diff < 0 ? 'var(--danger)' : 'var(--text-muted)';
      return `<tr>
        <td><b>${_esc(s.topic)}</b></td>
        <td class="text-right">${s.tasksCount}</td>
        <td class="text-right">${s.done} / ${s.total}</td>
        <td class="text-right"><b style="color:${levelColor(s.level)};">${s.percent}%</b></td>
        <td class="text-right"><span class="badge ${levelBadge(s.level)}">${s.level}</span></td>
        <td class="text-right"><b style="color:${diffColor};">${diffText}</b></td>
      </tr>`;
    }).join('');

    const problems = stats.slice(0, 3).filter(s => s.percent < 80);

    // Разбор заданий
    const taskRows = template.tasks.map(t => {
      const ok = result.scores[t.num] === 1;
      return `<tr>
        <td class="text-right"><b>${t.num}</b></td>
        <td>${_esc(t.topic)}</td>
        <td class="text-right">
          <span class="badge ${ok ? 'badge-green' : 'badge-red'}">
            ${ok ? '✓ справился' : '✗ не справился'}
          </span>
        </td>
      </tr>`;
    }).join('');

    return `
      <div class="card">
        <div class="row-flex" style="justify-content:space-between;align-items:flex-start;gap:12px;">
          <div>
            <h2 style="margin-bottom:6px;">${_esc(_fullName(student))}</h2>
            <div class="muted">Работа: <b>${_esc(template.name)}</b> · ${_esc(_fmtDate(result.date))}</div>
          </div>
          <span class="badge ${levelBadge(overallLevel)}" style="font-size:14px;padding:6px 14px;">
            ${overallLevel} · ${overallPct}%
          </span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="num">${totalDone}</div><div class="lbl">Справился</div></div>
        <div class="stat-card"><div class="num">${totalTasks - totalDone}</div><div class="lbl">Не справился</div></div>
        <div class="stat-card"><div class="num">${stats.length}</div><div class="lbl">Тем</div></div>
        <div class="stat-card" style="border-left-color:${levelColor(overallLevel)};">
          <div class="num" style="color:${levelColor(overallLevel)};">${overallPct}%</div>
          <div class="lbl">Общий результат</div>
        </div>
      </div>

      ${problems.length ? `<div class="card">
        <h2>${_icon('alert', 18)} Западающие темы</h2>
        <div class="row-flex" style="gap:12px;flex-wrap:wrap;">
          ${problems.map(p => `
            <div class="card" style="flex:1;min-width:220px;margin:0;border-left:4px solid ${levelColor(p.level)};">
              <div style="font-weight:700;color:var(--primary);margin-bottom:6px;">${_esc(p.topic)}</div>
              <div style="font-size:28px;font-weight:700;color:${levelColor(p.level)};">${p.percent}%</div>
              <div class="muted">${p.done} из ${p.total} заданий</div>
            </div>
          `).join('')}
        </div>
      </div>` : ''}

      <div class="card">
        <h2>${_icon('chart', 18)} Сравнение с классом</h2>
        <div class="table-wrap"><table>
          <thead><tr>
            <th>Тема</th><th class="text-right">Заданий</th>
            <th class="text-right">Справился</th>
            <th class="text-right">% ученика</th>
            <th class="text-right">Уровень</th>
            <th class="text-right">% класса</th>
          </tr></thead>
          <tbody>${topicRows}</tbody>
        </table></div>
      </div>

      <div class="card">
        <h2>${_icon('bar-chart', 18)} Профиль выполнения по темам</h2>
        <div class="chart-box-lg"><canvas id="diagStudentChart"></canvas></div>
      </div>

      <div class="card">
        <h2>${_icon('list', 18)} Разбор по заданиям</h2>
        <div class="table-wrap"><table>
          <thead><tr><th class="text-right">№</th><th>Тема</th><th class="text-right">Результат</th></tr></thead>
          <tbody>${taskRows}</tbody>
        </table></div>
      </div>

      <script>
        window._diagStudentChartData = ${JSON.stringify(stats.map(s => ({
          topic: s.topic, percent: s.percent, level: s.level,
          classPercent: classTopicMap[s.topic] || 0
        })))};
      <\/script>
    `;
  }

  /* ============================================================
     ПОСТ-РЕНДЕР: графики
     ============================================================ */
  function afterRenderCharts() {
    // График класса
    const ctx1 = document.getElementById('diagClassChart');
    if (ctx1 && window._diagClassChartData) {
      const data = window._diagClassChartData;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const textColor = isDark ? '#cbd5e0' : '#475569';
      const gridColor = isDark ? '#2d3748' : '#e2e8f0';

      if (window._diagClassChart) window._diagClassChart.destroy();
      window._diagClassChart = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: data.map(d => d.topic.length > 25 ? d.topic.slice(0,23)+'…' : d.topic),
          datasets: [{
            label: '% выполнения',
            data: data.map(d => d.percent),
            backgroundColor: data.map(d =>
              d.percent >= 80 ? '#38a169' : d.percent >= 50 ? '#dd6b20' : '#e53e3e'),
            borderRadius: 8,
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => `${data[ctx.dataIndex].topic}: ${ctx.raw}%`,
              }
            }
          },
          scales: {
            x: { min: 0, max: 100, ticks: { font: { size: 11 }, color: textColor }, grid: { color: gridColor } },
            y: { ticks: { font: { size: 11 }, color: textColor }, grid: { display: false } }
          }
        }
      });
    }

    // График ученика
    const ctx2 = document.getElementById('diagStudentChart');
    if (ctx2 && window._diagStudentChartData) {
      const data = window._diagStudentChartData;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const textColor = isDark ? '#cbd5e0' : '#475569';
      const gridColor = isDark ? '#2d3748' : '#e2e8f0';

      if (window._diagStudentChart) window._diagStudentChart.destroy();
      window._diagStudentChart = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: data.map(d => d.topic.length > 25 ? d.topic.slice(0,23)+'…' : d.topic),
          datasets: [
            {
              label: '% ученика',
              data: data.map(d => d.percent),
              backgroundColor: data.map(d =>
                d.percent >= 80 ? '#38a169' : d.percent >= 50 ? '#dd6b20' : '#e53e3e'),
              borderRadius: 8,
            },
            {
              label: '% класса',
              data: data.map(d => d.classPercent),
              backgroundColor: 'rgba(44,82,130,.25)',
              borderRadius: 8,
            }
          ]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { font: { size: 11 }, color: textColor } },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${ctx.raw}%`,
              }
            }
          },
          scales: {
            x: { min: 0, max: 100, ticks: { font: { size: 11 }, color: textColor }, grid: { color: gridColor } },
            y: { ticks: { font: { size: 11 }, color: textColor }, grid: { display: false } }
          }
        }
      });
    }
  }

  /* ============================================================
     ЭКСПОРТ В EXCEL
     ============================================================ */
  window.diagExportClassXlsx = function() {
    if (typeof XLSX === 'undefined') { _toast('Библиотека XLSX не загружена', 'error'); return; }
    const template = getTemplates().find(t => t.id === +analyticsState.templateId);
    const classObj = DB.getClasses().find(c => c.id === +analyticsState.classId);
    if (!template || !classObj) { _toast('Выберите шаблон и класс', 'error'); return; }
    const students = DB.getStudents().filter(s => s.classId === classObj.id);
    const sids = students.map(s => s.id);
    const results = getTaskResults().filter(r => r.templateId === template.id && sids.includes(r.studentId));
    if (!results.length) { _toast('Нет данных', 'error'); return; }

    const stats = computeTopicStats(template, results);

    // Лист 1 — сводка по темам
    const rows1 = [['Тема', 'Заданий', 'Справились', 'Всего', 'Процент', 'Уровень']];
    const colored1 = [];
    stats.forEach((s, i) => {
      rows1.push([s.topic, s.tasksCount, s.done, s.total, s.percent, s.level]);
      const bg = s.percent >= 80 ? 'C6F6D5' : s.percent >= 50 ? 'FEFCBF' : 'FED7D7';
      colored1.push({ r: i + 1, c: 4, bg, bold: true });
    });

    // Лист 2 — по ученикам
    const header2 = ['ФИО', ...template.tasks.map(t => `№${t.num}`), 'Итого', '%'];
    const rows2 = [header2];
    const colored2 = [];
    students.forEach((s, ri) => {
      const r = results.find(x => x.studentId === s.id);
      const row = [_fullName(s)];
      let done = 0;
      template.tasks.forEach((t, ci) => {
        const ok = r && r.scores && r.scores[t.num] === 1;
        row.push(ok ? '✓' : '✗');
        if (ok) done++;
        colored2.push({
          r: ri + 1, c: ci + 1,
          bg: ok ? 'C6F6D5' : 'FED7D7', bold: false
        });
      });
      const total = template.tasks.length;
      const pct = total ? Math.round(done / total * 100) : 0;
      row.push(`${done}/${total}`, `${pct}%`);
      rows2.push(row);
      colored2.push({
        r: ri + 1, c: template.tasks.length + 2,
        bg: pct >= 80 ? 'C6F6D5' : pct >= 50 ? 'FEFCBF' : 'FED7D7', bold: true
      });
    });

    // Лист 3 — по темам × ученикам
    const topicsSet = [...new Set(template.tasks.map(t => t.topic))];
    const header3 = ['ФИО', ...topicsSet];
    const rows3 = [header3];
    const colored3 = [];
    students.forEach((s, ri) => {
      const r = results.find(x => x.studentId === s.id);
      const row = [_fullName(s)];
      topicsSet.forEach((topic, ci) => {
        const topicTasks = template.tasks.filter(t => t.topic === topic);
        let done = 0;
        topicTasks.forEach(t => {
          if (r && r.scores && r.scores[t.num] === 1) done++;
        });
        const pct = topicTasks.length ? Math.round(done / topicTasks.length * 100) : 0;
        row.push(`${pct}%`);
        const bg = pct >= 80 ? 'C6F6D5' : pct >= 50 ? 'FEFCBF' : 'FED7D7';
        colored3.push({ r: ri + 1, c: ci + 1, bg, bold: false });
      });
      rows3.push(row);
    });

    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.aoa_to_sheet(rows1);
    ws1['!cols'] = [{ wch: 35 }, { wch: 10 }, { wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 12 }];
    colored1.forEach(c => {
      const addr = XLSX.utils.encode_cell({ r: c.r, c: c.c });
      if (ws1[addr]) ws1[addr].s = { fill: { fgColor: { rgb: c.bg } }, font: { bold: c.bold } };
    });
    XLSX.utils.book_append_sheet(wb, ws1, 'Темы');

    const ws2 = XLSX.utils.aoa_to_sheet(rows2);
    ws2['!cols'] = [{ wch: 30 }, ...template.tasks.map(() => ({ wch: 6 })), { wch: 10 }, { wch: 8 }];
    colored2.forEach(c => {
      const addr = XLSX.utils.encode_cell({ r: c.r, c: c.c });
      if (ws2[addr]) ws2[addr].s = { fill: { fgColor: { rgb: c.bg } }, font: { bold: c.bold } };
    });
    XLSX.utils.book_append_sheet(wb, ws2, 'По заданиям');

    const ws3 = XLSX.utils.aoa_to_sheet(rows3);
    ws3['!cols'] = [{ wch: 30 }, ...topicsSet.map(() => ({ wch: 18 }))];
    colored3.forEach(c => {
      const addr = XLSX.utils.encode_cell({ r: c.r, c: c.c });
      if (ws3[addr]) ws3[addr].s = { fill: { fgColor: { rgb: c.bg } }, font: { bold: c.bold } };
    });
    XLSX.utils.book_append_sheet(wb, ws3, 'По темам');

    XLSX.writeFile(wb, `Диагностика_${classObj.name}_${template.name.replace(/\s+/g,'_')}.xlsx`);
    _toast('Excel сохранён', 'success');
  };

  /* ============================================================
     ИНИЦИАЛИЗАЦИЯ
     ============================================================ */
  function init() {
    if (typeof DB === 'undefined' || typeof SESSION === 'undefined') {
      console.warn('[Diagnostics] DB или SESSION не найдены');
      return;
    }
    migrateData();

    // Переопределяем render() для маршрута #diagnostics
    const _origRender = window.render;
    if (typeof _origRender === 'function') {
      window.render = function() {
        try {
          const hash = location.hash.replace('#', '') || 'dashboard';
          const parts = hash.split('/');
          const route = parts[0];
          const sub = parts[1];

          if (route === 'diagnostics') {
            renderDiagnosticsPage(sub || 'templates');
            return;
          }
        } catch (e) {
          console.error('[Diagnostics render]', e);
        }
        return _origRender.apply(this, arguments);
      };
    }

    // Переопределяем renderNav для добавления кнопки
    const _origNav = window.renderNav;
    if (typeof _origNav === 'function') {
      window.renderNav = function(active) {
        const html = _origNav.apply(this, arguments);
        if (typeof html !== 'string') return html;
        const btn = `<button class="${active==='diagnostics'?'active':''}"
          onclick="go('diagnostics/templates')" title="Диагностики с аналитикой по темам">
          ${_icon('check', 16)} <span>Диагностики</span>
        </button>`;
        return html.replace('</nav>', btn + '</nav>');
      };
    }

    // Перерисовываем, чтобы кнопка появилась
    if (typeof SESSION !== 'undefined' && SESSION) {
      window.render();
    }

    console.log('[Diagnostics] Модуль загружен');
  }

  if (document.readyState === 'complete') {
    setTimeout(init, 200);
  } else {
    window.addEventListener('load', function() {
      setTimeout(init, 200);
    });
  }

})();
</script>
<script>
/* ============================================================
   FIX для модуля «Диагностики» v1.1
   Перехватывает hashchange раньше всех и принудительно
   отрисовывает страницу диагностик при #diagnostics/*
   ============================================================ */
(function() {
  'use strict';

  // Функция, которая решает, что рендерить
  function routeHandler() {
    const hash = location.hash.replace('#', '') || 'dashboard';
    const parts = hash.split('/');
    const route = parts[0];
    const sub = parts[1] || 'templates';

    if (route === 'diagnostics') {
      // Проверяем, что модуль диагностик загружен
      if (typeof window.renderDiagnosticsPage === 'function') {
        try {
          window.renderDiagnosticsPage(sub);
        } catch (e) {
          console.error('[FIX diagnostics]', e);
          alert('Ошибка при открытии раздела «Диагностики»: ' + e.message);
        }
        return;
      } else {
        console.warn('[FIX diagnostics] renderDiagnosticsPage не найден');
      }
    }

    // Для всех остальных маршрутов — вызываем стандартный render()
    // Находим «настоящий» render через window
    if (typeof window.__originalRender === 'function') {
      window.__originalRender();
    } else if (typeof render === 'function') {
      render();
    }
  }

  // Сохраняем текущий render как «оригинальный» один раз
  if (!window.__originalRender && typeof window.render === 'function') {
    window.__originalRender = window.render;
  }

  // Перехватываем hashchange в capture-фазе (срабатывает раньше всех)
  window.addEventListener('hashchange', function(e) {
    // Небольшая задержка, чтобы другие слушатели успели отработать,
    // затем принудительно вызываем наш роутер
    setTimeout(routeHandler, 10);
  }, true);

  // Также перехватываем popstate (для совместимости)
  window.addEventListener('popstate', function() {
    setTimeout(routeHandler, 10);
  }, true);

  // Обрабатываем клики по ссылкам с диагностикой
  document.addEventListener('click', function(e) {
    const target = e.target.closest('[onclick*="diagnostics"], [onclick*="diagGo"]');
    if (!target) return;
    // Через 50 мс после клика — принудительно рендерим
    setTimeout(function() {
      const hash = location.hash.replace('#', '');
      if (hash.startsWith('diagnostics')) {
        routeHandler();
      }
    }, 50);
  }, true);

  // После загрузки страницы — если мы на #diagnostics, сразу рендерим
  window.addEventListener('load', function() {
    setTimeout(function() {
      const hash = location.hash.replace('#', '');
      if (hash.startsWith('diagnostics')) {
        routeHandler();
      }
    }, 300);
  });

  // Немедленно — если хэш уже #diagnostics
  setTimeout(function() {
    const hash = location.hash.replace('#', '');
    if (hash.startsWith('diagnostics')) {
      routeHandler();
    }
  }, 500);

  console.log('[FIX diagnostics] Перехватчик установлен');

})();
</script>

(function() {

  // Простая и надёжная функция навигации
  window.__openDiagnostics = function(sub) {

      try {

    location.hash = hash;
