<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#1e3a5f">
<meta name="description" content="Школьная аналитика — система учёта успеваемости и диагностик">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Школьная аналитика">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%231e3a5f'/%3E%3Ctext x='96' y='128' font-size='96' text-anchor='middle' fill='white' font-family='Arial'%3E📊%3C/text%3E%3C/svg%3E">
<title>Школьная аналитика</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  /* ============================================================
     ДИЗАЙН-СИСТЕМА
     Типографика: 12/14/17/22/28
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-body: #f0f2f5;
    --bg-card: #ffffff;
    --bg-elevated: #ffffff;
    --bg-hover: #f8fafc;
    --bg-input: #f8fafc;
    --border: #e2e8f0;
    --border-strong: #cbd5e0;
    --text: #1a1a2e;
    --text-2: #2d3748;
    --text-muted: #64748b;
    --text-disabled: #94a3b8;
    --primary: #2c5282;
    --primary-dark: #1e3a5f;
    --primary-light: #3182ce;
    --success: #38a169;
    --warning: #dd6b20;
    --danger: #c53030;
    --purple: #805ad5;
    --shadow: 0 1px 6px rgba(0,0,0,.07);
    --shadow-lg: 0 20px 50px rgba(0,0,0,.25);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 14px;
  }

  html[data-theme="dark"] {
    --bg-body: #0f1419;
    --bg-card: #1a2028;
    --bg-elevated: #232b35;
    --bg-hover: #232b35;
    --bg-input: #232b35;
    --border: #2d3748;
    --border-strong: #4a5568;
    --text: #e2e8f0;
    --text-2: #cbd5e0;
    --text-muted: #94a3b8;
    --text-disabled: #64748b;
    --primary: #4299e1;
    --primary-dark: #3182ce;
    --primary-light: #63b3ed;
    --shadow: 0 1px 6px rgba(0,0,0,.4);
    --shadow-lg: 0 20px 50px rgba(0,0,0,.6);
  }

  body {
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    background: var(--bg-body);
    color: var(--text);
    transition: background .25s ease, color .25s ease;
    overflow-x: hidden;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  /* Кастомные скроллбары */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
  }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 4px;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ============================================================
     ТИПОГРАФИКА — единая шкала
     ============================================================ */
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.4px; }
  h2 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  h3 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  h4 { font-size: 14px; font-weight: 600; }
  .t-lg { font-size: 17px; }
  .t-md { font-size: 14px; }
  .t-sm { font-size: 12px; }

  /* ============================================================
     АНИМАЦИИ
     ============================================================ */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
  }
  @keyframes skeleton {
    0%   { background-position: -200px 0; }
    100% { background-position: calc(200px + 100%) 0; }
  }

  .card { animation: fadeInUp .35s ease; }
  .stat-card { animation: fadeInUp .35s ease backwards; }
  .stat-card:nth-child(1) { animation-delay: .02s; }
  .stat-card:nth-child(2) { animation-delay: .06s; }
  .stat-card:nth-child(3) { animation-delay: .10s; }
  .stat-card:nth-child(4) { animation-delay: .14s; }
  .stat-card:nth-child(5) { animation-delay: .18s; }
  .stat-card:nth-child(6) { animation-delay: .22s; }

  /* Скелетоны */
  .skeleton {
    background: linear-gradient(90deg, var(--border) 0px, var(--bg-hover) 40px, var(--border) 80px);
    background-size: 200px 100%;
    animation: skeleton 1.4s infinite linear;
    border-radius: 6px;
  }
  .skeleton-line { height: 14px; margin-bottom: 8px; }
  .skeleton-line.short { width: 60%; }
  .skeleton-block { height: 80px; margin-bottom: 12px; }

  /* ============================================================
     ШАПКА
     ============================================================ */
  header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
    position: sticky; top: 0; z-index: 100;
  }
  header .brand {
    font-size: 17px; font-weight: 700; letter-spacing: .3px; white-space: nowrap;
    display: flex; align-items: center; gap: 10px;
  }
  header .user-info { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
  header .user-info .role-badge {
    background: rgba(255,255,255,.2); padding: 3px 10px; border-radius: 20px; font-size: 12px;
  }
  header button {
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4);
    color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; transition: all .15s; font-family: inherit;
    min-height: 38px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  header button:hover { background: rgba(255,255,255,.3); transform: translateY(-1px); }
  header button:active { transform: translateY(1px); }
  header .theme-btn { background: rgba(255,255,255,.2); }
  header .undo-btn { background: #dd6b20; border-color: #dd6b20; font-weight: 600; }
  header .archive-btn { background: #805ad5; border-color: #805ad5; font-weight: 600; }
  header .mobile-toggle-btn { background: #38a169; border-color: #38a169; font-weight: 600; }
  header .mobile-toggle-btn.active { background: #c53030; border-color: #c53030; }

  /* ============================================================
     ОФФЛАЙН ИНДИКАТОР
     ============================================================ */
  .offline-indicator {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--warning); color: #fff; padding: 10px 20px; border-radius: 30px;
    font-size: 14px; font-weight: 600; z-index: 9999;
    box-shadow: var(--shadow-lg);
    display: none; align-items: center; gap: 8px;
  }
  .offline-indicator.visible { display: flex; animation: fadeInUp .3s ease; }

  /* ============================================================
     НАВИГАЦИЯ
     ============================================================ */
  nav.tabs {
    display: flex; background: var(--bg-card); border-bottom: 2px solid var(--border);
    padding: 0 24px; gap: 4px; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    position: sticky; top: 66px; z-index: 99;
    transition: background .25s ease;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    background: none; border: none; padding: 14px 20px; font-size: 14px;
    cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent;
    transition: all .2s; white-space: nowrap; font-family: inherit;
    min-height: 48px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  nav.tabs button:hover { color: var(--primary); background: var(--bg-hover); }
  nav.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

  /* ============================================================
     КОНТЕНТ
     ============================================================ */
  main { flex: 1; padding: 24px; max-width: 1600px; width: 100%; margin: 0 auto; }

  .card {
    background: var(--bg-card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow); margin-bottom: 20px;
    transition: background .25s ease, box-shadow .25s ease;
  }
  .card h2 { color: var(--primary); margin-bottom: 16px; }
  .card h3 { color: var(--text-2); margin: 12px 0 8px; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px; margin-bottom: 20px;
  }
  .stat-card {
    background: var(--bg-card); border-radius: var(--radius); padding: 20px; text-align: center;
    box-shadow: var(--shadow); border-left: 4px solid var(--primary);
    transition: all .2s ease;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }
  .stat-card .lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ============================================================
     ТАБЛИЦЫ
     ============================================================ */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th {
    background: var(--bg-hover); color: var(--text-2); font-weight: 600;
    font-size: 12px; text-transform: uppercase; letter-spacing: .3px;
  }
  tr:hover td { background: var(--bg-hover); }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ============================================================
     КНОПКИ
     ============================================================ */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer;
    font-size: 14px; font-weight: 500; transition: all .12s ease; text-decoration: none;
    font-family: inherit; min-height: 40px;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: #276749; color: #fff; }
  .btn-success:hover { background: #1c4532; }
  .btn-warn { background: #c05621; color: #fff; }
  .btn-warn:hover { background: #9c4221; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #9b2c2c; }
  .btn-outline { background: transparent; border: 1px solid var(--border-strong); color: var(--text-2); }
  .btn-outline:hover { background: var(--bg-hover); }
  .btn-sm { padding: 6px 10px; font-size: 12px; min-height: 34px; }
  .btn-icon { padding: 8px; min-width: 36px; justify-content: center; }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Иконки */
  .icon { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
  .icon-lg { width: 20px; height: 20px; stroke-width: 2; }

  /* ============================================================
     ФОРМЫ
     ============================================================ */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .form-group input, .form-group select, .form-group textarea {
    padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    font-size: 14px; font-family: inherit; transition: all .15s;
    background: var(--bg-input); color: var(--text);
    min-height: 42px;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(44,82,130,.15);
    background: var(--bg-card);
  }
  .form-actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }

  /* ============================================================
     МОДАЛКА
     ============================================================ */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
    animation: fadeIn .2s ease;
    backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--bg-card); border-radius: var(--radius-lg); padding: 28px;
    width: 100%; max-width: 900px;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg);
    animation: fadeInUp .25s ease;
    color: var(--text);
  }
  .modal h2 { margin-bottom: 20px; color: var(--primary); }
  .modal .close-btn {
    float: right; background: none; border: none; font-size: 24px;
    cursor: pointer; color: var(--text-disabled); line-height: 1;
    min-width: 40px; min-height: 40px;
    transition: color .15s;
  }
  .modal .close-btn:hover { color: var(--danger); }

  /* ============================================================
     БЕЙДЖИ
     ============================================================ */
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
  }
  .badge-blue { background: #ebf8ff; color: #2b6cb0; }
  .badge-green { background: #f0fff4; color: #276749; }
  .badge-orange { background: #fffaf0; color: #c05621; }
  .badge-red { background: #fff5f5; color: #c53030; }
  .badge-gray { background: #f1f5f9; color: #64748b; }
  .badge-purple { background: #faf5ff; color: #6b46c1; }

  html[data-theme="dark"] .badge-blue { background: rgba(66,153,225,.15); color: #63b3ed; }
  html[data-theme="dark"] .badge-green { background: rgba(72,187,120,.15); color: #68d391; }
  html[data-theme="dark"] .badge-orange { background: rgba(237,137,54,.15); color: #f6ad55; }
  html[data-theme="dark"] .badge-red { background: rgba(229,62,62,.15); color: #fc8181; }
  html[data-theme="dark"] .badge-gray { background: rgba(160,174,192,.15); color: #a0aec0; }
  html[data-theme="dark"] .badge-purple { background: rgba(128,90,213,.15); color: #b794f4; }

  .grade-chip {
    display: inline-block; min-width: 26px; padding: 2px 7px; border-radius: 5px;
    font-size: 12px; font-weight: 600; text-align: center; margin: 1px;
  }
  .grade-5 { background: #c6f6d5; color: #22543d; }
  .grade-4 { background: #bee3f8; color: #2a4365; }
  .grade-3 { background: #fefcbf; color: #744210; }
  .grade-2 { background: #fed7d7; color: #742a2a; }
  .grade-na { background: var(--border); color: var(--text-2); }

  /* ============================================================
     ПРОЧЕЕ
     ============================================================ */
  .search-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .search-bar input, .search-bar select {
    padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    font-size: 14px; font-family: inherit; min-height: 42px;
    background: var(--bg-input); color: var(--text);
  }
  .search-bar input { flex: 1; min-width: 200px; }

  .alert { padding: 12px 18px; border-radius: var(--radius-sm); margin-bottom: 14px; font-size: 14px; }
  .alert-info { background: #ebf8ff; color: #2c5282; border-left: 4px solid var(--primary-light); }
  .alert-warn { background: #fffaf0; color: #975a16; border-left: 4px solid var(--warning); }
  .alert-error { background: #fff5f5; color: #9b2c2c; border-left: 4px solid var(--danger); }
  .alert-success { background: #f0fff4; color: #276749; border-left: 4px solid var(--success); }

  html[data-theme="dark"] .alert-info { background: rgba(49,130,206,.1); color: #90cdf4; }
  html[data-theme="dark"] .alert-warn { background: rgba(221,107,32,.1); color: #fbd38d; }
  html[data-theme="dark"] .alert-error { background: rgba(197,48,48,.1); color: #fc8181; }
  html[data-theme="dark"] .alert-success { background: rgba(56,161,105,.1); color: #9ae6b4; }

  .empty {
    text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .empty .empty-icon {
    font-size: 48px; opacity: .3; margin-bottom: 8px;
  }
  .muted { color: var(--text-muted); font-size: 12px; }
  .row-flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .mt-16 { margin-top: 16px; }
  .mb-16 { margin-bottom: 16px; }
  .nowrap { white-space: nowrap; }
  .text-right { text-align: right; }

  .chart-box { position: relative; height: 320px; }
  .chart-box-sm { position: relative; height: 280px; }
  .chart-box-lg { position: relative; height: 380px; }

  /* ============================================================
     ЖУРНАЛ
     ============================================================ */
  .journal-table { font-size: 14px; }
  .journal-table th { padding: 8px 6px; font-size: 11px; text-align: center; }
  .journal-table th .subject-name {
    display: block; font-size: 13px; font-weight: 700;
    color: var(--primary); margin-bottom: 4px; text-transform: none;
  }
  .journal-table th .subject-teacher {
    display: block; font-size: 11px; font-weight: 500;
    color: var(--purple); margin-bottom: 4px; text-transform: none;
    font-style: italic;
  }
  .journal-table th .type-lbl {
    font-size: 10px; font-weight: 600; padding: 1px 3px; border-radius: 3px;
    background: var(--border); color: var(--text-2); text-transform: none;
  }
  .journal-table td { padding: 4px; }
  .journal-table td.name-cell {
    padding: 8px 12px; white-space: nowrap; font-weight: 600; font-size: 13px;
    position: sticky; left: 0; background: var(--bg-card); z-index: 2;
    border-right: 2px solid var(--border); min-width: 180px;
  }
  .journal-table input.journal-input {
    width: 100%; min-width: 40px; max-width: 60px; padding: 4px;
    text-align: center; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border-strong); border-radius: 4px; font-family: inherit;
    background: var(--bg-input); color: var(--text);
  }
  .journal-table input.journal-input.filled { background: #e6fffa; border-color: #38b2ac; }
  .journal-table input.journal-input.changed { background: #fff9e6; border-color: #dd6b20; }

  .diag-input {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border-strong);
    border-radius: 6px; font-size: 13px; font-family: inherit;
    background: var(--bg-input); color: var(--text);
  }

  .paste-area {
    width: 100%; min-height: 140px; font-family: 'Consolas', monospace; font-size: 13px;
    padding: 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    resize: vertical; background: var(--bg-input); color: var(--text);
  }

  .radio-group { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 0; }
  .radio-group label {
    display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer;
    padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--bg-card); transition: all .15s; min-height: 42px;
  }
  .radio-group label:hover { border-color: var(--primary); background: var(--bg-hover); }
  .radio-group input[type="radio"],
  .radio-group input[type="checkbox"] { margin: 0; cursor: pointer; width: 18px; height: 18px; }

  .subtabs {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .subtabs button {
    background: none; border: none; padding: 10px 16px; font-size: 14px;
    cursor: pointer; color: var(--text-muted); border-radius: var(--radius-sm);
    font-family: inherit; transition: all .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .subtabs button:hover { background: var(--bg-hover); color: var(--primary); }
  .subtabs button.active { background: var(--primary); color: #fff; font-weight: 600; }

  /* ============================================================
     ТЕПЛОВАЯ КАРТА
     ============================================================ */
  .heatmap-table td {
    text-align: center;
    font-weight: 600;
    padding: 8px 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all .15s;
    font-size: 13px;
  }
  .heatmap-table td.class-col {
    text-align: left;
    background: var(--bg-hover);
    font-weight: 700;
    color: var(--primary);
    position: sticky; left: 0; z-index: 2;
    min-width: 120px;
  }
  .heatmap-table td:hover { transform: scale(1.05); box-shadow: var(--shadow); z-index: 3; position: relative; }
  .heat-1 { background: #fed7d7; color: #742a2a; }
  .heat-2 { background: #fefcbf; color: #744210; }
  .heat-3 { background: #bee3f8; color: #2a4365; }
  .heat-4 { background: #c6f6d5; color: #22543d; }

  /* ============================================================
     ВИДЖЕТЫ ДАШБОРДА
     ============================================================ */
  .widget-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
  }
  .widget {

/* Тост-уведомления */
function showToast(msg, type = 'info', duration = 3000) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = `${icon(type === 'success' ? 'check' : type === 'error' ? 'alert' : 'info')} ${esc(msg)}`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'fadeInUp .3s ease reverse';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

/* ============================================================
   ТЕМА
   ============================================================ */
const THEME_KEY = 'sa_theme';
function applyTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'auto';
  let theme = saved;
  if (saved === 'auto') {
    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
  return saved;
}
function setTheme(t) {
  localStorage.setItem(THEME_KEY, t);
  applyTheme();
  render();
}
function cycleTheme() {
  const cur = localStorage.getItem(THEME_KEY) || 'auto';
  const order = ['light', 'dark', 'auto'];
  const idx = order.indexOf(cur);
  setTheme(order[(idx + 1) % order.length]);
}
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if ((localStorage.getItem(THEME_KEY) || 'auto') === 'auto') applyTheme();
});

/* ============================================================
   PWA
   ============================================================ */
let deferredPrompt = null;
let isOnline = navigator.onLine;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => console.log('[PWA] SW зарегистрирован:', reg.scope))
      .catch(err => console.warn('[PWA] Ошибка SW:', err));
  });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (localStorage.getItem('sa_pwa_hidden') !== '1') {
    setTimeout(() => document.getElementById('pwaBanner')?.classList.add('visible'), 3000);
  }
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('pwaBanner')?.classList.remove('visible');
});

function installPwa() {
  if (!deferredPrompt) {
    showToast('Установка недоступна. Chrome: меню → «Установить приложение»', 'info', 5000);
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    document.getElementById('pwaBanner')?.classList.remove('visible');
    deferredPrompt = null;
  });
}

function hidePwaBanner() {
  document.getElementById('pwaBanner')?.classList.remove('visible');
  localStorage.setItem('sa_pwa_hidden', '1');
}

function updateOnlineStatus() {
  isOnline = navigator.onLine;
  const ind = document.getElementById('offlineIndicator');
  if (ind) ind.classList.toggle('visible', !isOnline);
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

/* ============================================================
   ХРАНИЛИЩЕ
   ============================================================ */
const DB = {
  _key: 'school_analytics_db_v5',
  _data: null,
  load() {
    if (this._data) return this._data;
    const raw = localStorage.getItem(this._key);
    if (raw) {
      this._data = JSON.parse(raw);
      this._migrate();
      this.save();
    } else {
      this._data = this.seed();
      this.save();
    }
    return this._data;
  },
  _migrate() {
    this._data.diagnostics = (this._data.diagnostics || []).map(d => ({
      type: 'предметная', subject: '', score: null, maxScore: null, level: '', ...d
    }));
    this._data.subjectTeachers = this._data.subjectTeachers || [];
    this._data.subjectTeachersList = this._data.subjectTeachersList || [];
    this._data.subjectTeachersList = this._data.subjectTeachersList.map(t => ({
      mckoLevel: 'нет', mckoDate: '', notes: [], ...t
    }));
    if (!this._data.nextIds.subjectTeacher) this._data.nextIds.subjectTeacher = 1;
    if (!this._data.nextIds.subjectTeacherList) this._data.nextIds.subjectTeacherList = 1;
    if (!this._data.nextIds.noteId) this._data.nextIds.noteId = 1;
    // Новые поля
    if (!this._data.gradesHistory) this._data.gradesHistory = [];
    if (!this._data.dashboardWidgets) {
      this._data.dashboardWidgets = ['stats', 'classesTable', 'classesChart'];
    }
    if (!this._data.autoReports) this._data.autoReports = {
      email: '', enabled: false, schedule: 'weekly', lastSent: null,
    };
  },
  save() { localStorage.setItem(this._key, JSON.stringify(this._data)); },
  reset() { localStorage.removeItem(this._key); this._data = null; },

  seed() {
    const subjects = ['Русский язык','Литература','Математика','Алгебра','Геометрия','Информатика',

/* ============================================================
   UNDO
   ============================================================ */
const UndoStack = {
  _key: 'sa_undo_stack',
  _items: [],
  load() {
    try { const raw = sessionStorage.getItem(this._key); this._items = raw ? JSON.parse(raw) : []; }
    catch(e) { this._items = []; }
    return this._items;
  },
  save() { sessionStorage.setItem(this._key, JSON.stringify(this._items.slice(-10))); },
  push(label) {
    const snapshot = JSON.parse(JSON.stringify(DB.load()));
    this._items.push({ label, snapshot, ts: Date.now() });
    if (this._items.length > 10) this._items.shift();
    this.save();
  },
  pop() { const item = this._items.pop(); this.save(); return item; },
  peek() { return this._items.length ? this._items[this._items.length - 1] : null; },
  count() { return this._items.length; },
  clear() { this._items = []; this.save(); }
};

function undoLastAction() {
  const item = UndoStack.peek();
  if (!item) { showToast('Нет действий для отмены', 'info'); return; }
  const when = new Date(item.ts).toLocaleTimeString('ru-RU');
  if (!confirm(`Отменить последнее действие?\n\n«${item.label}»\nВремя: ${when}`)) return;
  const popped = UndoStack.pop();
  DB._data = popped.snapshot;
  DB.save();
  showToast('Отменено: ' + popped.label, 'success');
  render();
}

let swipeStartX = 0, swipeStartY = 0, swipeActive = false;

function getAvailableTabs() {
  const tabs = ['dashboard','students','classes','analytics'];
  if (SESSION && SESSION.role === 'admin') {
    tabs.push('journal','subject-teachers','directories','users','backup');
  }
  return tabs;
}

function initSwipe() {
  const app = document.getElementById('app');
  if (!app) return;
  app.removeEventListener('touchstart', onTouchStart);
  app.removeEventListener('touchmove', onTouchMove);
  app.removeEventListener('touchend', onTouchEnd);
  app.addEventListener('touchstart', onTouchStart, { passive: true });
  app.addEventListener('touchmove', onTouchMove, { passive: false });
  app.addEventListener('touchend', onTouchEnd, { passive: true });
}
function onTouchStart(e) {
  const t = e.target;
  if (['INPUT','TEXTAREA','SELECT'].includes(t.tagName)) return;
  if (t.closest('.table-wrap') || t.closest('.journal-table') || t.closest('.modal') || t.closest('.widget')) return;
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swipeActive = true;
}
function onTouchMove(e) {
  if (!swipeActive) return;
  const dx = e.touches[0].clientX - swipeStartX;
  const dy = e.touches[0].clientY - swipeStartY;
  if (Math.abs(dy) > Math.abs(dx)) return;
  const hl = document.getElementById('swipeHintLeft');
  const hr = document.getElementById('swipeHintRight');
  if (hl && dx > 30) { hl.classList.add('visible'); hr?.classList.remove('visible'); }
  else if (hr && dx < -30) { hr.classList.add('visible'); hl?.classList.remove('visible'); }
}
function onTouchEnd(e) {
  if (!swipeActive) return;
  swipeActive = false;
  document.getElementById('swipeHintLeft')?.classList.remove('visible');
  document.getElementById('swipeHintRight')?.classList.remove('visible');
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if (Math.abs(dx) < 80) return;
  if (Math.abs(dy) > Math.abs(dx)) return;
  const tabs = getAvailableTabs();
  const hash = location.hash.replace('#', '') || 'dashboard';
  const current = hash.split('/')[0];
  let idx = tabs.indexOf(current);
  if (idx < 0) idx = 0;
  if (dx > 0 && idx > 0) go(tabs[idx - 1]);
  else if (dx < 0 && idx < tabs.length - 1) go(tabs[idx + 1]);
}

function gradeMatrix(studentId) {
  const m = {};
  DB.getGrades().filter(g => g.studentId === studentId).forEach(g => {
    const k = g.subject + '|' + g.period;
    if (!m[k]) m[k] = {};
    if (!m[k][g.type]) m[k][g.type] = [];
    m[k][g.type].push(g);
  });
  return m;
}
function finalGrade(studentId, subject, year) {
  const gs = DB.getGrades().filter(g => g.studentId === studentId && g.subject === subject
    && (!year || g.year === year));
  if (!gs.length) return '';
  let x = gs.find(g => g.period === 'Год' && g.type === 'итоговая'); if (x) return x.value;
  x = gs.find(g => g.period === 'Год'); if (x) return x.value;
  x = gs.find(g => g.type === 'итоговая'); if (x) return x.value;
  return gs[gs.length - 1].value;
}
function usedSubjects() {
  const set = new Set(DB.getGrades().map(g => g.subject));
  return DB.getSubjects().filter(s => set.has(s));
}
function studentAvg(studentId) {
  const grades = DB.getGrades().filter(g => g.studentId === studentId && /^[2-5]$/.test(g.value));
  if (!grades.length) return 0;
  return grades.reduce((a,g) => a + +g.value, 0) / grades.length;
}
function studentCategory(studentId) {
  const avg = studentAvg(studentId);
  if (!avg) return 'none';
  if (avg >= 4.5) return 'excellent';
  if (avg >= 3.5) return 'good';
  if (avg >= 2.5) return 'satisfactory';
  return 'poor';
}

/* ПРОГНОЗ РИСКА */
function studentRisk(studentId) {
  const student = DB.getStudent(studentId);
  if (!student) return { level: 'none', score: 0, reasons: [] };

  const grades = DB.getGrades().filter(g => g.studentId === studentId && /^[2-5]$/.test(g.value));
  const avg = grades.length ? grades.reduce((a,g) => a + +g.value, 0) / grades.length : 0;

  const diags = DB.getDiagnostics().filter(d => d.studentId === studentId);
  const badDiags = diags.filter(d => d.level === 'низкий' || d.level === 'базовый').length;

  // Простой скоринг
  let score = 0;
  const reasons = [];

  if (avg && avg < 3.0) { score += 40; reasons.push(`средний балл ${avg.toFixed(2)}`); }
  else if (avg && avg < 3.5) { score += 20; reasons.push(`средний балл ${avg.toFixed(2)}`); }

  if (badDiags >= 3) { score += 25; reasons.push(`${badDiags} диагностик низкого/базового уровня`); }
  else if (badDiags >= 2) { score += 15; reasons.push(`${badDiags} диагностики низкого уровня`); }

  // Считаем долю "2" и "3"
  const twos = grades.filter(g => g.value === '2').length;
  const threes = grades.filter(g => g.value === '3').length;
  const total = grades.length || 1;
  if (twos / total > 0.15) { score += 30; reasons.push(`много двоек (${twos})`); }
  else if (threes / total > 0.35) { score += 15; reasons.push(`много троек (${threes})`); }

  let level = 'low';
  if (score >= 50) level = 'high';
  else if (score >= 25) level = 'medium';

  return { level, score, reasons, avg, badDiags };
}

/* ============================================================
   CSV / XLSX
   ============================================================ */
function downloadCSV(filename, content) {
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Экспорт в XLSX с цветом и формулами */
function downloadXLSX(filename, sheets) {
  // sheets: [{ name, rows: [[...]], colWidths: [w1, w2, ...] }]
  try {
    const wb = XLSX.utils.book_new();
    sheets.forEach(sheet => {
      const ws = XLSX.utils.aoa_to_sheet(sheet.rows);

      // Ширина колонок
      if (sheet.colWidths) {
        ws['!cols'] = sheet.colWidths.map(w => ({ wch: w }));
      }

      // Цветная заливка ячеек (условное форматирование вручную)
      if (sheet.coloredCells) {
        sheet.coloredCells.forEach(({ r, c, bg, color, bold }) => {
          const addr = XLSX.utils.encode_cell({ r, c });
          if (!ws[addr]) return;
          ws[addr].s = ws[addr].s || {};
          if (bg) ws[addr].s.fill = { fgColor: { rgb: bg } };
          if (color) ws[addr].s.font = { color: { rgb: color }, bold: !!bold };
        });
      }

      // Автофильтр для первой строки (заголовки)
      const range = XLSX.utils.decode_range(ws['!ref']);
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({
        s: { r: range.s.r, c: range.s.c },
        e: { r: range.e.r, c: range.e.c }
      })};

      XLSX.utils.book_append_sheet(wb, ws, sheet.name);
    });

    XLSX.writeFile(wb, filename);
    showToast('Excel-файл сохранён: ' + filename, 'success');
  } catch (err) {
    console.error(err);
    showToast('Ошибка экспорта XLSX: ' + err.message, 'error', 5000);
  }
}

/* Универсальная функция — делает и XLSX, и CSV */
function exportData(filenameBase, sheets) {
  // XLSX
  downloadXLSX(filenameBase + '.xlsx', sheets);
}

/* Drag-n-drop виджетов */
function initWidgetDrag() {
  const grid = document.getElementById('widgetGrid');
  if (!grid) return;
  const widgets = grid.querySelectorAll('.widget');
  let dragged = null;

  widgets.forEach(w => {
    w.addEventListener('dragstart', e => {
      dragged = w;
      w.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    w.addEventListener('dragend', () => {
      w.classList.remove('dragging');
      widgets.forEach(x => x.classList.remove('drag-over'));
      // Сохраняем порядок
      const newOrder = Array.from(grid.querySelectorAll('.widget')).map(x => x.dataset.widget);
      DB.setDashboardWidgets(newOrder);
    });
    w.addEventListener('dragover', e => {
      e.preventDefault();
      if (dragged && dragged !== w) {
        w.classList.add('drag-over');
      }
    });
    w.addEventListener('dragleave', () => w.classList.remove('drag-over'));
    w.addEventListener('drop', e => {
      e.preventDefault();
      w.classList.remove('drag-over');
      if (dragged && dragged !== w) {
        const all = Array.from(grid.children);
        const fromIdx = all.indexOf(dragged);
        const toIdx = all.indexOf(w);
        if (fromIdx < toIdx) w.after(dragged);
        else w.before(dragged);
      }
    });
  });
}

function renderStudentDetail(id) {
  if (!canAccessStudent(id)) {
    page('<div class="card"><div class="empty">Нет доступа</div></div>', 'students');
    return;
  }
  const s = DB.getStudent(id);
  const c = DB.getClasses().find(x => x.id === s.classId);
  const b = c ? DB.getBuildings().find(x => x.id === c.buildingId) : null;
  const t = c ? DB.getTeachers().find(x => x.id === c.teacherId) : null;
  const m = gradeMatrix(id);
  const subjects = DB.getSubjects();
  const isAdmin = SESSION.role === 'admin';
  const risk = studentRisk(id);

  const diagTypeFilter = window._diagTypeFilter || '';
  const diags = DB.getDiagnostics().filter(d => d.studentId === id)
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const filteredDiags = diagTypeFilter ? diags.filter(d => d.type === diagTypeFilter) : diags;

  // Группировка по годам
  const yearsSet = new Set(DB.getGrades().filter(g => g.studentId === id).map(g => g.year || '2024-2025'));
  const years = [...yearsSet].sort();

  let gradeTable = '';
  const subjWithGrades = subjects.filter(sub => PERIODS.some(p => m[sub + '|' + p]));
  if (subjWithGrades.length) {
    gradeTable = `<div class="table-wrap"><table>
      <thead><tr><th style="min-width:120px;">Предмет</th>
        <th style="min-width:140px;">Учитель</th>
        ${PERIODS.map(p => `<th style="text-align:center;min-width:100px;">${p}</th>`).join('')}
      </tr></thead><tbody>`;
    subjWithGrades.forEach(sub => {
      const st = c ? DB.getSubjectTeacher(c.id, sub) : null;
      gradeTable += `<tr>
        <td><b>${esc(sub)}</b></td>
        <td><span class="badge badge-purple">${esc(st ? st.name : '—')}</span></td>`;
      PERIODS.forEach(p => {
        const cell = m[sub + '|' + p];
        if (!cell) {
          gradeTable += `<td style="text-align:center;">${isAdmin ? `<button class="btn btn-outline btn-sm btn-icon" onclick="gradeForm(${id},'${esc(sub)}','${p}')" title="Добавить оценку">${icon('plus', 12)}</button>` : '—'}</td>`;
          return;
        }
        let html = '';
        GRADE_TYPES.forEach(ty => {
          if (cell[ty]) {
            const g = cell[ty][cell[ty].length - 1];
            html += `<span class="grade-chip ${gradeClass(g.value)}">${esc(g.value)}</span>`;
          }
        });
        if (isAdmin) html += ` <button class="btn btn-outline btn-sm btn-icon" style="padding:2px 4px;font-size:10px;"
          onclick="gradeForm(${id},'${esc(sub)}','${p}')" title="Добавить">${icon('plus', 10)}</button>`;
        gradeTable += `<td style="text-align:center;">${html}</td>`;
      });
      gradeTable += '</tr>';
    });
    gradeTable += '</tbody></table></div>';
  } else {
    gradeTable = `<div class="empty"><div class="empty-icon">📝</div><div>Оценок пока нет</div></div>`;
  }

  const diagRows = filteredDiags.map(d => `<tr>
    <td>${esc(d.title)}</td>
    <td><span class="badge badge-blue">${esc(d.type || '—')}</span></td>
    <td class="nowrap">${esc(fmtDate(d.date))}</td>
    <td>${esc(d.result || '—')}</td>
    <td>${d.level ? `<span class="badge ${LEVEL_CLASS[d.level]}">${esc(d.level)}</span>` : '—'}</td>
    ${isAdmin ? `<td class="text-right nowrap">
      <button class="btn btn-outline btn-sm btn-icon" onclick="diagForm(${id},${d.id})" title="Редактировать">${icon('edit', 12)}</button>
      <button class="btn btn-danger btn-sm btn-icon" onclick="delDiag(${d.id})" title="Удалить">${icon('trash', 12)}</button>
    </td>` : ''}
  </tr>`).join('');

  const riskColor = risk.level === 'high' ? 'var(--danger)' : risk.level === 'medium' ? 'var(--warning)' : 'var(--success)';
  const riskText = risk.level === 'high' ? 'Высокий риск' : risk.level === 'medium' ? 'Средний риск' : 'Низкий риск';

  page(`
    <div class="card">
      <div class="row-flex" style="justify-content:space-between;align-items:flex-start;gap:12px;">
        <div style="flex:1;min-width:0;">
          <h2 style="margin-bottom:6px;">${esc(fullName(s))}</h2>
          <div class="row-flex" style="gap:8px;">
            <span class="muted">Дата рождения: <b>${esc(fmtDate(s.birthDate))}</b></span>
            <span class="badge" style="background:${riskColor}22;color:${riskColor};">${riskText}</span>
          </div>
          ${risk.reasons.length ? `<div class="muted" style="margin-top:6px;">Причины: ${esc(risk.reasons.join(', '))}</div>` : ''}
        </div>
        <div class="btn-group">
          <button class="btn btn-outline btn-sm" onclick="go('students')" title="Назад">${icon('close', 14)}</button>
          <button class="btn btn-success btn-sm" onclick="exportStudent(${id})" title="PDF">${icon('file-pdf', 14)} PDF</button>
          <button class="btn btn-outline btn-sm" onclick="exportStudentXLSX(${id})" title="Excel">${icon('file-excel', 14)} Excel</button>
        </div>
      </div>
      <div class="form-grid mt-16">
        <div class="form-group"><label>Класс</label><input value="${esc(c?c.name:'—')}" disabled></div>
        <div class="form-group"><label>Здание</label><input value="${esc(b?b.name:'—')}" disabled></div>
        <div class="form-group"><label>Кл. руководитель</label><input value="${esc(t?t.name:'—')}" disabled></div>
      </div>
    </div>

    <div class="card">
      <div class="row-flex" style="justify-content:space-between;margin-bottom:14px;">
        <h2 style="margin:0;">Успеваемость (с учителями)</h2>
        ${isAdmin ? `<button class="btn btn-primary btn-sm" onclick="gradeForm(${id})" title="Добавить оценку">${icon('plus', 14)} Оценка</button>` : ''}
      </div>
      ${gradeTable}
    </div>

    <div class="card">
      <h2>Динамика успеваемости (год к году)</h2>
      <div class="chart-box-lg"><canvas id="chartStudentYearly"></canvas></div>
    </div>

    <div class="card">
      <h2>Динамика по четвертям</h2>
      <div class="chart-box"><canvas id="chartStudentDynamics"></canvas></div>
    </div>

    <div class="card">
      <h2>Итоговые оценки</h2>
      <div class="chart-box-lg"><canvas id="chartStudentSubjects"></canvas></div>
    </div>

    <div class="card">
      <h2>Распределение</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="chart-box-sm"><canvas id="chartGradePie"></canvas></div>
        <div class="chart-box-sm"><canvas id="chartDiagBars"></canvas></div>
      </div>
    </div>

    <div class="card">
      <div class="row-flex" style="justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
        <h2 style="margin:0;">Диагностики</h2>
        <div class="row-flex" style="gap:8px;">
          <select onchange="window._diagTypeFilter=this.value;render();" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text);">
            <option value="">Все типы</option>
            ${DIAG_TYPES.map(t => `<option ${diagTypeFilter===t?'selected':''}>${esc(t)}</option>`).join('')}
          </select>
          ${isAdmin ? `<button class="btn btn-primary btn-sm" onclick="diagForm(${id})" title="Добавить диагностику">${icon('plus', 14)}</button>` : ''}
        </div>
      </div>
      ${filteredDiags.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Название</th><th>Тип</th><th>Дата</th><th>Результат</th>
        <th>Уровень</th>${isAdmin?'<th></th>':''}</tr></thead>
        <tbody>${diagRows}</tbody></table></div>`
      : `<div class="empty">
        <div class="empty-icon">📋</div>
        <div>Диагностик пока нет</div>
        ${isAdmin ? `<button class="btn btn-primary btn-sm" onclick="diagForm(${id})">${icon('plus', 14)} Добавить диагностику</button>` : ''}
      </div>`}
    </div>
  `, 'students');

  requestAnimationFrame(() => {
    drawStudentYearly(id);
    drawStudentDynamics(id);
    drawStudentSubjects(id);
    drawGradePie(id);
    drawDiagBars(id);
  });
}

/* ============================================================
   ГРАФИКИ
   ============================================================ */
let charts = {};
function destroyChart(key) { if (charts[key]) { charts[key].destroy(); delete charts[key]; } }
const CHART_FONT = { family: "'Segoe UI', Roboto, sans-serif", size: 11 };
function chartTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  return {
    text: isDark ? '#cbd5e0' : '#475569',
    grid: isDark ? '#2d3748' : '#e2e8f0',
    font: { ...CHART_FONT, size: 11 },
  };
}

function drawStudentYearly(studentId) {
  destroyChart('studentYearly');
  const ctx = document.getElementById('chartStudentYearly');
  if (!ctx) return;
  const grades = DB.getGrades().filter(g => g.studentId === studentId && /^[2-5]$/.test(g.value));
  const yearsSet = new Set(grades.map(g => g.year || '2024-2025'));
  const years = [...yearsSet].sort();
  const data = years.map(y => {
    const gs = grades.filter(g => (g.year || '2024-2025') === y);
    return gs.length ? +(gs.reduce((a,b) => a + +b.value, 0) / gs.length).toFixed(2) : null;
  });
  const t = chartTheme();
  charts.studentYearly = new Chart(ctx, {
    type: 'line',
    data: { labels: years, datasets: [{
      label: 'Средний балл', data, borderColor: '#3182ce',
      backgroundColor: 'rgba(49,130,206,.15)', fill: true, tension: .3,
      pointRadius: 6, pointBackgroundColor: '#3182ce', spanGaps: true,
    }]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: t.font, color: t.text } } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5, font: t.font, color: t.text }, grid: { color: t.grid } },
                x: { ticks: { font: t.font, color: t.text }, grid: { display: false } } } }
  });
}

function drawStudentDynamics(studentId) {
  destroyChart('dynamics');
  const ctx = document.getElementById('chartStudentDynamics');
  if (!ctx) return;
  const data = PERIODS.map(p => {
    const gs = DB.getGrades().filter(g => g.studentId === studentId && g.period === p && /^[2-5]$/.test(g.value));
    return gs.length ? +(gs.reduce((a,b)=>a+ +b.value,0)/gs.length).toFixed(2) : null;
  });
  const t = chartTheme();
  charts.dynamics = new Chart(ctx, {
    type: 'line',
    data: { labels: PERIODS, datasets: [{
      label: 'Средний балл', data, borderColor: '#2c5282',
      backgroundColor: 'rgba(44,82,130,.12)', fill: true, tension: .3,
      pointRadius: 5, pointBackgroundColor: '#2c5282', spanGaps: true,
    }]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: t.font, color: t.text } } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5, font: t.font, color: t.text }, grid: { color: t.grid } },
                x: { ticks: { font: t.font, color: t.text }, grid: { display: false } } } }
  });
}

function drawStudentSubjects(studentId) {
  destroyChart('subjects');
  const ctx = document.getElementById('chartStudentSubjects');
  if (!ctx) return;
  const subjects = usedSubjects();
  const values = subjects.map(s => { const v = finalGrade(studentId, s); return /^[2-5]$/.test(v) ? +v : null; });
  const colors = values.map(v => v===5?'#38a169':v===4?'#3182ce':v===3?'#dd6b20':v===2?'#e53e3e':'#cbd5e0');
  const t = chartTheme();
  charts.subjects = new Chart(ctx, {
    type: 'bar',
    data: { labels: subjects, datasets: [{ label: 'Итоговая', data: values, backgroundColor: colors, borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: 1, font: t.font, color: t.text }, grid: { color: t.grid } },
                x: { ticks: { font: t.font, color: t.text, maxRotation: 60 }, grid: { display: false } } } }
  });
}

function drawGradePie(studentId) {
  destroyChart('pie');
  const ctx = document.getElementById('chartGradePie');
  if (!ctx) return;
  const grades = DB.getGrades().filter(g => g.studentId === studentId && /^[2-5]$/.test(g.value));
  const counts = {'5':0,'4':0,'3':0,'2':0};
  grades.forEach(g => counts[g.value]++);
  const t = chartTheme();
  charts.pie = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: ['5','4','3','2'],
      datasets: [{ data: [counts['5'],counts['4'],counts['3'],counts['2']],
        backgroundColor: ['#38a169','#3182ce','#dd6b20','#e53e3e'], borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: t.font, color: t.text } } } }
  });
}

function drawDiagBars(studentId) {
  destroyChart('diag');
  const ctx = document.getElementById('chartDiagBars');
  if (!ctx) return;
  const diags = DB.getDiagnostics().filter(d => d.studentId === studentId && d.score != null)
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const t = chartTheme();
  charts.diag = new Chart(ctx, {
    type: 'bar',
    data: { labels: diags.map(d => d.title.length > 20 ? d.title.slice(0,18)+'…' : d.title),
      datasets: [{ label: 'Балл', data: diags.map(d => d.score),
        backgroundColor: diags.map(d => {
          if (d.maxScore && d.score != null) {
            const p = d.score / d.maxScore;
            return p >= .85 ? '#38a169' : p >= .65 ? '#3182ce' : p >= .45 ? '#dd6b20' : '#e53e3e';
          }
          return '#3182ce';
        }), borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { font: t.font, color: t.text }, grid: { color: t.grid } },
                x: { ticks: { font: t.font, color: t.text, maxRotation: 45 }, grid: { display: false } } } }
  });
}

function drawClassesAvgChart(classes, students, subjects, ctxId) {
  const id = ctxId || 'classesAvg';
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  const labels = [], values = [];
  classes.forEach(c => {
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0;
    sts.forEach(s => subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v)) { sum += +v; cnt++; }
    }));
    labels.push(c.name);
    values.push(cnt ? +(sum/cnt).toFixed(2) : 0);
  });
  const t = chartTheme();
  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Ср. балл', data: values,
      backgroundColor: values.map(v => v>=4.5?'#38a169':v>=3.5?'#3182ce':v>=2.5?'#dd6b20':'#e53e3e'),
      borderRadius: 8 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: .5, font: t.font, color: t.text }, grid: { color: t.grid } },
                x: { ticks: { font: t.font, color: t.text }, grid: { display: false } } } }
  });
}

/* ============================================================
   ФОРМЫ
   ============================================================ */
function studentForm(id) {
  const s = id ? DB.getStudent(id) : null;
  const classes = DB.getClasses();
  const buildings = DB.getBuildings();
  const teachers = DB.getTeachers();
  const clsOpts = classes.map(c =>
    `<option value="${c.id}" ${s && s.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  showModal(`
    <h2>${s ? 'Редактирование' : 'Новый ученик'}</h2>
    <div class="form-grid">
      <div class="form-group"><label>Фамилия *</label><input id="f_last" value="${esc(s?s.lastName:'')}"></div>
      <div class="form-group"><label>Имя *</label><input id="f_first" value="${esc(s?s.firstName:'')}"></div>
      <div class="form-group"><label>Отчество</label><input id="f_middle" value="${esc(s?s.middleName:'')}"></div>
      <div class="form-group"><label>Дата рождения</label><input id="f_birth" type="date" value="${esc(s?s.birthDate:'')}"></div>
      <div class="form-group"><label>Класс *</label>
        <select id="f_class" onchange="syncClassInfo()">
          <option value="">— выберите —</option>${clsOpts}
        </select></div>
      <div class="form-group"><label>Здание</label>
        <select id="f_building" disabled><option>— из класса —</option></select></div>
      <div class="form-group"><label>Кл. руководитель</label>
        <select id="f_teacher" disabled><option>— из класса —</option></select></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveStudent(${id||'null'})">${icon('save', 14)} Сохранить</button>
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
    </div>
  `);
  const bSel = document.getElementById('f_building');
  const tSel = document.getElementById('f_teacher');
  bSel.innerHTML = buildings.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
  tSel.innerHTML = teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  syncClassInfo();
}

function syncClassInfo() {
  const cid = +document.getElementById('f_class').value;
  const bSel = document.getElementById('f_building');
  const tSel = document.getElementById('f_teacher');
  if (!cid) { bSel.value = ''; tSel.value = ''; return; }
  const c = DB.getClasses().find(x => x.id === cid);
  if (c) { bSel.value = c.buildingId; tSel.value = c.teacherId || ''; }
}

function saveStudent(id) {
  const last = document.getElementById('f_last').value.trim();
  const first = document.getElementById('f_first').value.trim();
  const cid = +document.getElementById('f_class').value;
  if (!last || !first) { showToast('Укажите ФИО', 'error'); return; }
  if (!cid) { showToast('Выберите класс', 'error'); return; }
  const data = {
    lastName: last, firstName: first,
    middleName: document.getElementById('f_middle').value.trim(),
    birthDate: document.getElementById('f_birth').value, classId: cid,
  };
  if (!id) UndoStack.push(`Добавление ученика`);
  if (id) DB.updateStudent(id, data); else DB.addStudent(data);
  closeModal();
  showToast(id ? 'Ученик обновлён' : 'Ученик добавлен', 'success');
  render();
}

function delStudent(id) {
  const s = DB.getStudent(id);
  if (!confirm(`Удалить «${fullName(s)}»?`)) return;
  UndoStack.push('Удаление ученика');
  DB.deleteStudent(id);
  showToast('Ученик удалён', 'success');
  render();
}

function openStudent(id) {
  if (!canAccessStudent(id)) { showToast('Нет доступа', 'error'); return; }
  location.hash = 'student/' + id;
}

/* Формы для остальных — копия из предыдущей версии, опущены для краткости.
   В реальном файле они должны быть здесь (gradeForm, diagForm, classForm, userForm и т.д.). */

function gradeForm(studentId, subject, period) {
  const subs = DB.getSubjects();
  showModal(`
    <h2>Добавить оценку</h2>
    <div class="form-grid">

function saveDiag(studentId, diagId) {
  const title = document.getElementById('d_title').value.trim();
  if (!title) { showToast('Укажите название', 'error'); return; }
  const scoreRaw = document.getElementById('d_score').value;
  const maxRaw = document.getElementById('d_max').value;
  const data = {
    studentId, title,
    type: document.getElementById('d_type').value,
    subject: document.getElementById('d_subject').value,
    date: document.getElementById('d_date').value,
    result: document.getElementById('d_result').value.trim(),
    score: scoreRaw === '' ? null : +scoreRaw,
    maxScore: maxRaw === '' ? null : +maxRaw,
    level: document.getElementById('d_level').value,
    comment: document.getElementById('d_comment').value.trim(),
  };
  if (!diagId) UndoStack.push('Добавление диагностики');
  if (diagId) DB.updateDiagnostic(diagId, data); else DB.addDiagnostic(data);
  closeModal();
  showToast(diagId ? 'Диагностика обновлена' : 'Диагностика добавлена', 'success');
  render();
}

function delDiag(id) {
  if (!confirm('Удалить?')) return;
  UndoStack.push('Удаление диагностики');
  DB.deleteDiagnostic(id);
  showToast('Удалено', 'success');
  render();
}

/* Тепловая карта */
function renderAnalyticsHeatmap(tabs) {
  const classes = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();

  // Считаем средний балл по каждому классу × предмету
  const matrix = {}; // matrix[classId][subject] = avg
  const overall = {};

  subjects.forEach(sub => {
    let totalSum = 0, totalCnt = 0;
    classes.forEach(c => {
      const sts = students.filter(s => s.classId === c.id);
      let sum = 0, cnt = 0;
      sts.forEach(s => {
        const gs = DB.getGrades().filter(g => g.studentId === s.id && g.subject === sub && /^[2-5]$/.test(g.value));
        gs.forEach(g => { sum += +g.value; cnt++; });
      });
      const avg = cnt ? sum/cnt : 0;
      matrix[c.id + '|' + sub] = { avg, cnt };
      totalSum += sum; totalCnt += cnt;
    });
    overall[sub] = totalCnt ? totalSum/totalCnt : 0;
  });

  // Строки — классы
  const headerRow = `<th>Класс</th>` + subjects.map(s => `<th class="nowrap">${esc(s.length > 10 ? s.slice(0,9)+'.' : s)}</th>`).join('');

  const rows = classes.map(c => {
    const cells = subjects.map(sub => {
      const m = matrix[c.id + '|' + sub];
      if (!m.cnt) return `<td>—</td>`;
      const diff = m.avg - overall[sub];
      let heat = 'heat-2';
      if (diff > 0.3) heat = 'heat-4';
      else if (diff > 0.05) heat = 'heat-3';
      else if (diff < -0.3) heat = 'heat-1';
      return `<td class="${heat}" title="Средний балл: ${m.avg.toFixed(2)} (по школе: ${overall[sub].toFixed(2)})">${m.avg.toFixed(2)}</td>`;
    }).join('');
    return `<tr><td class="class-col">${esc(c.name)}</td>${cells}</tr>`;
  }).join('');

  // Строка "по школе"
  const schoolRow = `<tr><td class="class-col"><b>По школе</b></td>` +
    subjects.map(s => `<td><b>${overall[s].toFixed(2)}</b></td>`).join('') + `</tr>`;

  page(`
    <h1 style="margin-bottom:16px;color:var(--primary);">Аналитика</h1>
    ${tabs}
    <div class="card">
      <div class="row-flex" style="justify-content:space-between;margin-bottom:14px;">
        <h2 style="margin:0;">${icon('grid', 18)} Тепловая карта: классы × предметы</h2>
        <button class="btn btn-success btn-sm" onclick="exportHeatmapXLSX()" title="Скачать XLSX">
          ${icon('file-excel', 14)} Excel
        </button>
      </div>
      <div class="alert alert-info">
        ${icon('info', 14)} Цвет показывает отклонение от среднего по школе:
        <span class="heat-1" style="padding:2px 6px;border-radius:4px;">значительно ниже</span>
        <span class="heat-2" style="padding:2px 6px;border-radius:4px;">в норме</span>
        <span class="heat-3" style="padding:2px 6px;border-radius:4px;">выше</span>
        <span class="heat-4" style="padding:2px 6px;border-radius:4px;">значительно выше</span>
      </div>
      <div class="table-wrap">
        <table class="heatmap-table">
          <thead><tr>${headerRow}</tr></thead>
          <tbody>${rows}${schoolRow}</tbody>
        </table>
      </div>
    </div>
  `, 'analytics');
}

function exportHeatmapXLSX() {
  const classes = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();

  const rows = [['Класс', ...subjects, 'Средний по классу']];
  const colored = [];

  classes.forEach((c, ri) => {
    const cells = [c.name];
    let sumAll = 0, cntAll = 0;
    subjects.forEach(sub => {
      const sts = students.filter(s => s.classId === c.id);
      let sum = 0, cnt = 0;
      sts.forEach(s => {
        DB.getGrades().filter(g => g.studentId === s.id && g.subject === sub && /^[2-5]$/.test(g.value))
          .forEach(g => { sum += +g.value; cnt++; });
      });
      const avg = cnt ? sum/cnt : 0;
      sumAll += sum; cntAll += cnt;
      cells.push(cnt ? avg.toFixed(2) : '');
      if (cnt) {
        let bg = 'FFFFFF';
        if (avg >= 4.5) bg = 'C6F6D5';
        else if (avg >= 4.0) bg = 'BEE3F8';
        else if (avg >= 3.5) bg = 'FEFCBF';
        else bg = 'FED7D7';
        colored.push({ r: ri + 1, c: subjects.indexOf(sub) + 1, bg, bold: false });
      }
    });
    cells.push(cntAll ? (sumAll/cntAll).toFixed(2) : '');
    rows.push(cells);
  });

  downloadXLSX('Тепловая_карта.xlsx', [{
    name: 'Тепловая карта',
    rows,
    colWidths: [12, ...subjects.map(() => 14), 18],
    coloredCells: colored,
  }]);
}

    const sts = students.filter(s => s.classId === c.id);

      && classes.some(c => c.id === st.classId));
    if (!assignments.length) {
      rows.push([t.name, t.mckoLevel || 'нет', 0, 0, 0, '', 0, (t.notes || []).length]);
      return;
    }
    const subjectsSet = new Set(), classesSet = new Set(), studentSet = new Set();
    let sum = 0, cnt = 0;
    assignments.forEach(a => {
      subjectsSet.add(a.subject);
      classesSet.add(a.classId);
      students.filter(s => s.classId === a.classId).forEach(s => {
        studentSet.add(s.id);
        DB.getGrades().filter(g => g.studentId === s.id && g.subject === a.subject && /^[2-5]$/.test(g.value))
          .forEach(g => { sum += +g.value; cnt++; });
      });
    });
    const avg = cnt ? (sum/cnt).toFixed(2) : '';
    rows.push([t.name, t.mckoLevel || 'нет', subjectsSet.size, classesSet.size, studentSet.size,
      avg, cnt, (t.notes || []).length]);
    if (avg) {
      const v = +avg;
      const bg = v >= 4.5 ? 'C6F6D5' : v >= 3.5 ? 'BEE3F8' : v >= 2.5 ? 'FEFCBF' : 'FED7D7';
      colored.push({ r: i + 1, c: 5, bg, bold: true });
    }
  });

  downloadXLSX('Аналитика_учителя.xlsx', [{
    name: 'Учителя',
    rows,
    colWidths: [30, 12, 12, 12, 12, 14, 12, 12],
    coloredCells: colored,
  }]);
}

function exportStudentXLSX(id) {
  const s = DB.getStudent(id);
  const c = DB.getClasses().find(x => x.id === s.classId);
  const m = gradeMatrix(id);
  const subjects = DB.getSubjects();

  const rows = [['Предмет', 'Учитель', ...PERIODS]];
  subjects.forEach(sub => {
    const st = c ? DB.getSubjectTeacher(c.id, sub) : null;
    const row = [sub, st ? st.name : ''];
    PERIODS.forEach(p => {
      const cell = m[sub + '|' + p];
      if (!cell) { row.push(''); return; }
      const parts = [];
      ['текущая','промежуточная','итоговая'].forEach(ty => {
        if (cell[ty]) parts.push(cell[ty][cell[ty].length-1].value);
      });
      row.push(parts.join('/'));
    });
    rows.push(row);
  });

  downloadXLSX(`Ученик_${s.lastName}.xlsx`, [{
    name: 'Успеваемость',
    rows,
    colWidths: [24, 28, ...PERIODS.map(() => 14)],
  }]);
}

function saveAutoReports() {
  const email = document.getElementById('ar_email').value.trim();
  const schedule = document.getElementById('ar_schedule').value;
  const enabled = document.getElementById('ar_enabled').checked;
  DB.setAutoReports({ email, schedule, enabled });
  showToast('Настройки сохранены', 'success');
  closeModal();
}

function sendReportNow() {
  const cfg = DB.getAutoReports();
  const email = document.getElementById('ar_email')?.value.trim() || cfg.email;
  if (!email) { showToast('Укажите email', 'error'); return; }

  const classes = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();

  // Формируем текст письма
  let text = 'Аналитический отчёт по школе\n\n';
  text += `Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;

  classes.forEach(c => {
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0;
    sts.forEach(s => subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v)) { sum += +v; cnt++; }
    }));
    const avg = cnt ? (sum/cnt).toFixed(2) : '—';
    text += `Класс ${c.name}: ${sts.length} учеников, средний балл ${avg}\n`;
  });

  text += `\nВсего учеников: ${students.length}\nВсего классов: ${classes.length}\n`;

  const subject = encodeURIComponent('Аналитический отчёт — ' + new Date().toLocaleDateString('ru-RU'));
  const body = encodeURIComponent(text);
  window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
  DB.setAutoReports({ ...cfg, lastSent: new Date().toISOString() });
  showToast('Открыто письмо в почтовом клиенте', 'success');
  closeModal();
}

        <button class="btn btn-danger btn-sm btn-icon" onclick="deleteSnapshot(${s.id})" title="Удалить">${icon('trash', 12)}</button>

    <h1 style="margin-bottom:16px;color:var(--primary);">${icon('database', 24)} Резервное копирование</h1>

    <div class="stats-grid">
      <div class="stat-card"><div class="num">${sizeMB} МБ</div><div class="lbl">Размер базы</div></div>
      <div class="stat-card"><div class="num">${DB.getStudents().length}</div><div class="lbl">Учеников</div></div>
      <div class="stat-card"><div class="num">${DB.getGrades().length}</div><div class="lbl">Оценок</div></div>
      <div class="stat-card"><div class="num">${snapshots.length}</div><div class="lbl">Снапшотов</div></div>
    </div>

    <div class="card">
      <h2>${icon('download', 18)} Действия</h2>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="downloadBackupJSON()" title="Скачать JSON">
          ${icon('download', 14)} Скачать резервную копию
        </button>
        <button class="btn btn-outline" onclick="openImportBackupModal()" title="Загрузить JSON">
          ${icon('upload', 14)} Восстановить из файла
        </button>
        <button class="btn btn-outline" onclick="createSnapshotManual()" title="Создать снапшот">
          ${icon('save', 14)} Создать снапшот
        </button>
      </div>
    </div>

    <div class="card">
      <div class="row-flex" style="justify-content:space-between;margin-bottom:14px;">
        <h2 style="margin:0;">${icon('backup', 18)} Снапшоты (последние 10)</h2>
        ${snapshots.length ? `<button class="btn btn-danger btn-sm" onclick="clearAllSnapshots()" title="Удалить все">
          ${icon('trash', 14)} Очистить
        </button>` : ''}
      </div>
      ${snapshots.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Название</th><th>Дата</th><th class="text-right">Размер</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
      : `<div class="empty">
        <div class="empty-icon">💾</div>
        <div>Снапшотов пока нет</div>
        <button class="btn btn-primary btn-sm" onclick="createSnapshotManual()">${icon('plus', 14)} Создать снапшот</button>
      </div>`}
    </div>

    <div class="card">
      <h2>${icon('mail', 18)} Автоматические отчёты</h2>
      <div class="row-flex">
        <div>
          Email: <b>${esc(DB.getAutoReports().email || '— не задан —')}</b><br>
          Расписание: <b>${esc(DB.getAutoReports().schedule || 'weekly')}</b><br>
          Статус: <b>${DB.getAutoReports().enabled ? 'включено' : 'выключено'}</b>
        </div>
        <button class="btn btn-primary" onclick="openAutoReportsModal()" title="Настроить">
          ${icon('settings', 14)} Настроить
        </button>
      </div>
    </div>
  `, 'backup');
}

function downloadBackupJSON() {
  const json = DB.exportAll();
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `school_analytics_backup_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Резервная копия скачана', 'success');
}

function openImportBackupModal() {
  showModal(`
    <h2>${icon('upload', 20)} Восстановление из файла</h2>
    <div class="alert alert-warn">
      ${icon('alert', 14)} Внимание: текущие данные будут <b>полностью заменены</b>. Действие необратимо.
    </div>
    <div class="form-group mb-16">
      <label>Файл .json</label>
      <input type="file" id="backupFile" accept=".json">
    </div>
    <div class="form-actions">
      <button class="btn btn-warn" onclick="applyImportBackup()">${icon('refresh', 14)} Заменить данные</button>
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
    </div>
  `);
}

function applyImportBackup() {
  const file = document.getElementById('backupFile')?.files?.[0];
  if (!file) { showToast('Выберите файл', 'error'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      DB.importAll(reader.result);
      showToast('Данные восстановлены', 'success');
      closeModal();
      render();
    } catch (err) {
      showToast('Ошибка: ' + err.message, 'error', 5000);
    }
  };
  reader.readAsText(file);
}

function createSnapshotManual() {
  const label = prompt('Название снапшота:', 'Ручной снапшот ' + new Date().toLocaleString('ru-RU'));
  if (!label) return;
  DB.createSnapshot(label);
  showToast('Снапшот создан', 'success');
  renderBackup();
}

function restoreSnapshot(id) {
  if (!confirm('Восстановить данные из снапшота?')) return;
  if (DB.restoreSnapshot(id)) {
    showToast('Данные восстановлены', 'success');
    render();
  } else {
    showToast('Снапшот не найден', 'error');
  }
}

function deleteSnapshot(id) {
  if (!confirm('Удалить снапшот?')) return;
  DB.deleteSnapshot(id);
  renderBackup();
}

function clearAllSnapshots() {
  if (!confirm('Удалить ВСЕ снапшоты?')) return;
  const d = DB.load();
  d.snapshots = [];
  DB.save();
  renderBackup();
}

/* ============================================================
   РОУТЕР
   ============================================================ */
function render() {
  DB.load();
  UndoStack.load();
  if (!SESSION) { renderLogin(); return; }

  const hash = location.hash.replace('#', '') || 'dashboard';
  const [route, param] = hash.split('/');

  switch (route) {
    case 'dashboard':  renderDashboard(); break;
    case 'students':   renderStudents(); break;
    case 'student':    renderStudentDetail(+param); break;
    case 'classes':    renderClasses(); break;
    case 'analytics':  renderAnalytics(); break;
    case 'journal':    renderJournal(); break;
    case 'subject-teachers': renderSubjectTeachers(); break;
    case 'teacher':    renderStub('Карточка учителя'); break;
    case 'directories': renderDirectories(); break;
    case 'users':       renderUsers(); break;
    case 'backup':      renderBackup(); break;
    default: renderDashboard();
  }
}
