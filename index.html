/* ============================================================
   ФИРМЕННЫЙ СТИЛЬ ШКОЛЫ № 1512
   Палитра и шрифт взяты с сайта sch1512.mskobr.ru
   ============================================================ */

/* ---------- 1. Светлая тема ---------- */
:root {
  /* Фоны */
  --bg-body: #f4f7fa;
  --bg-card: #ffffff;
  --bg-elevated: #ffffff;
  --bg-hover: #eef4f9;
  --bg-input: #f8fafc;

  /* Границы */
  --border: #d9e4ec;
  --border-strong: #b8cbd9;

  /* Текст */
  --text: #1a2b3c;
  --text-2: #33475b;
  --text-muted: #6a7f94;
  --text-disabled: #9aacbc;

  /* Основной цвет — тёмно-синий школы */
  --primary: #04558a;
  --primary-dark: #033f66;
  --primary-light: #398ec6;
  --primary-soft: #e6f0f7;

  /* Фирменный акцент — яркий голубой */
  --accent: #1893d2;
  --accent-dark: #0f75a8;
  --accent-soft: #e3f4fb;

  /* Семантические */
  --success: #38a169;
  --success-dark: #276749;
  --warning: #dd6b20;
  --warning-dark: #c05621;
  --danger: #c53030;
  --danger-dark: #9b2c2c;
  --purple: #805ad5;
  --purple-dark: #6b46c1;

  /* Тени */
  --shadow: 0 1px 6px rgba(4, 85, 138, .08);
  --shadow-md: 0 4px 16px rgba(4, 85, 138, .12);
  --shadow-lg: 0 20px 50px rgba(4, 85, 138, .25);

  /* Скругления */
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
}

/* ---------- 2. Тёмная тема ---------- */
html[data-theme="dark"] {
  --bg-body: #0d1822;
  --bg-card: #152535;
  --bg-elevated: #1c2f42;
  --bg-hover: #1c2f42;
  --bg-input: #1c2f42;

  --border: #24384d;
  --border-strong: #3d5570;

  --text: #e2ecf4;
  --text-2: #c2d3e0;
  --text-muted: #8fa4b8;
  --text-disabled: #5f7488;

  --primary: #4da6d9;
  --primary-dark: #398ec6;
  --primary-light: #7bc4ec;
  --primary-soft: #1a3448;

  --accent: #4db8e8;
  --accent-dark: #1893d2;
  --accent-soft: #17303f;

  --success: #48bb78;
  --warning: #ed8936;
  --danger: #e53e3e;
  --purple: #9f7aea;

  --shadow: 0 1px 6px rgba(0, 0, 0, .4);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, .5);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, .7);
}

/* ---------- 3. Базовая типографика ---------- */
body {
  font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-body);
  color: var(--text);
  font-weight: 400;
  letter-spacing: 0;
  transition: background .25s ease, color .25s ease;
}

h1 { font-family: 'Roboto', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -.4px; }
h2 { font-family: 'Roboto', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
h3 { font-family: 'Roboto', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -.1px; }
h4 { font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 600; }

/* Кнопки и поля — тоже Roboto */
button, input, select, textarea, .btn {
  font-family: 'Roboto', -apple-system, sans-serif;
}

/* ---------- 4. Шапка ---------- */
header {
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--accent) 100%);
  box-shadow: 0 2px 14px rgba(4, 85, 138, .28);
}

header .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: .2px;
}

header .brand img {
  transition: transform .2s ease;
}

header .brand img:hover {
  transform: scale(1.05);
}

/* Кнопки в шапке */
header button {
  background: rgba(255, 255, 255, .16);
  border: 1px solid rgba(255, 255, 255, .35);
  font-weight: 500;
  letter-spacing: .2px;
}

header button:hover {
  background: rgba(255, 255, 255, .28);
  border-color: rgba(255, 255, 255, .55);
}

header .role-badge {
  background: rgba(255, 255, 255, .22);
  font-weight: 500;
  letter-spacing: .3px;
}

/* ---------- 5. Навигация ---------- */
nav.tabs {
  background: var(--bg-card);
  border-bottom: 2px solid var(--border);
}

nav.tabs button {
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: .1px;
  transition: color .18s ease, background .18s ease, border-color .18s ease;
}

nav.tabs button:hover {
  color: var(--primary);
  background: var(--primary-soft);
}

nav.tabs button.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 600;
}

/* ---------- 6. Карточки ---------- */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.card h2 { color: var(--primary); }
.card h3 { color: var(--text-2); }

/* ---------- 7. Кнопки ---------- */
.btn {
  font-weight: 500;
  letter-spacing: .2px;
  transition: transform .12s ease, background .18s ease, box-shadow .18s ease;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover {
  background: var(--primary-dark);
  box-shadow: 0 4px 12px rgba(4, 85, 138, .3);
}

.btn-success {
  background: var(--success-dark);
  color: #fff;
}
.btn-success:hover {
  background: var(--success);
}

.btn-warn {
  background: var(--warning-dark);
  color: #fff;
}
.btn-warn:hover {
  background: var(--warning);
}

.btn-danger {
  background: var(--danger);
  color: #fff;
}
.btn-danger:hover {
  background: var(--danger-dark);
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-2);
  font-weight: 500;
}
.btn-outline:hover {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
}

/* ---------- 8. Поля ввода ---------- */
.form-group input,
.form-group select,
.form-group textarea {
  background: var(--bg-input);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  color: var(--text);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(4, 85, 138, .15);
  background: var(--bg-card);
}

.form-group label {
  color: var(--text-2);
  font-weight: 500;
  letter-spacing: .1px;
}

/* ---------- 9. Таблицы ---------- */
table {
  color: var(--text-2);
}

th {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 600;
  letter-spacing: .4px;
}

tr:hover td {
  background: var(--bg-hover);
}

td {
  border-bottom: 1px solid var(--border);
}

/* ---------- 10. Бейджи ---------- */
.badge-blue { background: var(--primary-soft); color: var(--primary); }
.badge-green { background: #e6f9ee; color: var(--success-dark); }
.badge-orange { background: #fdf3e8; color: var(--warning-dark); }
.badge-red { background: #fdeaea; color: var(--danger-dark); }
.badge-gray { background: #eef1f4; color: var(--text-muted); }
.badge-purple { background: #f3ecfb; color: var(--purple-dark); }

/* Тёмная тема — бейджи */
html[data-theme="dark"] .badge-blue { background: rgba(77, 166, 217, .18); color: var(--primary-light); }
html[data-theme="dark"] .badge-green { background: rgba(72, 187, 120, .18); color: var(--success); }
html[data-theme="dark"] .badge-orange { background: rgba(237, 137, 54, .18); color: var(--warning); }
html[data-theme="dark"] .badge-red { background: rgba(229, 62, 62, .18); color: var(--danger); }
html[data-theme="dark"] .badge-gray { background: rgba(160, 174, 192, .15); color: var(--text-muted); }
html[data-theme="dark"] .badge-purple { background: rgba(159, 122, 234, .18); color: var(--purple); }

/* ---------- 11. Оценки ---------- */
.grade-5 { background: #c6f6d5; color: #22543d; }
.grade-4 { background: #bee3f8; color: #1a4f7a; }
.grade-3 { background: #fefcbf; color: #744210; }
.grade-2 { background: #fed7d7; color: #742a2a; }

html[data-theme="dark"] .grade-5 { background: rgba(72, 187, 120, .25); color: #9ae6b4; }
html[data-theme="dark"] .grade-4 { background: rgba(49, 130, 206, .25); color: #90cdf4; }
html[data-theme="dark"] .grade-3 { background: rgba(221, 107, 32, .25); color: #fbd38d; }
html[data-theme="dark"] .grade-2 { background: rgba(229, 62, 62, .25); color: #fc8181; }

/* ---------- 12. Специальные элементы с новым стилем ---------- */

/* Индикатор offline */
.offline-indicator {
  background: var(--warning);
  box-shadow: var(--shadow-lg);
}

/* Мобильный баннер */
.mobile-demo-banner {
  background: var(--accent);
}

/* PWA-баннер */
.pwa-install-banner {
  border-left: 4px solid var(--primary);
}

/* Скелетоны */
.skeleton {
  background: linear-gradient(90deg, var(--border) 0px, var(--bg-hover) 40px, var(--border) 80px);
  background-size: 200px 100%;
}

/* ---------- 13. Иконки (Feather) — тонкие, как на сайте школы ---------- */
.icon {
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

/* ---------- 14. Модальное окно ---------- */
.modal-overlay {
  background: rgba(4, 35, 60, .55);
  backdrop-filter: blur(3px);
}

.modal h2 {
  color: var(--primary);
}

/* ---------- 15. Оценки в журнале ---------- */
.journal-table input.journal-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(4, 85, 138, .2);
  background: var(--primary-soft);
}

.journal-table input.journal-input.filled {
  background: #e6f9ee;
  border-color: var(--success);
}

.journal-table input.journal-input.changed {
  background: #fdf3e8;
  border-color: var(--warning);
}

/* ---------- 16. Тепловая карта ---------- */
.heat-1 { background: #fdeaea; color: #742a2a; }
.heat-2 { background: #fdf3e8; color: #744210; }
.heat-3 { background: #e3f4fb; color: #1a4f7a; }
.heat-4 { background: #e6f9ee; color: #22543d; }

html[data-theme="dark"] .heat-1 { background: rgba(229, 62, 62, .2); color: #fc8181; }
html[data-theme="dark"] .heat-2 { background: rgba(221, 107, 32, .2); color: #fbd38d; }
html[data-theme="dark"] .heat-3 { background: rgba(24, 147, 210, .2); color: #90cdf4; }
html[data-theme="dark"] .heat-4 { background: rgba(72, 187, 120, .2); color: #9ae6b4; }

/* ---------- 17. Риски ---------- */
.risk-high { border-left-color: var(--danger); }
.risk-medium { border-left-color: var(--warning); }
.risk-low { border-left-color: var(--success); }

.risk-stat.high .num { color: var(--danger); }
.risk-stat.medium .num { color: var(--warning); }
.risk-stat.low .num { color: var(--success); }

/* ---------- 18. Акценты в аналитике ---------- */
.stat-card {
  border-left-color: var(--primary);
}

.stat-card .num {
  color: var(--primary);
}

/* ---------- 19. Ссылки и активные элементы ---------- */
a {
  color: var(--primary);
  text-decoration: none;
}
a:hover {
  color: var(--accent);
  text-decoration: underline;
}

/* Выделение текста */
::selection {
  background: var(--accent);
  color: #fff;
}

/* ---------- 20. Тонкие скроллбары в фирменных цветах ---------- */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}

*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }

*::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 4px;
}

*::-webkit-scrollbar-thumb:hover {
  background: var(--primary-light);
}

  /* ============================================================
     ТИПОГРАФИКА — единая шкала
     ============================================================ */
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.4px; }
  h2 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  h3 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  h4 { font-size: 14px; font-weight: 600; }
  .t-lg { font-size: 17px; }
  .t-md { font-size: 14px; }
  .t-sm { font-size: 12px; }

  /* ============================================================
     АНИМАЦИИ
     ============================================================ */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
  }
  @keyframes skeleton {
    0%   { background-position: -200px 0; }
    100% { background-position: calc(200px + 100%) 0; }
  }

  .card { animation: fadeInUp .35s ease; }
  .stat-card { animation: fadeInUp .35s ease backwards; }
  .stat-card:nth-child(1) { animation-delay: .02s; }
  .stat-card:nth-child(2) { animation-delay: .06s; }
  .stat-card:nth-child(3) { animation-delay: .10s; }
  .stat-card:nth-child(4) { animation-delay: .14s; }
  .stat-card:nth-child(5) { animation-delay: .18s; }
  .stat-card:nth-child(6) { animation-delay: .22s; }

  /* Скелетоны */
  .skeleton {
    background: linear-gradient(90deg, var(--border) 0px, var(--bg-hover) 40px, var(--border) 80px);
    background-size: 200px 100%;
    animation: skeleton 1.4s infinite linear;
    border-radius: 6px;
  }
  .skeleton-line { height: 14px; margin-bottom: 8px; }
  .skeleton-line.short { width: 60%; }
  .skeleton-block { height: 80px; margin-bottom: 12px; }

  /* ============================================================
     ШАПКА
     ============================================================ */
  header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
    position: sticky; top: 0; z-index: 100;
  }
  header .brand {
    font-size: 17px; font-weight: 700; letter-spacing: .3px; white-space: nowrap;
    display: flex; align-items: center; gap: 10px;
  }
  header .user-info { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
  header .user-info .role-badge {
    background: rgba(255,255,255,.2); padding: 3px 10px; border-radius: 20px; font-size: 12px;
  }
  header button {
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4);
    color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; transition: all .15s; font-family: inherit;
    min-height: 38px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  header button:hover { background: rgba(255,255,255,.3); transform: translateY(-1px); }
  header button:active { transform: translateY(1px); }
  header .theme-btn { background: rgba(255,255,255,.2); }
  header .undo-btn { background: #dd6b20; border-color: #dd6b20; font-weight: 600; }
  header .archive-btn { background: #805ad5; border-color: #805ad5; font-weight: 600; }
  header .mobile-toggle-btn { background: #38a169; border-color: #38a169; font-weight: 600; }
  header .mobile-toggle-btn.active { background: #c53030; border-color: #c53030; }

  /* ============================================================
     ОФФЛАЙН ИНДИКАТОР
     ============================================================ */
  .offline-indicator {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--warning); color: #fff; padding: 10px 20px; border-radius: 30px;
    font-size: 14px; font-weight: 600; z-index: 9999;
    box-shadow: var(--shadow-lg);
    display: none; align-items: center; gap: 8px;
  }
  .offline-indicator.visible { display: flex; animation: fadeInUp .3s ease; }

  /* ============================================================
     НАВИГАЦИЯ
     ============================================================ */
  nav.tabs {
    display: flex; background: var(--bg-card); border-bottom: 2px solid var(--border);
    padding: 0 24px; gap: 4px; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    position: sticky; top: 66px; z-index: 99;
    transition: background .25s ease;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    background: none; border: none; padding: 14px 20px; font-size: 14px;
    cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent;
    transition: all .2s; white-space: nowrap; font-family: inherit;
    min-height: 48px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  nav.tabs button:hover { color: var(--primary); background: var(--bg-hover); }
  nav.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

  /* ============================================================
     КОНТЕНТ
     ============================================================ */
  main { flex: 1; padding: 24px; max-width: 1600px; width: 100%; margin: 0 auto; }

  .card {
    background: var(--bg-card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow); margin-bottom: 20px;
    transition: background .25s ease, box-shadow .25s ease;
  }
  .card h2 { color: var(--primary); margin-bottom: 16px; }
  .card h3 { color: var(--text-2); margin: 12px 0 8px; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px; margin-bottom: 20px;
  }
  .stat-card {
    background: var(--bg-card); border-radius: var(--radius); padding: 20px; text-align: center;
    box-shadow: var(--shadow); border-left: 4px solid var(--primary);
    transition: all .2s ease;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }

<script>

  'экспертный': 'badge-purple', 'высокий': 'badge-green',

};

/* ============================================================

   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtDate = d => d ? d.split('-').reverse().join('.') : '—';
const gradeClass = v => ({'5':'grade-5','4':'grade-4','3':'grade-3','2':'grade-2'})[v] || 'grade-na';

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* Feather Icons — inline SVG */
function icon(name, size = 16, cls = '') {
  const svgs = {

/* Тост-уведомления */
function showToast(msg, type = 'info', duration = 3000) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = `${icon(type === 'success' ? 'check' : type === 'error' ? 'alert' : 'info')} ${esc(msg)}`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'fadeInUp .3s ease reverse';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

/* ============================================================
   ТЕМА
   ============================================================ */
const THEME_KEY = 'sa_theme';
function applyTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'auto';
  let theme = saved;
  if (saved === 'auto') {
    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
  return saved;
}
function setTheme(t) {
  localStorage.setItem(THEME_KEY, t);
  applyTheme();
  render();
}
function cycleTheme() {
  const cur = localStorage.getItem(THEME_KEY) || 'auto';
  const order = ['light', 'dark', 'auto'];
  const idx = order.indexOf(cur);
  setTheme(order[(idx + 1) % order.length]);
}
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if ((localStorage.getItem(THEME_KEY) || 'auto') === 'auto') applyTheme();
});

/* ============================================================
   PWA
   ============================================================ */
let deferredPrompt = null;
let isOnline = navigator.onLine;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => console.log('[PWA] SW зарегистрирован:', reg.scope))
      .catch(err => console.warn('[PWA] Ошибка SW:', err));
  });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (localStorage.getItem('sa_pwa_hidden') !== '1') {
    setTimeout(() => document.getElementById('pwaBanner')?.classList.add('visible'), 3000);
  }
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('pwaBanner')?.classList.remove('visible');
});

function installPwa() {
  if (!deferredPrompt) {
    showToast('Установка недоступна. Chrome: меню → «Установить приложение»', 'info', 5000);
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    document.getElementById('pwaBanner')?.classList.remove('visible');
    deferredPrompt = null;
  });
}

function hidePwaBanner() {
  document.getElementById('pwaBanner')?.classList.remove('visible');
  localStorage.setItem('sa_pwa_hidden', '1');
}

function updateOnlineStatus() {
  isOnline = navigator.onLine;
  const ind = document.getElementById('offlineIndicator');
  if (ind) ind.classList.toggle('visible', !isOnline);
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

    const t = d.subjectTeachersList.find(x => x.id === teacherId);
    if (!t || !t.notes) return;
    t.notes = t.notes.filter(n => n.id !== noteId);
    this.save();
  },
  getSubjectTeachers() { return this.load().subjectTeachers; },
  getSubjectTeacher(classId, subject) {
    const d = this.load();
    const st = d.subjectTeachers.find(x => x.classId === classId && x.subject === subject);
    if (!st) return null;
    return d.subjectTeachersList.find(t => t.id === st.teacherId) || null;
  },
  setSubjectTeacher(classId, subject, teacherId) {
    const d = this.load();
    const idx = d.subjectTeachers.findIndex(x => x.classId === classId && x.subject === subject);
    if (!teacherId) { if (idx >= 0) d.subjectTeachers.splice(idx, 1); }
    else {
      if (idx >= 0) d.subjectTeachers[idx].teacherId = teacherId;
      else d.subjectTeachers.push({ id: d.nextIds.subjectTeacher++, classId, subject, teacherId });
    }
    this.save();
  },
  setSubjectTeacherBulk(classId, teacherId) {
    const d = this.load();
    d.subjects.forEach(sub => {
      const idx = d.subjectTeachers.findIndex(x => x.classId === classId && x.subject === sub);
      if (!teacherId) { if (idx >= 0) d.subjectTeachers.splice(idx, 1); }
      else {
        if (idx >= 0) d.subjectTeachers[idx].teacherId = teacherId;
        else d.subjectTeachers.push({ id: d.nextIds.subjectTeacher++, classId, subject: sub, teacherId });
      }
    });
    this.save();
  },

  /* Buildings */
  getBuildings() { return this.load().buildings; },
  addBuilding(name) { const d=this.load(); const b={id:this.nextId('building'),name}; d.buildings.push(b); this.save(); return b; },
  deleteBuilding(id) { const d=this.load(); d.buildings=d.buildings.filter(b=>b.id!==id); this.save(); },

  /* Classes */
  getClasses() { return this.load().classes; },
  addClass(c) { const d=this.load(); c.id=this.nextId('class'); d.classes.push(c); this.save(); return c; },
  updateClass(id,patch) { const d=this.load(); const c=d.classes.find(x=>x.id===id); if(c) Object.assign(c,patch); this.save(); },
  deleteClass(id) {
    const d=this.load();
    d.classes=d.classes.filter(c=>c.id!==id);
    const removed=d.students.filter(s=>s.classId===id).map(s=>s.id);
    d.students=d.students.filter(s=>s.classId!==id);
    d.grades=d.grades.filter(g=>!removed.includes(g.studentId));
    d.diagnostics=d.diagnostics.filter(x=>!removed.includes(x.studentId));
    d.subjectTeachers=d.subjectTeachers.filter(st=>st.classId!==id);
    this.save();
  },

  /* Students */
  getStudents() { return this.load().students; },
  getStudent(id) { return this.load().students.find(s=>s.id===id); },
  addStudent(s) { const d=this.load(); s.id=this.nextId('student'); d.students.push(s); this.save(); return s; },
  updateStudent(id,patch) { const d=this.load(); const s=d.students.find(x=>x.id===id); if(s) Object.assign(s,patch); this.save(); },
  deleteStudent(id) {
    const d=this.load();
    d.students=d.students.filter(s=>s.id!==id);
    d.grades=d.grades.filter(g=>g.studentId!==id);
    d.diagnostics=d.diagnostics.filter(x=>x.studentId!==id);
    this.save();
  },

  /* Subjects */
  getSubjects() { return this.load().subjects; },
  addSubject(name) { const d=this.load(); if(!d.subjects.includes(name)) { d.subjects.push(name); this.save(); } },
  deleteSubject(name) {
    const d=this.load();
    d.subjects=d.subjects.filter(s=>s!==name);
    d.grades=d.grades.filter(g=>g.subject!==name);
    d.subjectTeachers=d.subjectTeachers.filter(st=>st.subject!==name);
    this.save();
  },

  /* Grades */
  getGrades() { return this.load().grades; },
  addGrade(g) { const d=this.load(); g.id=this.nextId('grade'); d.grades.push(g); this.save(); return g; },
  deleteGrade(id) { const d=this.load(); d.grades=d.grades.filter(g=>g.id!==id); this.save(); },

  /* Diagnostics */
  getDiagnostics() { return this.load().diagnostics; },
  addDiagnostic(x) { const d=this.load(); x.id=this.nextId('diagnostic'); d.diagnostics.push(x); this.save(); return x; },
  updateDiagnostic(id,patch) { const d=this.load(); const x=d.diagnostics.find(i=>i.id===id); if(x) Object.assign(x,patch); this.save(); },
  deleteDiagnostic(id) { const d=this.load(); d.diagnostics=d.diagnostics.filter(x=>x.id!==id); this.save(); },

  /* Backup */
  exportAll() {
    return JSON.stringify({
      version: 5, exportedAt: new Date().toISOString(),
      data: this.load(),
    }, null, 2);
  },
  importAll(json) {
    const parsed = JSON.parse(json);
    if (!parsed.data) throw new Error('Неверный формат');
    this._data = parsed.data;
    this._migrate();
    this.save();
  },
  createSnapshot(label) {
    const d = this.load();
    if (!d.snapshots) d.snapshots = [];
    d.snapshots.unshift({
      id: d.nextIds.snapshot ? d.nextIds.snapshot++ : (d.nextIds.snapshot = 2, 1),
      label: label || 'Автосохранение ' + new Date().toLocaleString('ru-RU'),
      date: new Date().toISOString(),
      size: JSON.stringify(d).length,
      data: JSON.parse(JSON.stringify(d)),
    });
    if (d.snapshots.length > 10) d.snapshots = d.snapshots.slice(0, 10);
    this.save();
  },
  restoreSnapshot(id) {
    const d = this.load();
    const snap = (d.snapshots || []).find(s => s.id === id);
    if (!snap) return false;
    this._data = JSON.parse(JSON.stringify(snap.data));
    this.save();
    return true;
  },
  deleteSnapshot(id) {
    const d = this.load();
    d.snapshots = (d.snapshots || []).filter(s => s.id !== id);
    this.save();
  },

  /* Auto reports */
  getAutoReports() { return this.load().autoReports || {}; },
  setAutoReports(patch) {
    const d = this.load();
    d.autoReports = { ...(d.autoReports || {}), ...patch };
    this.save();
  },

  /* Dashboard widgets */
  getDashboardWidgets() { return this.load().dashboardWidgets || ['stats','classesTable','classesChart']; },
  setDashboardWidgets(list) { const d = this.load(); d.dashboardWidgets = list; this.save(); },
};

/* ============================================================
   UNDO
   ============================================================ */
const UndoStack = {
  _key: 'sa_undo_stack',
  _items: [],
  load() {
    try { const raw = sessionStorage.getItem(this._key); this._items = raw ? JSON.parse(raw) : []; }
    catch(e) { this._items = []; }
    return this._items;
  },
  save() { sessionStorage.setItem(this._key, JSON.stringify(this._items.slice(-10))); },
  push(label) {
    const snapshot = JSON.parse(JSON.stringify(DB.load()));
    this._items.push({ label, snapshot, ts: Date.now() });
    if (this._items.length > 10) this._items.shift();
    this.save();
  },
  pop() { const item = this._items.pop(); this.save(); return item; },
  peek() { return this._items.length ? this._items[this._items.length - 1] : null; },
  count() { return this._items.length; },
  clear() { this._items = []; this.save(); }
};

function undoLastAction() {
  const item = UndoStack.peek();
  if (!item) { showToast('Нет действий для отмены', 'info'); return; }
  const when = new Date(item.ts).toLocaleTimeString('ru-RU');
  if (!confirm(`Отменить последнее действие?\n\n«${item.label}»\nВремя: ${when}`)) return;
  const popped = UndoStack.pop();
  DB._data = popped.snapshot;
  DB.save();
  showToast('Отменено: ' + popped.label, 'success');
  render();
}

function getAvailableTabs() {

    tabs.push('journal','subject-teachers','directories','users','backup');

function initSwipe() {
  const app = document.getElementById('app');
  if (!app) return;
  app.removeEventListener('touchstart', onTouchStart);
  app.removeEventListener('touchmove', onTouchMove);
  app.removeEventListener('touchend', onTouchEnd);
  app.addEventListener('touchstart', onTouchStart, { passive: true });
  app.addEventListener('touchmove', onTouchMove, { passive: false });
  app.addEventListener('touchend', onTouchEnd, { passive: true });
}
function onTouchStart(e) {
  const t = e.target;
  if (['INPUT','TEXTAREA','SELECT'].includes(t.tagName)) return;
  if (t.closest('.table-wrap') || t.closest('.journal-table') || t.closest('.modal') || t.closest('.widget')) return;
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swipeActive = true;
}
function onTouchMove(e) {
  if (!swipeActive) return;
  const dx = e.touches[0].clientX - swipeStartX;
  const dy = e.touches[0].clientY - swipeStartY;
  if (Math.abs(dy) > Math.abs(dx)) return;
  const hl = document.getElementById('swipeHintLeft');
  const hr = document.getElementById('swipeHintRight');
  if (hl && dx > 30) { hl.classList.add('visible'); hr?.classList.remove('visible'); }
  else if (hr && dx < -30) { hr.classList.add('visible'); hl?.classList.remove('visible'); }
}
function onTouchEnd(e) {
  if (!swipeActive) return;
  swipeActive = false;
  document.getElementById('swipeHintLeft')?.classList.remove('visible');
  document.getElementById('swipeHintRight')?.classList.remove('visible');
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if (Math.abs(dx) < 80) return;
  if (Math.abs(dy) > Math.abs(dx)) return;
  const tabs = getAvailableTabs();
  const hash = location.hash.replace('#', '') || 'dashboard';
  const current = hash.split('/')[0];
  let idx = tabs.indexOf(current);
  if (idx < 0) idx = 0;
  if (dx > 0 && idx > 0) go(tabs[idx - 1]);
  else if (dx < 0 && idx < tabs.length - 1) go(tabs[idx + 1]);
}

   ============================================================ */
function gradeMatrix(studentId) {
  const m = {};
  DB.getGrades().filter(g => g.studentId === studentId).forEach(g => {
    const k = g.subject + '|' + g.period;
    if (!m[k]) m[k] = {};
    if (!m[k][g.type]) m[k][g.type] = [];
    m[k][g.type].push(g);
  });
  return m;
}
function finalGrade(studentId, subject, year) {
  const gs = DB.getGrades().filter(g => g.studentId === studentId && g.subject === subject
    && (!year || g.year === year));
  if (!gs.length) return '';
  let x = gs.find(g => g.period === 'Год' && g.type === 'итоговая'); if (x) return x.value;
  x = gs.find(g => g.period === 'Год'); if (x) return x.value;
  x = gs.find(g => g.type === 'итоговая'); if (x) return x.value;
  return gs[gs.length - 1].value;
}
function usedSubjects() {
  const set = new Set(DB.getGrades().map(g => g.subject));
  return DB.getSubjects().filter(s => set.has(s));
}
function studentAvg(studentId) {
  const grades = DB.getGrades().filter(g => g.studentId === studentId && /^[2-5]$/.test(g.value));
  if (!grades.length) return 0;
  return grades.reduce((a,g) => a + +g.value, 0) / grades.length;
}
function studentCategory(studentId) {
  const avg = studentAvg(studentId);
  if (!avg) return 'none';
  if (avg >= 4.5) return 'excellent';
  if (avg >= 3.5) return 'good';
  if (avg >= 2.5) return 'satisfactory';
  return 'poor';
}

/* ПРОГНОЗ РИСКА */
function studentRisk(studentId) {
  const student = DB.getStudent(studentId);
  if (!student) return { level: 'none', score: 0, reasons: [] };

  const grades = DB.getGrades().filter(g => g.studentId === studentId && /^[2-5]$/.test(g.value));
  const avg = grades.length ? grades.reduce((a,g) => a + +g.value, 0) / grades.length : 0;

  const diags = DB.getDiagnostics().filter(d => d.studentId === studentId);
  const badDiags = diags.filter(d => d.level === 'низкий' || d.level === 'базовый').length;

  // Простой скоринг
  let score = 0;
  const reasons = [];

  if (avg && avg < 3.0) { score += 40; reasons.push(`средний балл ${avg.toFixed(2)}`); }
  else if (avg && avg < 3.5) { score += 20; reasons.push(`средний балл ${avg.toFixed(2)}`); }

  if (badDiags >= 3) { score += 25; reasons.push(`${badDiags} диагностик низкого/базового уровня`); }
  else if (badDiags >= 2) { score += 15; reasons.push(`${badDiags} диагностики низкого уровня`); }

  // Считаем долю "2" и "3"
  const twos = grades.filter(g => g.value === '2').length;
  const threes = grades.filter(g => g.value === '3').length;
  const total = grades.length || 1;
  if (twos / total > 0.15) { score += 30; reasons.push(`много двоек (${twos})`); }
  else if (threes / total > 0.35) { score += 15; reasons.push(`много троек (${threes})`); }

  let level = 'low';
  if (score >= 50) level = 'high';
  else if (score >= 25) level = 'medium';

  return { level, score, reasons, avg, badDiags };
}

/* ============================================================
   CSV / XLSX
   ============================================================ */
function downloadCSV(filename, content) {
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Экспорт в XLSX с цветом и формулами */
function downloadXLSX(filename, sheets) {
  // sheets: [{ name, rows: [[...]], colWidths: [w1, w2, ...] }]
  try {
    const wb = XLSX.utils.book_new();
    sheets.forEach(sheet => {
      const ws = XLSX.utils.aoa_to_sheet(sheet.rows);

      // Ширина колонок
      if (sheet.colWidths) {
        ws['!cols'] = sheet.colWidths.map(w => ({ wch: w }));
      }

      // Цветная заливка ячеек (условное форматирование вручную)
      if (sheet.coloredCells) {
        sheet.coloredCells.forEach(({ r, c, bg, color, bold }) => {
          const addr = XLSX.utils.encode_cell({ r, c });
          if (!ws[addr]) return;
          ws[addr].s = ws[addr].s || {};
          if (bg) ws[addr].s.fill = { fgColor: { rgb: bg } };
          if (color) ws[addr].s.font = { color: { rgb: color }, bold: !!bold };
        });
      }

      // Автофильтр для первой строки (заголовки)
      const range = XLSX.utils.decode_range(ws['!ref']);
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({
        s: { r: range.s.r, c: range.s.c },
        e: { r: range.e.r, c: range.e.c }
      })};

      XLSX.utils.book_append_sheet(wb, ws, sheet.name);
    });

    XLSX.writeFile(wb, filename);
    showToast('Excel-файл сохранён: ' + filename, 'success');
  } catch (err) {
    console.error(err);
    showToast('Ошибка экспорта XLSX: ' + err.message, 'error', 5000);
  }
}

/* Универсальная функция — делает и XLSX, и CSV */
function exportData(filenameBase, sheets) {
  // XLSX
  downloadXLSX(filenameBase + '.xlsx', sheets);
}

function renderWidgetClassesTable(students, classes, subjects) {
  const rows = classes.map(c => {
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0;
    sts.forEach(s => subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v)) { sum += +v; cnt++; }
    }));
    const avg = cnt ? (sum/cnt).toFixed(2) : '—';
    const cls = cnt ? (+avg >= 4.5 ? 'badge-green' : +avg >= 3.5 ? 'badge-blue' : 'badge-orange') : 'badge-gray';
    const b = DB.getBuildings().find(x => x.id === c.buildingId);
    const t = DB.getTeachers().find(x => x.id === c.teacherId);
    return `<tr>
      <td><b>${esc(c.name)}</b></td>
      <td class="hide-mobile">${esc(b ? b.name : '—')}</td>
      <td class="hide-mobile">${esc(t ? t.name : '—')}</td>
      <td class="text-right">${sts.length}</td>
      <td class="text-right"><span class="badge ${cls}">${avg}</span></td>
      <td class="text-right">
        <button class="btn btn-outline btn-sm btn-icon" onclick="exportClass(${c.id})" title="Экспорт в PDF">
          ${icon('file-pdf', 12)}
        </button>
      </td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table>
    <thead><tr><th>Класс</th><th class="hide-mobile">Здание</th><th class="hide-mobile">Рук-ль</th>
    <th class="text-right">Уч.</th><th class="text-right">Ср.</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderWidgetClassesChart(classes, students, subjects) {

function renderWidgetRisks(students) {
  const risks = students.map(s => ({ s, r: studentRisk(s.id) }))
    .sort((a, b) => b.r.score - a.r.score).slice(0, 5);
  if (!risks.length) return `<div class="empty">
    <div class="empty-icon">✓</div>
    <div>Нет учеников</div>
  </div>`;
  return risks.map(({ s, r }) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
      <div>
        <div style="font-weight:600;">${esc(fullName(s))}</div>
        <div class="muted" style="font-size:11px;">${r.reasons.join(' · ') || 'нет данных'}</div>
      </div>
      <span class="badge ${r.level === 'high' ? 'badge-red' : r.level === 'medium' ? 'badge-orange' : 'badge-green'}">
        ${r.level === 'high' ? 'высокий' : r.level === 'medium' ? 'средний' : 'низкий'}
      </span>
    </div>
  `).join('');
}

function renderWidgetTopStudents(students, subjects) {
  const tops = students.map(s => {
    let sum = 0, cnt = 0;
    subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v)) { sum += +v; cnt++; }
    });
    return { s, avg: cnt ? sum/cnt : 0 };
  }).filter(x => x.avg > 0).sort((a,b) => b.avg - a.avg).slice(0, 5);
  if (!tops.length) return `<div class="empty"><div class="empty-icon">👥</div><div>Нет данных</div></div>`;
  const medals = ['🥇','🥈','🥉'];
  return tops.map((x, i) => `
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
      <div>${i < 3 ? medals[i] : (i+1) + '.'} <b>${esc(fullName(x.s))}</b></div>
      <span class="badge badge-green">${x.avg.toFixed(2)}</span>
    </div>
  `).join('');
}

/* Drag-n-drop виджетов */
function initWidgetDrag() {
  const grid = document.getElementById('widgetGrid');
  if (!grid) return;
  const widgets = grid.querySelectorAll('.widget');
  let dragged = null;

  widgets.forEach(w => {
    w.addEventListener('dragstart', e => {
      dragged = w;
      w.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    w.addEventListener('dragend', () => {
      w.classList.remove('dragging');
      widgets.forEach(x => x.classList.remove('drag-over'));
      // Сохраняем порядок
      const newOrder = Array.from(grid.querySelectorAll('.widget')).map(x => x.dataset.widget);
      DB.setDashboardWidgets(newOrder);
    });
    w.addEventListener('dragover', e => {
      e.preventDefault();
      if (dragged && dragged !== w) {
        w.classList.add('drag-over');
      }
    });
    w.addEventListener('dragleave', () => w.classList.remove('drag-over'));
    w.addEventListener('drop', e => {
      e.preventDefault();
      w.classList.remove('drag-over');
      if (dragged && dragged !== w) {
        const all = Array.from(grid.children);
        const fromIdx = all.indexOf(dragged);
        const toIdx = all.indexOf(w);
        if (fromIdx < toIdx) w.after(dragged);
        else w.before(dragged);
      }
    });
  });
}

let charts = {};
function destroyChart(key) { if (charts[key]) { charts[key].destroy(); delete charts[key]; } }
const CHART_FONT = { family: "'Segoe UI', Roboto, sans-serif", size: 11 };
function chartTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  return {
    text: isDark ? '#cbd5e0' : '#475569',
    grid: isDark ? '#2d3748' : '#e2e8f0',
    font: { ...CHART_FONT, size: 11 },
  };
}

function drawStudentYearly(studentId) {
  destroyChart('studentYearly');
  const ctx = document.getElementById('chartStudentYearly');
  if (!ctx) return;
  const grades = DB.getGrades().filter(g => g.studentId === studentId && /^[2-5]$/.test(g.value));
  const yearsSet = new Set(grades.map(g => g.year || '2024-2025'));
  const years = [...yearsSet].sort();
  const data = years.map(y => {
    const gs = grades.filter(g => (g.year || '2024-2025') === y);
    return gs.length ? +(gs.reduce((a,b) => a + +b.value, 0) / gs.length).toFixed(2) : null;
  });
  const t = chartTheme();
  charts.studentYearly = new Chart(ctx, {
    type: 'line',
    data: { labels: years, datasets: [{
      label: 'Средний балл', data, borderColor: '#3182ce',
      backgroundColor: 'rgba(49,130,206,.15)', fill: true, tension: .3,
      pointRadius: 6, pointBackgroundColor: '#3182ce', spanGaps: true,
    }]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: t.font, color: t.text } } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5, font: t.font, color: t.text }, grid: { color: t.grid } },
                x: { ticks: { font: t.font, color: t.text }, grid: { display: false } } } }
  });
}

function drawStudentDynamics(studentId) {
  destroyChart('dynamics');
  const ctx = document.getElementById('chartStudentDynamics');
  if (!ctx) return;
  const data = PERIODS.map(p => {
    const gs = DB.getGrades().filter(g => g.studentId === studentId && g.period === p && /^[2-5]$/.test(g.value));
    return gs.length ? +(gs.reduce((a,b)=>a+ +b.value,0)/gs.length).toFixed(2) : null;
  });
  const t = chartTheme();
  charts.dynamics = new Chart(ctx, {
    type: 'line',
    data: { labels: PERIODS, datasets: [{
      label: 'Средний балл', data, borderColor: '#2c5282',
      backgroundColor: 'rgba(44,82,130,.12)', fill: true, tension: .3,
      pointRadius: 5, pointBackgroundColor: '#2c5282', spanGaps: true,
    }]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: t.font, color: t.text } } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5, font: t.font, color: t.text }, grid: { color: t.grid } },
                x: { ticks: { font: t.font, color: t.text }, grid: { display: false } } } }
  });
}

function drawStudentSubjects(studentId) {
  destroyChart('subjects');
  const ctx = document.getElementById('chartStudentSubjects');
  if (!ctx) return;
  const subjects = usedSubjects();
  const values = subjects.map(s => { const v = finalGrade(studentId, s); return /^[2-5]$/.test(v) ? +v : null; });
  const colors = values.map(v => v===5?'#38a169':v===4?'#3182ce':v===3?'#dd6b20':v===2?'#e53e3e':'#cbd5e0');
  const t = chartTheme();
  charts.subjects = new Chart(ctx, {
    type: 'bar',
    data: { labels: subjects, datasets: [{ label: 'Итоговая', data: values, backgroundColor: colors, borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: 1, font: t.font, color: t.text }, grid: { color: t.grid } },
                x: { ticks: { font: t.font, color: t.text, maxRotation: 60 }, grid: { display: false } } } }
  });
}

function drawGradePie(studentId) {
  destroyChart('pie');
  const ctx = document.getElementById('chartGradePie');
  if (!ctx) return;
  const grades = DB.getGrades().filter(g => g.studentId === studentId && /^[2-5]$/.test(g.value));
  const counts = {'5':0,'4':0,'3':0,'2':0};
  grades.forEach(g => counts[g.value]++);
  const t = chartTheme();
  charts.pie = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: ['5','4','3','2'],
      datasets: [{ data: [counts['5'],counts['4'],counts['3'],counts['2']],
        backgroundColor: ['#38a169','#3182ce','#dd6b20','#e53e3e'], borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: t.font, color: t.text } } } }
  });
}

function drawDiagBars(studentId) {
  destroyChart('diag');
  const ctx = document.getElementById('chartDiagBars');
  if (!ctx) return;
  const diags = DB.getDiagnostics().filter(d => d.studentId === studentId && d.score != null)
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const t = chartTheme();
  charts.diag = new Chart(ctx, {
    type: 'bar',
    data: { labels: diags.map(d => d.title.length > 20 ? d.title.slice(0,18)+'…' : d.title),
      datasets: [{ label: 'Балл', data: diags.map(d => d.score),
        backgroundColor: diags.map(d => {
          if (d.maxScore && d.score != null) {
            const p = d.score / d.maxScore;
            return p >= .85 ? '#38a169' : p >= .65 ? '#3182ce' : p >= .45 ? '#dd6b20' : '#e53e3e';
          }
          return '#3182ce';
        }), borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { font: t.font, color: t.text }, grid: { color: t.grid } },
                x: { ticks: { font: t.font, color: t.text, maxRotation: 45 }, grid: { display: false } } } }
  });
}

function drawClassesAvgChart(classes, students, subjects, ctxId) {
  const id = ctxId || 'classesAvg';
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  const labels = [], values = [];
  classes.forEach(c => {
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0;
    sts.forEach(s => subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v)) { sum += +v; cnt++; }
    }));
    labels.push(c.name);
    values.push(cnt ? +(sum/cnt).toFixed(2) : 0);
  });
  const t = chartTheme();
  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Ср. балл', data: values,
      backgroundColor: values.map(v => v>=4.5?'#38a169':v>=3.5?'#3182ce':v>=2.5?'#dd6b20':'#e53e3e'),
      borderRadius: 8 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: .5, font: t.font, color: t.text }, grid: { color: t.grid } },
                x: { ticks: { font: t.font, color: t.text }, grid: { display: false } } } }
  });
}

        <select id="f_teacher" disabled><option>— из класса —</option></select></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveStudent(${id||'null'})">${icon('save', 14)} Сохранить</button>
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
    </div>
  `);
  const bSel = document.getElementById('f_building');
  const tSel = document.getElementById('f_teacher');
  bSel.innerHTML = buildings.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
  tSel.innerHTML = teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');

}

function syncClassInfo() {
  const cid = +document.getElementById('f_class').value;
  const bSel = document.getElementById('f_building');
  const tSel = document.getElementById('f_teacher');
  if (!cid) { bSel.value = ''; tSel.value = ''; return; }
  const c = DB.getClasses().find(x => x.id === cid);
  if (c) { bSel.value = c.buildingId; tSel.value = c.teacherId || ''; }
}

function saveStudent(id) {
  const last = document.getElementById('f_last').value.trim();
  const first = document.getElementById('f_first').value.trim();
  const cid = +document.getElementById('f_class').value;
  if (!last || !first) { showToast('Укажите ФИО', 'error'); return; }
  if (!cid) { showToast('Выберите класс', 'error'); return; }
  const data = {
    lastName: last, firstName: first,
    middleName: document.getElementById('f_middle').value.trim(),
    birthDate: document.getElementById('f_birth').value, classId: cid,
  };
  if (!id) UndoStack.push(`Добавление ученика`);
  if (id) DB.updateStudent(id, data); else DB.addStudent(data);
  closeModal();
  showToast(id ? 'Ученик обновлён' : 'Ученик добавлен', 'success');
  render();
}

function delStudent(id) {
  const s = DB.getStudent(id);
  if (!confirm(`Удалить «${fullName(s)}»?`)) return;
  UndoStack.push('Удаление ученика');
  DB.deleteStudent(id);
  showToast('Ученик удалён', 'success');
  render();
}

function openStudent(id) {
  if (!canAccessStudent(id)) { showToast('Нет доступа', 'error'); return; }
  location.hash = 'student/' + id;
}

/* Тепловая карта */
function renderAnalyticsHeatmap(tabs) {
  const classes = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();

  // Считаем средний балл по каждому классу × предмету
  const matrix = {}; // matrix[classId][subject] = avg
  const overall = {};

  subjects.forEach(sub => {
    let totalSum = 0, totalCnt = 0;
    classes.forEach(c => {
      const sts = students.filter(s => s.classId === c.id);
      let sum = 0, cnt = 0;
      sts.forEach(s => {
        const gs = DB.getGrades().filter(g => g.studentId === s.id && g.subject === sub && /^[2-5]$/.test(g.value));
        gs.forEach(g => { sum += +g.value; cnt++; });
      });
      const avg = cnt ? sum/cnt : 0;
      matrix[c.id + '|' + sub] = { avg, cnt };
      totalSum += sum; totalCnt += cnt;
    });
    overall[sub] = totalCnt ? totalSum/totalCnt : 0;
  });

  // Строки — классы
  const headerRow = `<th>Класс</th>` + subjects.map(s => `<th class="nowrap">${esc(s.length > 10 ? s.slice(0,9)+'.' : s)}</th>`).join('');

  const rows = classes.map(c => {
    const cells = subjects.map(sub => {
      const m = matrix[c.id + '|' + sub];
      if (!m.cnt) return `<td>—</td>`;
      const diff = m.avg - overall[sub];
      let heat = 'heat-2';
      if (diff > 0.3) heat = 'heat-4';
      else if (diff > 0.05) heat = 'heat-3';
      else if (diff < -0.3) heat = 'heat-1';
      return `<td class="${heat}" title="Средний балл: ${m.avg.toFixed(2)} (по школе: ${overall[sub].toFixed(2)})">${m.avg.toFixed(2)}</td>`;
    }).join('');
    return `<tr><td class="class-col">${esc(c.name)}</td>${cells}</tr>`;
  }).join('');

  // Строка "по школе"
  const schoolRow = `<tr><td class="class-col"><b>По школе</b></td>` +
    subjects.map(s => `<td><b>${overall[s].toFixed(2)}</b></td>`).join('') + `</tr>`;

  page(`
    <h1 style="margin-bottom:16px;color:var(--primary);">Аналитика</h1>
    ${tabs}
    <div class="card">
      <div class="row-flex" style="justify-content:space-between;margin-bottom:14px;">
        <h2 style="margin:0;">${icon('grid', 18)} Тепловая карта: классы × предметы</h2>
        <button class="btn btn-success btn-sm" onclick="exportHeatmapXLSX()" title="Скачать XLSX">
          ${icon('file-excel', 14)} Excel
        </button>
      </div>
      <div class="alert alert-info">
        ${icon('info', 14)} Цвет показывает отклонение от среднего по школе:
        <span class="heat-1" style="padding:2px 6px;border-radius:4px;">значительно ниже</span>
        <span class="heat-2" style="padding:2px 6px;border-radius:4px;">в норме</span>
        <span class="heat-3" style="padding:2px 6px;border-radius:4px;">выше</span>
        <span class="heat-4" style="padding:2px 6px;border-radius:4px;">значительно выше</span>

function exportHeatmapXLSX() {

function exportAnalyticsXLSX() {
  const classes = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();
  const rows = [['Класс', 'Учеников', 'Средний балл', 'Отличников', 'Хорошистов', 'Успевающих', 'Неуспевающих']];
  const colored = [];

  classes.forEach((c, i) => {
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0, exc = 0, good = 0, sat = 0, poor = 0;
    sts.forEach(s => {
      let ss = 0, cc = 0;
      subjects.forEach(sub => {
        const v = finalGrade(s.id, sub);
        if (/^[2-5]$/.test(v)) { ss += +v; cc++; }
      });
      const avg = cc ? ss/cc : 0;

    rows.push([c.name, sts.length, avgCls, exc, good, sat, poor]);
    if (avgCls) {
      const v = +avgCls;
      const bg = v >= 4.5 ? 'C6F6D5' : v >= 3.5 ? 'BEE3F8' : v >= 2.5 ? 'FEFCBF' : 'FED7D7';
      colored.push({ r: i + 1, c: 2, bg, bold: true });

    name: 'Классы',
    rows,
    colWidths: [12, 12, 14, 12, 12, 12, 14],
    coloredCells: colored,
  }]);

function exportTeachersXLSX() {
  const classes = allowedClasses();
  const students = allowedStudents();
  const teachersList = DB.getSubjectTeachersList();
  const rows = [['Учитель', 'МЦКО', 'Предметов', 'Классов', 'Учеников', 'Средний балл', 'Оценок', 'Замечаний']];
  const colored = [];
  teachersList.forEach((t, i) => {
    const assignments = DB.getSubjectTeachers().filter(st => st.teacherId === t.id
      && classes.some(c => c.id === st.classId));
    if (!assignments.length) {
      rows.push([t.name, t.mckoLevel || 'нет', 0, 0, 0, '', 0, (t.notes || []).length]);
      return;
    }
    const subjectsSet = new Set(), classesSet = new Set(), studentSet = new Set();
    let sum = 0, cnt = 0;
    assignments.forEach(a => {
      subjectsSet.add(a.subject);
      classesSet.add(a.classId);
      students.filter(s => s.classId === a.classId).forEach(s => {
        studentSet.add(s.id);
        DB.getGrades().filter(g => g.studentId === s.id && g.subject === a.subject && /^[2-5]$/.test(g.value))
          .forEach(g => { sum += +g.value; cnt++; });
      });
    });
    const avg = cnt ? (sum/cnt).toFixed(2) : '';
    rows.push([t.name, t.mckoLevel || 'нет', subjectsSet.size, classesSet.size, studentSet.size,
      avg, cnt, (t.notes || []).length]);
    if (avg) {
      const v = +avg;
      const bg = v >= 4.5 ? 'C6F6D5' : v >= 3.5 ? 'BEE3F8' : v >= 2.5 ? 'FEFCBF' : 'FED7D7';
      colored.push({ r: i + 1, c: 5, bg, bold: true });
    }
  });

  downloadXLSX('Аналитика_учителя.xlsx', [{
    name: 'Учителя',
    rows,
    colWidths: [30, 12, 12, 12, 12, 14, 12, 12],
    coloredCells: colored,
  }]);
}

function exportStudentXLSX(id) {
  const s = DB.getStudent(id);
  const c = DB.getClasses().find(x => x.id === s.classId);
  const m = gradeMatrix(id);
  const subjects = DB.getSubjects();

  const rows = [['Предмет', 'Учитель', ...PERIODS]];
  subjects.forEach(sub => {
    const st = c ? DB.getSubjectTeacher(c.id, sub) : null;
    const row = [sub, st ? st.name : ''];
    PERIODS.forEach(p => {
      const cell = m[sub + '|' + p];
      if (!cell) { row.push(''); return; }
      const parts = [];
      ['текущая','промежуточная','итоговая'].forEach(ty => {
        if (cell[ty]) parts.push(cell[ty][cell[ty].length-1].value);
      });
      row.push(parts.join('/'));
    });
    rows.push(row);
  });

  downloadXLSX(`Ученик_${s.lastName}.xlsx`, [{
    name: 'Успеваемость',
    rows,
    colWidths: [24, 28, ...PERIODS.map(() => 14)],
  }]);
}

function saveAutoReports() {
  const email = document.getElementById('ar_email').value.trim();
  const schedule = document.getElementById('ar_schedule').value;
  const enabled = document.getElementById('ar_enabled').checked;
  DB.setAutoReports({ email, schedule, enabled });

function sendReportNow() {
  const cfg = DB.getAutoReports();
  const email = document.getElementById('ar_email')?.value.trim() || cfg.email;
  if (!email) { showToast('Укажите email', 'error'); return; }

  const classes = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();

  // Формируем текст письма
  let text = 'Аналитический отчёт по школе\n\n';
  text += `Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;

  classes.forEach(c => {
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0;
    sts.forEach(s => subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v)) { sum += +v; cnt++; }
    }));
    const avg = cnt ? (sum/cnt).toFixed(2) : '—';
    text += `Класс ${c.name}: ${sts.length} учеников, средний балл ${avg}\n`;
  });

  text += `\nВсего учеников: ${students.length}\nВсего классов: ${classes.length}\n`;

  const subject = encodeURIComponent('Аналитический отчёт — ' + new Date().toLocaleDateString('ru-RU'));
  const body = encodeURIComponent(text);
  window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
  DB.setAutoReports({ ...cfg, lastSent: new Date().toISOString() });
  showToast('Открыто письмо в почтовом клиенте', 'success');
  closeModal();
}

function downloadBackupJSON() {
  const json = DB.exportAll();
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

/* ---------- Модальное окно ---------- */
function showModal(content) {
  const existing = document.getElementById('modalOverlay');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.className = 'modal-overlay';
  div.id = 'modalOverlay';
  div.innerHTML = `<div class="modal">
      <button class="close-btn" onclick="closeModal()" title="Закрыть">×</button>
      ${content}
    </div>`;
  div.addEventListener('click', e => { if (e.target === div) closeModal(); });
  document.body.appendChild(div);
}
function closeModal() {
  const m = document.getElementById('modalOverlay');
  if (m) m.remove();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- CSV утилиты ---------- */
function csvEscape(v) {
  const s = String(v ?? '');
  if (s.includes(';') || s.includes('"') || s.includes('\n') || s.includes(',')) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function renderChartToImage(type, width, height, config) {
  const c = document.createElement('canvas');
  c.width = width; c.height = height;
  c.style.display = 'none';
  document.body.appendChild(c);
  const tmp = new Chart(c, { ...config, options: { ...config.options, responsive: false, animation: false } });
  const url = c.toDataURL('image/png', 1.0);
  tmp.destroy(); c.remove();
  return `<img src="${url}" class="chart-img" alt="График">`;
}

/* ---------- Экспорт ученика в PDF ---------- */
function exportStudent(id) {
  const s = DB.getStudent(id);
  if (!s) return;
  const c = DB.getClasses().find(x => x.id === s.classId);
  const b = c ? DB.getBuildings().find(x => x.id === c.buildingId) : null;
  const t = c ? DB.getTeachers().find(x => x.id === c.teacherId) : null;
  const m = gradeMatrix(id);
  const subjects = DB.getSubjects().filter(sub => PERIODS.some(p => m[sub + '|' + p]));
  const diags = DB.getDiagnostics().filter(d => d.studentId === id);

  let html = `<h1>Аналитическая справка по обучающемуся</h1>
    <h2>${esc(fullName(s))}</h2>
    <table class="info-table">
      <tr><td>Дата рождения:</td><td>${esc(fmtDate(s.birthDate))}</td></tr>
      <tr><td>Класс:</td><td>${esc(c ? c.name : '—')}</td></tr>
      <tr><td>Номер здания школы:</td><td>${esc(b ? b.name : '—')}</td></tr>
      <tr><td>Классный руководитель:</td><td>${esc(t ? t.name : '—')}</td></tr>
    </table>`;

  if (subjects.length) {
    html += `<h3>Успеваемость</h3><table>
      <thead><tr><th class="left">Предмет</th><th class="left">Учитель</th>
        ${PERIODS.map(p => `<th>${p}</th>`).join('')}</tr></thead><tbody>`;
    subjects.forEach(sub => {
      const st = c ? DB.getSubjectTeacher(c.id, sub) : null;
      html += `<tr><td class="left">${esc(sub)}</td><td class="left">${esc(st ? st.name : '—')}</td>`;
      PERIODS.forEach(p => {
        const cell = m[sub + '|' + p];
        if (!cell) { html += '<td>—</td>'; return; }
        const parts = [];
        ['текущая','промежуточная','итоговая'].forEach(ty => {
          if (cell[ty]) parts.push(`${cell[ty][cell[ty].length-1].value} <small>(${ty.slice(0,4)}.)</small>`);
        });
        html += `<td>${parts.join('<br>') || '—'}</td>`;
      });
      html += '</tr>';
    });
    html += `</tbody></table>`;
  }

  if (diags.length) {
    html += `<h3>Диагностики</h3><table>
      <thead><tr><th class="left">Название</th><th>Тип</th><th>Дата</th>
      <th>Результат</th><th>Уровень</th></tr></thead><tbody>`;
    diags.forEach(d => {
      html += `<tr><td class="left">${esc(d.title)}</td><td>${esc(d.type||'')}</td>
        <td>${esc(fmtDate(d.date))}</td><td>${esc(d.result||'')}</td>
        <td>${esc(d.level||'')}</td></tr>`;
    });
    html += `</tbody></table>`;
  }

  // Графики
  const chartGrades = DB.getGrades().filter(g => g.studentId === id && /^[2-5]$/.test(g.value));
  const values = PERIODS.map(p => {
    const gs = chartGrades.filter(g => g.period === p);
    return gs.length ? +(gs.reduce((a,b)=>a+ +b.value,0)/gs.length).toFixed(2) : null;
  });
  html += '<h3>Динамика по четвертям</h3>';
  html += renderChartToImage('line', 900, 400, {
    type: 'line',
    data: { labels: PERIODS, datasets: [{ label: 'Средний балл', data: values,
      borderColor: '#2c5282', backgroundColor: 'rgba(44,82,130,.12)',
      fill: true, tension: .3, pointRadius: 5, pointBackgroundColor: '#2c5282', spanGaps: true }] },
    options: { animation: false, responsive: false,
      plugins: { legend: { labels: { font: { size: 14 } } } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5 } } } }
  });

  const subjValues = subjects.map(sub => { const v = finalGrade(id, sub); return /^[2-5]$/.test(v) ? +v : null; });
  html += '<h3>Итоговые оценки</h3>';
  html += renderChartToImage('bar', 900, 400, {
    type: 'bar',
    data: { labels: subjects, datasets: [{ label: 'Итоговая', data: subjValues,
      backgroundColor: subjValues.map(v => v===5?'#38a169':v===4?'#3182ce':v===3?'#dd6b20':v===2?'#e53e3e':'#cbd5e0'),
      borderRadius: 6 }] },
    options: { animation: false, responsive: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: 1 } },
                x: { ticks: { maxRotation: 60, minRotation: 40, font: { size: 11 } } } } }
  });

  const counts = {'5':0,'4':0,'3':0,'2':0};
  chartGrades.forEach(g => counts[g.value]++);
  html += '<h3>Распределение оценок</h3>';
  html += renderChartToImage('doughnut', 600, 400, {
    type: 'doughnut',
    data: { labels: ['5','4','3','2'],
      datasets: [{ data: [counts['5'],counts['4'],counts['3'],counts['2']],
        backgroundColor: ['#38a169','#3182ce','#dd6b20','#e53e3e'], borderWidth: 2, borderColor: '#fff' }] },
    options: { animation: false, responsive: false, plugins: { legend: { position: 'bottom' } } }
  });

  html += `<div class="sig">
      <div>Классный руководитель: ___________________ / ${esc(t ? t.name : '____________')}</div>
      <div>Дата: «____» ____________ 20___ г.</div>
    </div>`;
  exportPDF(html, 'Справка — ' + fullName(s));
}

/* ---------- renderJournal (упрощённый, но рабочий) ---------- */
let journalState = {
  classId: '', period: 'I четверть',
  draft: {}, draftDiag: {},
  diagType: 'ВПР', diagSubject: '', diagDate: '', diagTitle: '',
};
const JOURNAL_DRAFT_KEY = 'sa_journal_draft_v5';

function loadDraft() {
  try {
    const raw = localStorage.getItem(JOURNAL_DRAFT_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      journalState.draft = d.draft || {};
      journalState.draftDiag = d.draftDiag || {};
    }
  } catch(e) { journalState.draft = {}; journalState.draftDiag = {}; }
}
function saveDraft() {
  localStorage.setItem(JOURNAL_DRAFT_KEY, JSON.stringify({
    draft: journalState.draft, draftDiag: journalState.draftDiag,
  }));
}
function clearDraft() {
  journalState.draft = {};
  journalState.draftDiag = {};
  localStorage.removeItem(JOURNAL_DRAFT_KEY);
}

function renderJournal() {
  const classes = DB.getClasses();
  const subjects = DB.getSubjects();
  if (!journalState.classId && classes.length) journalState.classId = String(classes[0].id);
  const students = DB.getStudents().filter(s => s.classId === +journalState.classId)
    .sort((a,b) => a.lastName.localeCompare(b.lastName, 'ru'));

  const existing = {};
  if (journalState.classId) {
    const sids = students.map(s => s.id);
    DB.getGrades().filter(g => g.period === journalState.period && sids.includes(g.studentId))
      .forEach(g => { existing[`${g.studentId}|${g.subject}|${g.type}`] = g.value; });
  }
  const getGrade = (sid, subject, type) => {
    const k = `${sid}|${subject}|${type}`;
    return journalState.draft[k] !== undefined ? journalState.draft[k] : (existing[k] || '');
  };

  let headerTop = '<th rowspan="2" class="name-col" style="text-align:left;min-width:150px;">ФИО</th>';
  let headerBottom = '';
  subjects.forEach(sub => {
    const teacher = DB.getSubjectTeacher(+journalState.classId, sub);
    headerTop += `<th colspan="3" class="subject-group" style="text-align:center;background:var(--bg-hover);color:var(--primary);">
      <span class="subject-name">${esc(sub)}</span>
      <span class="subject-teacher">${teacher ? esc(teacher.name) : '—'}</span>
    </th>`;
    headerBottom += `
      <th style="text-align:center;"><span class="type-lbl">тек</span></th>
      <th style="text-align:center;"><span class="type-lbl">пром</span></th>
      <th style="text-align:center;"><span class="type-lbl">итог</span></th>`;
  });

  const rows = students.map(s => {
    let row = `<td class="name-cell">${esc(fullName(s))}</td>`;
    subjects.forEach(sub => {
      GRADE_TYPES.forEach(type => {
        const k = `${s.id}|${sub}|${type}`;
        const v = getGrade(s.id, sub, type);
        const existed = existing[k];
        let cls = 'journal-input';
        if (existed && v !== existed) cls += ' changed';
        else if (v) cls += ' filled';
        row += `<td class="subject-group" style="padding:2px;">
          <input class="${cls}" data-sid="${s.id}" data-subject="${esc(sub)}" data-type="${type}"
                 value="${esc(v)}" maxlength="8"
                 oninput="onJournalInput(${s.id},'${esc(sub)}','${type}',this.value)"
                 onkeydown="journalKeyNav(event)">
        </td>`;
      });
    });
    return `<tr>${row}</tr>`;
  }).join('');

  page(`
    <h2 style="margin-bottom:16px;color:var(--primary);">${icon('edit', 20)} Журнал класса</h2>
    <div class="card">
      <div class="form-grid mb-16">
        <div class="form-group"><label>Класс</label>
          <select onchange="journalState.classId=this.value;renderJournal();">
            ${classes.map(c => `<option value="${c.id}" ${journalState.classId==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Период</label>
          <select onchange="journalState.period=this.value;renderJournal();">
            ${PERIODS.map(p => `<option ${journalState.period===p?'selected':''}>${esc(p)}</option>`).join('')}
          </select></div>
      </div>
      ${students.length ? `
        <div class="row-flex mb-16" style="gap:6px;flex-wrap:wrap;">
          ${['5','4','3','2'].map(v => `<button class="btn btn-outline btn-sm" onclick="fillAllTypes('${v}')">Все «${v}»</button>`).join('')}
          <button class="btn btn-outline btn-sm" onclick="clearAll()">Очистить</button>
        </div>
        <div class="table-wrap" style="max-height: 60vh; overflow: auto;">
          <table class="journal-table">
            <thead><tr>${headerTop}</tr><tr>${headerBottom}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="saveJournalGrades()">${icon('save', 14)} Сохранить</button>
          <button class="btn btn-outline" onclick="clearDraft();renderJournal();">Отменить</button>
        </div>
      ` : `<div class="empty"><div class="empty-icon">📝</div><div>Нет учеников</div></div>`}
    </div>
  `, 'journal');
}

function onJournalInput(sid, subject, type, value) {
  const v = value.trim();
  const k = `${sid}|${subject}|${type}`;
  if (v === '') delete journalState.draft[k];
  else journalState.draft[k] = v;
  saveDraft();
}
function journalKeyNav(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const inputs = Array.from(document.querySelectorAll('.journal-input'));
    const i = inputs.indexOf(e.target);
    if (i >= 0 && i < inputs.length - 1) inputs[i + 1].focus();
  }
}
function fillAllTypes(value) {
  const students = DB.getStudents().filter(s => s.classId === +journalState.classId);
  const subjects = DB.getSubjects();
  students.forEach(s => subjects.forEach(sub => GRADE_TYPES.forEach(ty => {
    journalState.draft[`${s.id}|${sub}|${ty}`] = value;
  })));
  saveDraft();
  renderJournal();
}
function clearAll() { journalState.draft = {}; saveDraft(); renderJournal(); }

function saveJournalGrades() {
  if (!journalState.classId) { showToast('Выберите класс', 'error'); return; }
  const students = DB.getStudents().filter(s => s.classId === +journalState.classId);
  const entries = Object.entries(journalState.draft);
  if (!entries.length) { showToast('Нет оценок', 'error'); return; }
  UndoStack.push(`Сохранение оценок (${entries.length})`);
  let added = 0, updated = 0;
  const d = DB.load();
  const subjects = DB.getSubjects();
  entries.forEach(([key, value]) => {
    const [sidStr, subject, type] = key.split('|');
    const sid = +sidStr;
    if (!students.some(s => s.id === sid)) return;
    if (!GRADE_TYPES.includes(type) || !subjects.includes(subject)) return;
    const idx = d.grades.findIndex(g => g.studentId === sid && g.subject === subject
      && g.period === journalState.period && g.type === type);
    if (idx >= 0) { d.grades[idx].value = value; updated++; }
    else {
      d.grades.push({ id: d.nextIds.grade++, studentId: sid, subject,
        period: journalState.period, type, value, year: '2024-2025' });
      added++;
    }
  });
  DB.save();
  clearDraft();
  showToast(`Добавлено: ${added}, обновлено: ${updated}`, 'success');
  renderJournal();
}

function downloadCSV(filename, content) {
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function parseStudentsText(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
  const result = [];
  lines.forEach((line, idx) => {
    const parts = line.split(/\t|;|,/).map(x => x.trim()).filter(Boolean);
    if (!parts.length) return;
    const isHeader = idx === 0 && parts.some(p => /фамил|имя|отчество|дата|фио/i.test(p));
    if (isHeader) return;
    let lastName = '', firstName = '', middleName = '', birthDate = '';
    if (parts.length === 1) {
      const fio = parts[0].split(/\s+/);
      lastName = fio[0] || ''; firstName = fio[1] || ''; middleName = fio[2] || '';
    } else {
      lastName = parts[0] || ''; firstName = parts[1] || ''; middleName = parts[2] || '';
      if (parts[3]) birthDate = normalizeDate(parts[3]);
    }
    if (!lastName) return;
    result.push({ lastName, firstName, middleName, birthDate });
  });
  return result;
}

function normalizeDate(s) {
  if (!s) return '';
  s = String(s).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}

function applyCsvStudents(text) {
  const classes = DB.getClasses();
  if (!classes.length) { showToast('Создайте класс', 'error'); return; }

function applyCsvGradesAll(text) {
  const students = DB.getStudents().filter(s => s.classId === +journalState.classId)
    .sort((a,b) => a.lastName.localeCompare(b.lastName, 'ru'));
  if (!students.length) { showToast('Нет учеников', 'error'); return; }
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
  if (lines.length < 2) { showToast('Файл пуст', 'error'); return; }
  const headerCols = lines[0].split(/[;\t,]/).map(x => x.trim());
  const subjectColumns = [];
  for (let i = 1; i < headerCols.length; i++) {
    const m = headerCols[i].match(/^(.+?)\s*\[(.+?)\]$/);
    if (m && GRADE_TYPES.includes(m[2].trim())) {
      subjectColumns.push({ subject: m[1].trim(), type: m[2].trim(), colIndex: i });
    }
  }
  if (!subjectColumns.length) { showToast('Не распознаны колонки', 'error'); return; }
  let applied = 0;
  for (let li = 1; li < lines.length; li++) {
    const cols = lines[li].split(/[;\t,]/).map(x => x.trim());
    if (!cols[0]) continue;
    const fioSearch = cols[0].toLowerCase();
    const student = students.find(s => {
      const f1 = `${s.lastName} ${s.firstName} ${s.middleName || ''}`.toLowerCase().trim();
      return f1 === fioSearch || f1.startsWith(fioSearch);
    });
    if (!student) continue;
    subjectColumns.forEach(sc => {
      const v = cols[sc.colIndex] || '';
      const k = `${student.id}|${sc.subject}|${sc.type}`;
      if (v === '') delete journalState.draft[k];
      else journalState.draft[k] = v;
    });
    applied++;
  }
  saveDraft();
  closeModal();
  renderJournal();
  showToast(`Применено: ${applied}`, 'success');
}

/* ---------- Карточка учителя (полная) ---------- */
function renderTeacherDetail(id) {
  if (SESSION.role !== 'admin' && SESSION.role !== 'director') { go('dashboard'); return; }
  const teacher = DB.getSubjectTeachersList().find(t => t.id === id);
  if (!teacher) {
    page('<div class="card"><div class="empty">Учитель не найден</div></div>', 'subject-teachers');
    return;
  }

  const classes = allowedClasses();
  const students = allowedStudents();
  const assignments = DB.getSubjectTeachers().filter(st => st.teacherId === id
    && classes.some(c => c.id === st.classId));

  let totalSum = 0, totalCnt = 0;
  const dist = {'5':0,'4':0,'3':0,'2':0};
  const perSubject = {};

  assignments.forEach(a => {
    if (!perSubject[a.subject]) perSubject[a.subject] = { sum: 0, cnt: 0, classes: [] };
    const classObj = DB.getClasses().find(c => c.id === a.classId);
    const sts = students.filter(s => s.classId === a.classId);
    let sum = 0, cnt = 0;
    sts.forEach(s => {
      DB.getGrades().filter(g => g.studentId === s.id && g.subject === a.subject && /^[2-5]$/.test(g.value))
        .forEach(g => { sum += +g.value; cnt++; totalSum += +g.value; totalCnt++; dist[g.value]++; });
    });
    perSubject[a.subject].sum += sum;
    perSubject[a.subject].cnt += cnt;
    if (classObj) perSubject[a.subject].classes.push(classObj.name);
  });

  const overallAvg = totalCnt ? (totalSum / totalCnt).toFixed(2) : '—';

  const notes = teacher.notes || [];
  const canEdit = SESSION.role === 'admin';

  page(`
    <div class="card">
      <div class="row-flex" style="justify-content:space-between;align-items:flex-start;gap:12px;">
        <div style="flex:1;min-width:0;">
          <h2 style="margin-bottom:8px;">${icon('user', 24)} ${esc(teacher.name)}</h2>
          <span class="badge ${MCKO_CLASS[teacher.mckoLevel || 'нет']}" style="font-size:14px;">
            МЦКО: ${esc(teacher.mckoLevel || 'нет')}
          </span>
          ${teacher.mckoDate ? `<span class="muted" style="margin-left:8px;">от ${esc(fmtDate(teacher.mckoDate))}</span>` : ''}
        </div>
        <div class="btn-group">
          <button class="btn btn-outline btn-sm" onclick="go('subject-teachers')">${icon('close', 14)} Назад</button>
          <button class="btn btn-success btn-sm" onclick="exportTeacherCard(${id})">${icon('file-pdf', 14)} PDF</button>
          <button class="btn btn-warn btn-sm" onclick="printTeacherCharacteristic(${id})">${icon('file-pdf', 14)} Характеристика</button>
        </div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="num">${assignments.length}</div><div class="lbl">Назначений</div></div>
      <div class="stat-card"><div class="num">${Object.keys(perSubject).length}</div><div class="lbl">Предметов</div></div>
      <div class="stat-card"><div class="num">${totalCnt}</div><div class="lbl">Оценок</div></div>
      <div class="stat-card"><div class="num">${overallAvg}</div><div class="lbl">Средний балл</div></div>
    </div>

    <div class="card">
      <h3>Назначения</h3>
      ${Object.keys(perSubject).length ? `<div class="table-wrap"><table>
        <thead><tr><th>Предмет</th><th>Классы</th><th class="text-right">Оценок</th><th class="text-right">Ср. балл</th></tr></thead>
        <tbody>${Object.entries(perSubject).map(([sub, d]) => {
          const avg = d.cnt ? (d.sum/d.cnt).toFixed(2) : '—';
          return `<tr><td><b>${esc(sub)}</b></td><td>${d.classes.map(c => `<span class="badge badge-blue">${esc(c)}</span>`).join(' ')}</td>
            <td class="text-right">${d.cnt}</td><td class="text-right">${avg}</td></tr>`;
        }).join('')}</tbody>
      </table></div>` : '<div class="empty">Нет назначений</div>'}
    </div>

    <div class="card">
      <div class="row-flex" style="justify-content:space-between;margin-bottom:14px;">
        <h3 style="margin:0;">${icon('edit', 18)} Замечания</h3>
        ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="openAddNoteModal(${id})">${icon('plus', 14)} Добавить</button>` : ''}
      </div>
      ${notes.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Дата</th><th>Автор</th><th>Замечание</th>${canEdit?'<th></th>':''}</tr></thead>
        <tbody>${notes.map(n => `<tr>
          <td class="nowrap">${esc(fmtDate(n.date))}</td>
          <td>${esc(n.author || '—')}</td>
          <td>${esc(n.text)}</td>
          ${canEdit ? `<td class="text-right"><button class="btn btn-danger btn-sm btn-icon" onclick="delTeacherNote(${id},${n.id})">${icon('trash', 12)}</button></td>` : ''}
        </tr>`).join('')}</tbody>
      </table></div>` : '<div class="empty">Замечаний нет</div>'}
    </div>
  `, 'subject-teachers');
}

function openAddNoteModal(teacherId) {
  showModal(`
    <h2>${icon('edit', 20)} Добавить замечание</h2>
    <div class="form-group mb-16">
      <label>Текст</label>
      <textarea id="note_text" rows="5" style="padding:10px;border:1px solid var(--border-strong);border-radius:8px;font-family:inherit;background:var(--bg-input);color:var(--text);resize:vertical;"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveNewNote(${teacherId})">${icon('save', 14)} Добавить</button>
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
    </div>
  `);
  setTimeout(() => document.getElementById('note_text')?.focus(), 100);
}

function saveNewNote(teacherId) {
  const text = document.getElementById('note_text').value.trim();
  if (!text) { showToast('Введите текст', 'error'); return; }
  UndoStack.push('Добавление замечания');
  DB.addNote(teacherId, text, SESSION.name);
  closeModal();
  showToast('Замечание добавлено', 'success');
  render();
}

function delTeacherNote(teacherId, noteId) {
  if (!confirm('Удалить замечание?')) return;
  UndoStack.push('Удаление замечания');
  DB.deleteNote(teacherId, noteId);
  render();
}
