<title>Школьная аналитика</title>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg-body:#f4f7fa;--bg-card:#fff;--bg-hover:#eef4f9;--bg-input:#f8fafc;--border:#d9e4ec;--border-strong:#b8cbd9;--text:#1a2b3c;--text-2:#33475b;--text-muted:#6a7f94;--text-disabled:#9aacbc;--primary:#04558a;--primary-dark:#033f66;--primary-light:#398ec6;--primary-soft:#e6f0f7;--accent:#1893d2;--accent-dark:#0f75a8;--success:#38a169;--success-dark:#276749;--warning:#dd6b20;--warning-dark:#c05621;--danger:#c53030;--danger-dark:#9b2c2c;--purple:#805ad5;--purple-dark:#6b46c1;--shadow:0 1px 6px rgba(4,85,138,.08);--shadow-md:0 4px 16px rgba(4,85,138,.12);--shadow-lg:0 20px 50px rgba(4,85,138,.25);--radius:10px;--radius-sm:6px;--radius-lg:14px}
html[data-theme="dark"]{--bg-body:#0d1822;--bg-card:#152535;--bg-hover:#1c2f42;--bg-input:#1c2f42;--border:#24384d;--border-strong:#3d5570;--text:#e2ecf4;--text-2:#c2d3e0;--text-muted:#8fa4b8;--text-disabled:#5f7488;--primary:#4da6d9;--primary-dark:#398ec6;--primary-light:#7bc4ec;--primary-soft:#1a3448;--accent:#4db8e8;--accent-dark:#1893d2;--success:#48bb78;--warning:#ed8936;--danger:#e53e3e;--purple:#9f7aea;--shadow:0 1px 6px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 20px 50px rgba(0,0,0,.7)}
body{font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-body);color:var(--text);font-weight:400;transition:background .25s ease,color .25s ease}
h1{font-size:28px;font-weight:700;letter-spacing:-.4px}h2{font-size:22px;font-weight:700;letter-spacing:-.3px}h3{font-size:17px;font-weight:600}h4{font-size:14px;font-weight:600}
button,input,select,textarea,.btn{font-family:'Roboto',-apple-system,sans-serif}
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
*::-webkit-scrollbar{width:8px;height:8px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}*::-webkit-scrollbar-thumb:hover{background:var(--primary-light)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes skeleton{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
header{background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 60%,var(--accent) 100%);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 2px 14px rgba(4,85,138,.28);position:sticky;top:0;z-index:100}
header .brand{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
header .brand img{height:34px;width:auto;background:#fff;border-radius:6px;padding:2px 6px;transition:transform .2s}
header .brand img:hover{transform:scale(1.05)}
header .user-info{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
header .user-info .role-badge{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
header button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;transition:all .15s;font-family:inherit;min-height:38px;display:inline-flex;align-items:center;gap:6px}
header button:hover{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.55);transform:translateY(-1px)}
header button:active{transform:translateY(1px)}
header .undo-btn{background:#dd6b20;border-color:#dd6b20;font-weight:600}
header .archive-btn{background:#805ad5;border-color:#805ad5;font-weight:600}
header .mobile-toggle-btn{background:#38a169;border-color:#38a169;font-weight:600}
header .mobile-toggle-btn.active{background:#c53030;border-color:#c53030}
.mobile-demo-banner{display:none;background:var(--accent);color:#fff;text-align:center;font-size:13px;padding:6px 12px;font-weight:500}
html.mobile-mode .mobile-demo-banner{display:block}
.offline-indicator{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--warning);color:#fff;padding:10px 20px;border-radius:30px;font-size:14px;font-weight:600;z-index:9999;box-shadow:var(--shadow-lg);display:none;align-items:center;gap:8px}
.offline-indicator.visible{display:flex;animation:fadeInUp .3s ease}
nav.tabs{display:flex;background:var(--bg-card);border-bottom:2px solid var(--border);padding:0 24px;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;position:sticky;top:66px;z-index:99;transition:background .25s ease}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:none;padding:14px 20px;font-size:14px;cursor:pointer;color:var(--text-muted);border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;font-family:inherit;font-weight:500;min-height:48px;display:inline-flex;align-items:center;gap:6px}
nav.tabs button:hover{color:var(--primary);background:var(--bg-hover)}
nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.sa-nav-group{position:relative;display:inline-flex;align-items:center}
.sa-nav-btn{background:none;border:none;padding:14px 20px;font-size:14px;cursor:pointer;color:var(--text-muted);border-bottom:3px solid transparent;transition:color .15s,background .15s;white-space:nowrap;font-family:inherit;font-weight:500;min-height:48px;display:inline-flex;align-items:center;gap:6px}
.sa-nav-btn:hover{color:var(--primary);background:var(--bg-hover)}
.sa-nav-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.sa-nav-btn.active-open{color:var(--primary);background:var(--bg-hover)}
.sa-nav-single{background:none;border:none;padding:14px 20px;font-size:14px;cursor:pointer;color:var(--text-muted);border-bottom:3px solid transparent;transition:color .15s,background .15s;white-space:nowrap;font-family:inherit;font-weight:500;min-height:48px;display:inline-flex;align-items:center;gap:6px}
.sa-nav-single:hover{color:var(--primary);background:var(--bg-hover)}
.sa-nav-single.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.sa-nav-dropdown-portal{position:fixed;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(4,85,138,.18);padding:6px;min-width:230px;z-index:9999;animation:fadeIn .12s ease;display:none}
.sa-nav-dropdown-portal.open{display:block}
.sa-nav-dropdown-portal button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:transparent;border:none;text-align:left;cursor:pointer;border-radius:6px;font-size:13px;font-family:'Roboto',sans-serif;color:var(--text-2);min-height:40px;transition:background .12s,color .12s}
.sa-nav-dropdown-portal button:hover{background:var(--bg-hover);color:var(--primary)}
.sa-nav-dropdown-portal button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
main{flex:1;padding:24px;max-width:1600px;width:100%;margin:0 auto}
.card{background:var(--bg-card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:20px;border:1px solid var(--border);animation:fadeInUp .35s ease}
.card h2{color:var(--primary);margin-bottom:16px}
.card h3{color:var(--text-2);margin:12px 0 8px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--bg-card);border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow);border-left:4px solid var(--primary);transition:all .2s ease;animation:fadeInUp .35s ease backwards}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat-card .num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .lbl{font-size:12px;color:var(--text-muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px;color:var(--text-2)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--primary-soft);color:var(--primary);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
tr:hover td{background:var(--bg-hover)}
.table-wrap{overflow-x:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:500;transition:all .12s;text-decoration:none;font-family:inherit;min-height:40px}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px) scale(.98)}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark);box-shadow:0 4px 12px rgba(4,85,138,.3)}
.btn-success{background:var(--success-dark);color:#fff}.btn-success:hover{background:var(--success)}
.btn-warn{background:var(--warning-dark);color:#fff}.btn-warn:hover{background:var(--warning)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:var(--danger-dark)}
.btn-outline{background:transparent;border:1px solid var(--border-strong);color:var(--text-2)}
.btn-outline:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 10px;font-size:12px;min-height:34px}
.btn-icon{padding:8px;min-width:36px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:13px;font-weight:600;color:var(--text-2)}
.form-group input,.form-group select,.form-group textarea{padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--bg-input);color:var(--text);min-height:42px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(4,85,138,.15);background:var(--bg-card)}
.form-actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.modal-overlay{position:fixed;inset:0;background:rgba(4,35,60,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fadeIn .2s;backdrop-filter:blur(3px)}
.modal{background:var(--bg-card);border-radius:var(--radius-lg);padding:28px;width:100%;max-width:900px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:fadeInUp .25s;color:var(--text)}
.modal h2{margin-bottom:20px;color:var(--primary)}
.modal .close-btn{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-disabled);line-height:1;min-width:40px;min-height:40px}
.modal .close-btn:hover{color:var(--danger)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-blue{background:var(--primary-soft);color:var(--primary)}
.badge-green{background:#e6f9ee;color:var(--success-dark)}
.badge-orange{background:#fdf3e8;color:var(--warning-dark)}
.badge-red{background:#fdeaea;color:var(--danger-dark)}
.badge-gray{background:#eef1f4;color:var(--text-muted)}
.badge-purple{background:#f3ecfb;color:var(--purple-dark)}
html[data-theme="dark"] .badge-blue{background:rgba(77,166,217,.18);color:var(--primary-light)}
html[data-theme="dark"] .badge-green{background:rgba(72,187,120,.18);color:var(--success)}
html[data-theme="dark"] .badge-orange{background:rgba(237,137,54,.18);color:var(--warning)}
html[data-theme="dark"] .badge-red{background:rgba(229,62,62,.18);color:var(--danger)}
html[data-theme="dark"] .badge-gray{background:rgba(160,174,192,.15);color:var(--text-muted)}
html[data-theme="dark"] .badge-purple{background:rgba(159,122,234,.18);color:var(--purple)}
.grade-chip{display:inline-block;min-width:26px;padding:2px 7px;border-radius:5px;font-size:12px;font-weight:600;text-align:center;margin:1px}
.grade-5{background:#c6f6d5;color:#22543d}.grade-4{background:#bee3f8;color:#1a4f7a}.grade-3{background:#fefcbf;color:#744210}.grade-2{background:#fed7d7;color:#742a2a}.grade-na{background:var(--border);color:var(--text-2)}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input,.search-bar select{padding:10px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;min-height:42px;background:var(--bg-input);color:var(--text)}
.search-bar input{flex:1;min-width:200px}
.alert{padding:12px 18px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:14px}
.alert-info{background:#ebf8ff;color:#2c5282;border-left:4px solid var(--primary-light)}
.alert-warn{background:#fffaf0;color:#975a16;border-left:4px solid var(--warning)}
.alert-error{background:#fff5f5;color:#9b2c2c;border-left:4px solid var(--danger)}
.alert-success{background:#f0fff4;color:#276749;border-left:4px solid var(--success)}
html[data-theme="dark"] .alert-info{background:rgba(49,130,206,.1);color:#90cdf4}
html[data-theme="dark"] .alert-warn{background:rgba(221,107,32,.1);color:#fbd38d}
html[data-theme="dark"] .alert-error{background:rgba(197,48,48,.1);color:#fc8181}
html[data-theme="dark"] .alert-success{background:rgba(56,161,105,.1);color:#9ae6b4}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-icon{font-size:48px;opacity:.3;margin-bottom:8px}
.muted{color:var(--text-muted);font-size:12px}
.row-flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mt-16{margin-top:16px}.mb-16{margin-bottom:16px}.nowrap{white-space:nowrap}.text-right{text-align:right}
.chart-box{position:relative;height:320px}
.chart-box-sm{position:relative;height:280px}
.chart-box-lg{position:relative;height:380px}
.journal-table{font-size:14px}
.journal-table th{padding:8px 6px;font-size:11px;text-align:center}
.journal-table th .subject-name{display:block;font-size:13px;font-weight:700;color:var(--primary);margin-bottom:4px;text-transform:none}
.journal-table th .subject-teacher{display:block;font-size:11px;font-weight:500;color:var(--purple);margin-bottom:4px;text-transform:none;font-style:italic}
.journal-table td{padding:4px}
.journal-table td.name-cell{padding:8px 12px;white-space:nowrap;font-weight:600;font-size:13px;position:sticky;left:0;background:var(--bg-card);z-index:2;border-right:2px solid var(--border);min-width:180px}
.journal-table input.journal-input{width:100%;min-width:40px;max-width:60px;padding:4px;text-align:center;font-size:13px;font-weight:600;border:1px solid var(--border-strong);border-radius:4px;font-family:inherit;background:var(--bg-input);color:var(--text)}
.journal-table input.journal-input.filled{background:#e6fffa;border-color:#38b2ac}
.journal-table input.journal-input.changed{background:#fff9e6;border-color:#dd6b20}
.diag-input{width:100%;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg-input);color:var(--text)}
.paste-area{width:100%;min-height:140px;font-family:Consolas,monospace;font-size:13px;padding:10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);resize:vertical;background:var(--bg-input);color:var(--text)}
.radio-group{display:flex;gap:14px;flex-wrap:wrap;padding:8px 0}
.radio-group label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;padding:8px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg-card);transition:all .15s;min-height:42px}
.radio-group label:hover{border-color:var(--primary);background:var(--bg-hover)}
.radio-group input[type="radio"],.radio-group input[type="checkbox"]{margin:0;cursor:pointer;width:18px;height:18px}
.subtabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:4px}
.subtabs button{background:none;border:none;padding:10px 16px;font-size:14px;cursor:pointer;color:var(--text-muted);border-radius:var(--radius-sm);font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.subtabs button:hover{background:var(--bg-hover);color:var(--primary)}
.subtabs button.active{background:var(--primary);color:#fff;font-weight:600}
.heatmap-table td{text-align:center;font-weight:600;padding:8px 6px;border:1px solid var(--border);transition:all .15s;font-size:13px}
.heatmap-table td.class-col{text-align:left;background:var(--bg-hover);font-weight:700;color:var(--primary);position:sticky;left:0;z-index:2;min-width:120px}
.heatmap-table td:hover{transform:scale(1.05);box-shadow:var(--shadow);z-index:3;position:relative}
.heat-1{background:#fdeaea;color:#742a2a}.heat-2{background:#fdf3e8;color:#744210}.heat-3{background:#e3f4fb;color:#1a4f7a}.heat-4{background:#e6f9ee;color:#22543d}
html[data-theme="dark"] .heat-1{background:rgba(229,62,62,.2);color:#fc8181}
html[data-theme="dark"] .heat-2{background:rgba(221,107,32,.2);color:#fbd38d}
html[data-theme="dark"] .heat-3{background:rgba(24,147,210,.2);color:#90cdf4}
html[data-theme="dark"] .heat-4{background:rgba(72,187,120,.2);color:#9ae6b4}
.widget-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.widget{background:var(--bg-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:move;transition:all .2s;animation:fadeInUp .35s ease}
.widget.dragging{opacity:.5;transform:scale(.98)}
.widget.drag-over{border-color:var(--primary);border-style:dashed}
.widget-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.widget-title{font-size:14px;font-weight:700;color:var(--primary)}
html.mobile-mode #app{max-width:420px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.2);background:var(--bg-body);min-height:100vh}
html.mobile-mode header{padding:10px 14px}
html.mobile-mode header .brand{font-size:14px}
html.mobile-mode header button{padding:6px 8px;font-size:11px;min-height:34px}
html.mobile-mode header .user-info .role-badge,html.mobile-mode header .user-info .user-name-text{display:none}
html.mobile-mode nav.tabs{padding:0 12px;top:56px}
html.mobile-mode main{padding:14px}
html.mobile-mode .card{padding:16px;margin-bottom:14px}
html.mobile-mode .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
html.mobile-mode .stat-card{padding:14px}
html.mobile-mode .stat-card .num{font-size:22px}
html.mobile-mode .form-grid{grid-template-columns:1fr;gap:12px}
html.mobile-mode table{font-size:13px}
html.mobile-mode .chart-box{height:220px}
html.mobile-mode .hide-mobile{display:none}
@media (max-width:900px){main{padding:16px}.card{padding:18px}.chart-box{height:260px}.chart-box-lg{height:300px}}

    'save':'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
    'database':'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
    'mail':'<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
    'trending-up':'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',

    'award':'<circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>',
    'search':'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    'logout':'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
    'info':'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',

  return `<svg class="icon ${cls}" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

function showToast(msg, type = 'info', duration = 3000) {
  const c = document.getElementById('toastContainer');
  if (!c) return;
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `${icon(type === 'success' ? 'check' : type === 'error' ? 'alert' : 'info')} ${esc(msg)}`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, duration);
}

/* ============================================================
   ТЕМА
   ============================================================ */
const THEME_KEY = 'sa_theme';
function applyTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'auto';
  let theme = saved;
  if (saved === 'auto') {
    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
  return saved;
}
function setTheme(t) { localStorage.setItem(THEME_KEY, t); applyTheme(); render(); }
function cycleTheme() {
  const cur = localStorage.getItem(THEME_KEY) || 'auto';
  const order = ['light', 'dark', 'auto'];
  setTheme(order[(order.indexOf(cur) + 1) % order.length]);
}
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if ((localStorage.getItem(THEME_KEY) || 'auto') === 'auto') applyTheme();
});

/* ============================================================
   PWA / OFFLINE
   ============================================================ */
let deferredPrompt = null;
let isOnline = navigator.onLine;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => console.log('[PWA] SW зарегистрирован:', reg.scope))
      .catch(err => console.warn('[PWA] Ошибка SW:', err));
  });
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  if (localStorage.getItem('sa_pwa_hidden') !== '1') {
    setTimeout(() => document.getElementById('pwaBanner')?.classList.add('visible'), 3000);
  }
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('pwaBanner')?.classList.remove('visible');
});
function installPwa() {
  if (!deferredPrompt) { showToast('Установка недоступна', 'info', 5000); return; }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    document.getElementById('pwaBanner')?.classList.remove('visible');
    deferredPrompt = null;
  });
}
function hidePwaBanner() {
  document.getElementById('pwaBanner')?.classList.remove('visible');
  localStorage.setItem('sa_pwa_hidden', '1');
}
function updateOnlineStatus() {
  isOnline = navigator.onLine;
  document.getElementById('offlineIndicator')?.classList.toggle('visible', !isOnline);
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

/* ============================================================
   FIREBASE — облачное хранилище
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDskguNmb_FNqVw2m7S6ayRxoflvGS4X3o",
  authDomain: "school1512-analytics.firebaseapp.com",
  projectId: "school1512-analytics",
  storageBucket: "school1512-analytics.appspot.com",
  messagingSenderId: "652044886084",
  appId: "1:652044886084:web:168fae3bbe8e51dac6dc11"
};

let firebaseApp = null;
let firestore = null;
let firebaseReady = false;
let firebaseAuthReady = false;

try {
  firebaseApp = firebase.initializeApp(firebaseConfig);
  firestore = firebase.firestore();

  firestore.enablePersistence({ synchronizeTabs: true })
    .then(() => console.log('[Firebase] Офлайн-кеш включён'))
    .catch(err => console.warn('[Firebase] Офлайн-кеш недоступен:', err.code));

  firebaseReady = true;
  console.log('[Firebase] Инициализирован');

  // Анонимный вход
  firebase.auth().signInAnonymously()
    .then(() => {
      firebaseAuthReady = true;
      console.log('[Firebase] Анонимный вход выполнен');
      // Как только авторизация готова — сразу синхронизируем
      setTimeout(() => DB.syncFromCloud(), 300);
    })
    .catch(err => console.warn('[Firebase] Ошибка анонимного входа:', err));
} catch (err) {
  console.warn('[Firebase] Не удалось инициализировать:', err);
  firebaseReady = false;
}
/* ============================================================
   БАЗА ДАННЫХ
   ============================================================ */
const DB = {
  _key: 'school_analytics_db_v5',
  _data: null,
  _lastCloudSync: 0,

  load() {
    if (this._data) return this._data;
    const raw = localStorage.getItem(this._key);
    if (raw) { this._data = JSON.parse(raw); this._migrate(); this.save(); }
    else { this._data = this.seed(); this.save(); }
    return this._data;
  },

  // Отдельный метод: загрузка данных из облака
  async syncFromCloud() {
    if (!firebaseReady || !firestore || !firebaseAuthReady) {
      console.log('[Firebase] syncFromCloud отложен: Firebase не готов');
      return;
    }
    try {
      const doc = await firestore.collection('schools').doc('default').get({ source: 'server' });
      if (!doc.exists) {
        console.log('[Firebase] В облаке нет данных — первая синхронизация');
        return;
      }
      const cloudData = doc.data().data;
      if (!cloudData) {
        console.log('[Firebase] В облаке пустое поле data');
        return;
      }
      const cloudTime = doc.data().updatedAt ? doc.data().updatedAt.toMillis() : 0;
      const localTime = this._lastCloudSync || 0;

      console.log('[Firebase] Облако:', new Date(cloudTime).toLocaleString('ru-RU'));
      console.log('[Firebase] Локально синхронизировано в:', localTime ? new Date(localTime).toLocaleString('ru-RU') : 'никогда');

      // Если в облаке новее или локально ещё не синхронизировались
      if (cloudTime > localTime || localTime === 0) {
        this._data = cloudData;
        this._migrate();
        localStorage.setItem(this._key, JSON.stringify(this._data));
        this._lastCloudSync = cloudTime;
        console.log('[Firebase] ✅ Данные загружены из облака');
        if (typeof render === 'function' && typeof SESSION !== 'undefined' && SESSION) {
          render();
          showToast('Данные обновлены из облака', 'success', 2000);
        }
      } else {
        console.log('[Firebase] Локальные данные новее или равны — оставляем');
      }
    } catch (err) {
      console.warn('[Firebase] Ошибка syncFromCloud:', err.code || err.message);
    }
  },

  _migrate() {
    this._data.diagnostics = (this._data.diagnostics || []).map(d => ({
      type: 'предметная', subject: '', score: null, maxScore: null, level: '', ...d
    }));
    this._data.subjectTeachers = this._data.subjectTeachers || [];
    this._data.subjectTeachersList = this._data.subjectTeachersList || [];
    this._data.subjectTeachersList = this._data.subjectTeachersList.map(t => ({
      mckoLevel: 'нет', mckoDate: '', notes: [], ...t
    }));
    if (!this._data.nextIds.subjectTeacher) this._data.nextIds.subjectTeacher = 1;
    if (!this._data.nextIds.subjectTeacherList) this._data.nextIds.subjectTeacherList = 1;
    if (!this._data.nextIds.noteId) this._data.nextIds.noteId = 1;

  addNote(teacherId, text, author) {

  deleteNote(teacherId, noteId) {
    const d=this.load(); const t=d.subjectTeachersList.find(x=>x.id===teacherId);

  getClassYearComparison(classId) {
    const students = this.getStudents().filter(s => s.classId === classId);
    if (!students.length) return null;
    const sids = students.map(s => s.id);
    const allGrades = this.getGrades().filter(g => sids.includes(g.studentId) && /^[2-5]$/.test(g.value));
    const years = [...new Set(allGrades.map(g => g.year || '2024-2025'))].sort();
    if (years.length < 2) return { years, perYear: {}, perStudent: [], hasData: false };
    const perYear = {};
    years.forEach(y => {
      const gs = allGrades.filter(g => (g.year || '2024-2025') === y);
      const sum = gs.reduce((a, g) => a + +g.value, 0);
      const cnt = gs.length;
      let quality = 0, success = 0;
      gs.forEach(g => { if (+g.value >= 4) quality++; if (+g.value >= 3) success++; });
      perYear[y] = { avg: cnt ? +(sum / cnt).toFixed(2) : 0, count: cnt, quality: cnt ? Math.round(quality / cnt * 100) : 0, success: cnt ? Math.round(success / cnt * 100) : 0 };
    });
    const perStudent = students.map(s => {
      const byYear = {};
      years.forEach(y => {
        const gs = allGrades.filter(g => g.studentId === s.id && (g.year || '2024-2025') === y);
        byYear[y] = gs.length ? +(gs.reduce((a,g) => a + +g.value, 0) / gs.length).toFixed(2) : null;
      });
      const vals = years.map(y => byYear[y]).filter(v => v !== null);
      const diff = vals.length >= 2 ? +(vals[vals.length - 1] - vals[0]).toFixed(2) : null;
      return { student: s, byYear, diff };
    }).filter(x => Object.values(x.byYear).some(v => v !== null));
    return { years, perYear, perStudent, hasData: true };
  },
  getClassPortrait(classId) {
    const students = this.getStudents().filter(s => s.classId === classId);
    const subjects = this.getSubjects();
    const classObj = this.getClasses().find(c => c.id === classId);
    if (!classObj) return null;
    let totalSum = 0, totalCnt = 0;
    const categories = { excellent: [], good: [], satisfactory: [], poor: [] };
    const perSubject = {};
    subjects.forEach(sub => { perSubject[sub] = { sum: 0, cnt: 0, quality: 0, twos: 0 }; });
    students.forEach(s => {
      let sSum = 0, sCnt = 0;
      subjects.forEach(sub => {
        const gs = this.getGrades().filter(g => g.studentId === s.id && g.subject === sub && /^[2-5]$/.test(g.value));
        gs.forEach(g => {
          sSum += +g.value; sCnt++; totalSum += +g.value; totalCnt++;
          perSubject[sub].sum += +g.value;
          perSubject[sub].cnt++;
          if (+g.value >= 4) perSubject[sub].quality++;
          if (+g.value === 2) perSubject[sub].twos++;
        });
      });
      const sAvg = sCnt ? sSum / sCnt : 0;
      const cat = sAvg >= 4.5 ? 'excellent' : sAvg >= 3.5 ? 'good' : sAvg >= 2.5 ? 'satisfactory' : (sCnt ? 'poor' : 'satisfactory');
      categories[cat].push({ student: s, avg: +sAvg.toFixed(2), count: sCnt });
    });
    const overallAvg = totalCnt ? +(totalSum / totalCnt).toFixed(2) : 0;
    const problemSubjects = Object.entries(perSubject).filter(([sub, d]) => d.cnt > 0).map(([sub, d]) => ({
      subject: sub, avg: d.cnt ? +(d.sum / d.cnt).toFixed(2) : 0, quality: d.cnt ? Math.round(d.quality / d.cnt * 100) : 0, twos: d.twos,
    })).sort((a, b) => a.avg - b.avg).slice(0, 3);
    const needsAttention = students.map(s => {
      const r = studentRisk(s.id);
      return { student: s, risk: r };
    }).filter(x => x.risk.level === 'high' || x.risk.level === 'medium').sort((a, b) => b.risk.score - a.risk.score);
    return { classObj, studentsCount: students.length, overallAvg, categories, problemSubjects, needsAttention, totalGrades: totalCnt };
  },
  getSchoolMap() {
    const buildings = this.getBuildings();
    const classes = this.getClasses();
    const students = this.getStudents();
    return buildings.map(b => {
      const bClasses = classes.filter(c => c.buildingId === b.id);
      const bStudents = students.filter(s => bClasses.some(c => c.id === s.classId));
      let sum = 0, cnt = 0, quality = 0;
      bStudents.forEach(s => {
        this.getGrades().filter(g => g.studentId === s.id && /^[2-5]$/.test(g.value)).forEach(g => { sum += +g.value; cnt++; if (+g.value >= 4) quality++; });
      });
      const teacher = this.getTeachers();
      return {
        building: b,
        classes: bClasses.map(c => {
          const cStudents = students.filter(s => s.classId === c.id);
          let cs = 0, cc = 0, cq = 0;
          cStudents.forEach(s => {
            this.getGrades().filter(g => g.studentId === s.id && /^[2-5]$/.test(g.value)).forEach(g => { cs += +g.value; cc++; if (+g.value >= 4) cq++; });
          });
          return { classObj: c, students: cStudents.length, avg: cc ? +(cs / cc).toFixed(2) : null, quality: cc ? Math.round(cq / cc * 100) : null, teacherName: teacher.find(t => t.id === c.teacherId)?.name || '—' };
        }),
        students: bStudents.length,
        avg: cnt ? +(sum / cnt).toFixed(2) : null,
        quality: cnt ? Math.round(quality / cnt * 100) : null,
      };
    });
  },
  getHealth() {
    const d = this.load();
    const json = JSON.stringify(d);
    const sizeBytes = new Blob([json]).size;
    const sizeKB = +(sizeBytes / 1024).toFixed(1);
    const sizeMB = +(sizeBytes / 1024 / 1024).toFixed(2);
    const LS_LIMIT = 5 * 1024 * 1024; // 5 МБ
    const FS_LIMIT = 1 * 1024 * 1024; // 1 МБ на документ Firestore
    const lsPercent = Math.min(100, Math.round(sizeBytes / LS_LIMIT * 100));
    const fsPercent = Math.min(100, Math.round(sizeBytes / FS_LIMIT * 100));

    // Разбивка по сущностям
    const breakdown = {
      students: (d.students || []).length,
      grades: (d.grades || []).length,
      diagnostics: (d.diagnostics || []).length,
      classes: (d.classes || []).length,
      teachers: (d.teachers || []).length,
      subjectTeachersList: (d.subjectTeachersList || []).length,
      templates: (d.diagnosticTemplates || []).length,
      taskResults: (d.taskResults || []).length,
      plannedDiagnostics: (d.plannedDiagnostics || []).length,
      users: (d.users || []).length,
      subjects: (d.subjects || []).length,
      snapshots: (d.snapshots || []).length,
    };

    // Прогноз: сколько ещё влезет (по самому узкому месту — Firestore)
    const freeBytes = Math.max(0, FS_LIMIT - sizeBytes);
    const avgGradeBytes = breakdown.grades > 0 ? sizeBytes / breakdown.grades : 100;
    const additionalGrades = Math.floor(freeBytes / avgGradeBytes);

    // Статус
    let level = 'ok';
    if (fsPercent >= 80 || lsPercent >= 80) level = 'warn';
    if (fsPercent >= 95 || lsPercent >= 95) level = 'danger';

    return {
      sizeBytes, sizeKB, sizeMB,
      lsLimit: LS_LIMIT, fsLimit: FS_LIMIT,
      lsPercent, fsPercent,
      breakdown, additionalGrades,
      level,
      firebaseReady, firebaseAuthReady,
    };
  } 
};

   UNDO
   ============================================================ */
const UndoStack = {
  _key: 'sa_undo_stack', _items: [],
  load() { try { const raw = sessionStorage.getItem(this._key); this._items = raw ? JSON.parse(raw) : []; } catch(e) { this._items = []; } return this._items; },
  save() { sessionStorage.setItem(this._key, JSON.stringify(this._items.slice(-10))); },
  push(label) {
    const snapshot = JSON.parse(JSON.stringify(DB.load()));
    this._items.push({ label, snapshot, ts: Date.now() });
    if (this._items.length > 10) this._items.shift();
    this.save();
  },
  pop() { const item = this._items.pop(); this.save(); return item; },
  peek() { return this._items.length ? this._items[this._items.length - 1] : null; },
  count() { return this._items.length; },
  clear() { this._items = []; this.save(); }
};
function undoLastAction() {
  const item = UndoStack.peek();
  if (!item) { showToast('Нет действий для отмены', 'info'); return; }
  if (!confirm(`Отменить последнее действие?\n\n«${item.label}»`)) return;
  const popped = UndoStack.pop();
  DB._data = popped.snapshot;
  DB.save();
  showToast('Отменено: ' + popped.label, 'success');
  render();
}

/* ============================================================
   СВАЙПЫ
   ============================================================ */
let swipeStartX = 0, swipeStartY = 0, swipeActive = false;
function getAvailableTabs() {
  const tabs = ['dashboard','students','classes','analytics'];
  if (SESSION && SESSION.role === 'admin') tabs.push('journal','subject-teachers','directories','users','backup','diagnostics','reports');
  return tabs;
}
function initSwipe() {
  const app = document.getElementById('app');
  if (!app) return;
  app.removeEventListener('touchstart', onTouchStart);
  app.removeEventListener('touchmove', onTouchMove);
  app.removeEventListener('touchend', onTouchEnd);
  app.addEventListener('touchstart', onTouchStart, { passive: true });
  app.addEventListener('touchmove', onTouchMove, { passive: false });
  app.addEventListener('touchend', onTouchEnd, { passive: true });
}
function onTouchStart(e) {
  const t = e.target;
  if (['INPUT','TEXTAREA','SELECT'].includes(t.tagName)) return;
  if (t.closest('.table-wrap') || t.closest('.journal-table') || t.closest('.modal') || t.closest('.widget')) return;
  swipeStartX = e.touches[0].clientX; swipeStartY = e.touches[0].clientY; swipeActive = true;
}
function onTouchMove(e) {
  if (!swipeActive) return;
  const dx = e.touches[0].clientX - swipeStartX;
  const dy = e.touches[0].clientY - swipeStartY;
  if (Math.abs(dy) > Math.abs(dx)) return;
  const hl = document.getElementById('swipeHintLeft'); const hr = document.getElementById('swipeHintRight');
  if (hl && dx > 30) { hl.classList.add('visible'); hr?.classList.remove('visible'); }
  else if (hr && dx < -30) { hr.classList.add('visible'); hl?.classList.remove('visible'); }
}
function onTouchEnd(e) {
  if (!swipeActive) return;
  swipeActive = false;
  document.getElementById('swipeHintLeft')?.classList.remove('visible');
  document.getElementById('swipeHintRight')?.classList.remove('visible');
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if (Math.abs(dx) < 80) return;
  if (Math.abs(dy) > Math.abs(dx)) return;
  const tabs = getAvailableTabs();
  const hash = location.hash.replace('#', '') || 'dashboard';
  const current = hash.split('/')[0];
  let idx = tabs.indexOf(current);
  if (idx < 0) idx = 0;
  if (dx > 0 && idx > 0) go(tabs[idx - 1]);
  else if (dx < 0 && idx < tabs.length - 1) go(tabs[idx + 1]);
}

function gradeMatrix(studentId) {
  const m = {};
  DB.getGrades().filter(g => g.studentId === studentId).forEach(g => {
    const k = g.subject + '|' + g.period;
    if (!m[k]) m[k] = {};
    if (!m[k][g.type]) m[k][g.type] = [];
    m[k][g.type].push(g);
  });
  return m;
}
function finalGrade(studentId, subject, year) {
  const gs = DB.getGrades().filter(g => g.studentId === studentId && g.subject === subject && (!year || g.year === year));
  if (!gs.length) return '';
  let x = gs.find(g => g.period === 'Год' && g.type === 'итоговая'); if (x) return x.value;
  x = gs.find(g => g.period === 'Год'); if (x) return x.value;
  x = gs.find(g => g.type === 'итоговая'); if (x) return x.value;
  return gs[gs.length - 1].value;
}
function usedSubjects() {
  const set = new Set(DB.getGrades().map(g => g.subject));
  return DB.getSubjects().filter(s => set.has(s));
}
function studentAvg(studentId) {
  const grades = DB.getGrades().filter(g => g.studentId === studentId && /^[2-5]$/.test(g.value));
  if (!grades.length) return 0;
  return grades.reduce((a,g) => a + +g.value, 0) / grades.length;
}
function studentCategory(studentId) {
  const avg = studentAvg(studentId);
  if (!avg) return 'none';
  if (avg >= 4.5) return 'excellent';
  if (avg >= 3.5) return 'good';
  if (avg >= 2.5) return 'satisfactory';
  return 'poor';
}
function studentRisk(studentId) {
  const student = DB.getStudent(studentId);
  if (!student) return { level: 'none', score: 0, reasons: [] };
  const grades = DB.getGrades().filter(g => g.studentId === studentId && /^[2-5]$/.test(g.value));
  const avg = grades.length ? grades.reduce((a,g) => a + +g.value, 0) / grades.length : 0;
  const diags = DB.getDiagnostics().filter(d => d.studentId === studentId);
  const badDiags = diags.filter(d => d.level === 'низкий' || d.level === 'базовый').length;
  let score = 0; const reasons = [];
  if (avg && avg < 3.0) { score += 40; reasons.push(`средний балл ${avg.toFixed(2)}`); }
  else if (avg && avg < 3.5) { score += 20; reasons.push(`средний балл ${avg.toFixed(2)}`); }
  if (badDiags >= 3) { score += 25; reasons.push(`${badDiags} диагностик низкого уровня`); }
  else if (badDiags >= 2) { score += 15; reasons.push(`${badDiags} диагностики низкого уровня`); }
  const twos = grades.filter(g => g.value === '2').length;
  const threes = grades.filter(g => g.value === '3').length;
  const total = grades.length || 1;
  if (twos / total > 0.15) { score += 30; reasons.push(`много двоек (${twos})`); }
  else if (threes / total > 0.35) { score += 15; reasons.push(`много троек (${threes})`); }
  let level = 'low';
  if (score >= 50) level = 'high';
  else if (score >= 25) level = 'medium';
  return { level, score, reasons, avg, badDiags };
}
function normalizeDate(s) {
  if (!s) return '';
  s = String(s).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function parseStudentsText(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
  const result = [];
  lines.forEach((line, idx) => {
    const parts = line.split(/\t|;|,/).map(x => x.trim()).filter(Boolean);
    if (!parts.length) return;
    const isHeader = idx === 0 && parts.some(p => /фамил|имя|отчество|дата|фио|класс/i.test(p));
    if (isHeader) return;
    let lastName = '', firstName = '', middleName = '', birthDate = '', className = '';
    if (parts.length === 1) {
      const fio = parts[0].split(/\s+/);
      lastName = fio[0] || ''; firstName = fio[1] || ''; middleName = fio[2] || '';
    } else {
      const lastPart = parts[parts.length - 1] || '';
      const isClassLike = /^\d{1,2}[А-Яа-яA-Za-z]?$/.test(lastPart);
      if (parts.length >= 5 && isClassLike) {
        lastName = parts[0]; firstName = parts[1]; middleName = parts[2];
        birthDate = normalizeDate(parts[3]);
        className = parts[4];
      }
      else if (parts.length === 4 && isClassLike) {
        lastName = parts[0]; firstName = parts[1]; middleName = parts[2];
        className = parts[3];
      }
      else if (parts.length === 4) {
        lastName = parts[0]; firstName = parts[1]; middleName = parts[2];
        birthDate = normalizeDate(parts[3]);
      }
      else {
        lastName = parts[0] || ''; firstName = parts[1] || ''; middleName = parts[2] || '';
      }
    }
    if (!lastName) return;
    result.push({ lastName, firstName, middleName, birthDate, className });
  });
  return result;
}

function downloadCSV(filename, content) {
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadXLSX(filename, sheets) {
  try {
    const wb = XLSX.utils.book_new();
    sheets.forEach(sheet => {
      const ws = XLSX.utils.aoa_to_sheet(sheet.rows);
      if (sheet.colWidths) ws['!cols'] = sheet.colWidths.map(w => ({ wch: w }));
      if (sheet.coloredCells) {
        sheet.coloredCells.forEach(({ r, c, bg, color, bold }) => {
          const addr = XLSX.utils.encode_cell({ r, c });
          if (!ws[addr]) return;
          ws[addr].s = ws[addr].s || {};
          if (bg) ws[addr].s.fill = { fgColor: { rgb: bg } };
          if (color) ws[addr].s.font = { color: { rgb: color }, bold: !!bold };
        });
      }
      const range = XLSX.utils.decode_range(ws['!ref']);
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: range.s.r, c: range.s.c }, e: { r: range.e.r, c: range.e.c } })};
      XLSX.utils.book_append_sheet(wb, ws, sheet.name);
    });
    XLSX.writeFile(wb, filename);
    showToast('Excel сохранён: ' + filename, 'success');
  } catch (err) {
    console.error(err);
    showToast('Ошибка XLSX: ' + err.message, 'error', 5000);
  }
}

/* ============================================================
   КОНТРОЛЛЕР НАВИГАЦИИ
   ============================================================ */
(function() {
  const HOVER_MQ = window.matchMedia('(hover: hover) and (pointer: fine)');
  let openKey = null;
  let closeTimer = null;

  function getGroups() {
    return Array.from(document.querySelectorAll('.sa-nav-group[data-sa-group]'));
  }
  function getToggle(key) {
    return document.querySelector(`[data-sa-toggle="${key}"]`);
  }
  function getGroup(key) {
    return document.querySelector(`.sa-nav-group[data-sa-group="${key}"]`);
  }
  function getPortal() {
    return document.getElementById('sa-nav-portal');
  }

  function ensurePortal() {
    let p = getPortal();
    if (!p) {
      p = document.createElement('div');
      p.id = 'sa-nav-portal';
      p.className = 'sa-nav-dropdown-portal';
      document.body.appendChild(p);
      p.addEventListener('mouseenter', () => clearTimeout(closeTimer));
      p.addEventListener('mouseleave', () => scheduleClose());
    }
    return p;
  }

  function buildItems(group) {
    const items = group.items || [];
    const act = activeRouteObj();
    return items.map(it => {
      const [r, s] = it.key.split('/');
      const isActive = s
        ? act.route === r && (act.sub === s || (!act.sub && s === 'main'))
        : act.route === r;
      return `<button type="button" data-sa-hash="${it.key}" class="${isActive ? 'active' : ''}">
        ${icon(it.icon, 14)} <span>${it.label}</span>
      </button>`;
    }).join('');
  }

  function positionPortal(portal, toggle) {
    const rect = toggle.getBoundingClientRect();
    portal.style.top = (rect.bottom + 2) + 'px';
    portal.style.left = rect.left + 'px';
    const pw = portal.offsetWidth || 230;
    if (rect.left + pw > window.innerWidth - 8) {
      portal.style.left = Math.max(8, window.innerWidth - pw - 8) + 'px';
    }
  }

  window.saNavOpen = function(key) {
    const group = NAV_GROUPS.find(g => g.key === key);
    const toggle = getToggle(key);
    if (!group || !toggle || group.type !== 'group') return;
    const portal = ensurePortal();
    portal.innerHTML = buildItems(group);
    portal.classList.add('open');
    portal.style.visibility = 'hidden';
    positionPortal(portal, toggle);
    portal.style.visibility = '';
    openKey = key;
    toggle.classList.add('active-open');
  };

  window.saNavClose = function() {
    const portal = getPortal();
    if (portal) portal.classList.remove('open');
    getGroups().forEach(g => {
      const t = g.querySelector('[data-sa-toggle]');
      if (t) t.classList.remove('active-open');
    });
    openKey = null;
  };

  window.saNavToggle = function(key) {
    if (openKey === key) window.saNavClose();
    else window.saNavOpen(key);
  };

  function scheduleClose() {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => {
      const portal = getPortal();
      const group = openKey ? getGroup(openKey) : null;
      if (portal && portal.matches(':hover')) return;
      if (group && group.matches(':hover')) return;
      window.saNavClose();
    }, 180);
  }

  document.addEventListener('click', e => {
    const toggle = e.target.closest('[data-sa-toggle]');
    if (toggle) {
      e.preventDefault();
      e.stopPropagation();
      window.saNavToggle(toggle.dataset.saToggle);
      return;
    }
    const item = e.target.closest('#sa-nav-portal [data-sa-hash]');
    if (item) {
      e.preventDefault();
      const hash = item.dataset.saHash;
      window.saNavClose();
      location.hash = hash;
      return;
    }
    const single = e.target.closest('.sa-nav-single[data-sa-hash]');
    if (single) {
      e.preventDefault();
      window.saNavClose();
      location.hash = single.dataset.saHash;
      return;
    }
    if (!e.target.closest('.sa-nav-group') && !e.target.closest('#sa-nav-portal')) {
      window.saNavClose();
    }
  });

  document.addEventListener('mouseover', e => {
    if (!HOVER_MQ.matches) return;
    const toggle = e.target.closest('[data-sa-toggle]');
    if (toggle) {
      clearTimeout(closeTimer);
      window.saNavOpen(toggle.dataset.saToggle);
      return;
    }
    if (e.target.closest('#sa-nav-portal')) {
      clearTimeout(closeTimer);
    }
  });

  document.addEventListener('mouseout', e => {
    if (!HOVER_MQ.matches) return;
    const fromGroup = e.target.closest('.sa-nav-group');
    const fromPortal = e.target.closest('#sa-nav-portal');
    if (!fromGroup && !fromPortal) return;
    const to = e.relatedTarget;
    if (to && (to.closest('.sa-nav-group') || to.closest('#sa-nav-portal'))) return;
    scheduleClose();
  });

  window.addEventListener('hashchange', () => window.saNavClose());
  window.addEventListener('resize', () => window.saNavClose());
  window.addEventListener('scroll', () => {
    if (openKey) window.saNavClose();
  }, { passive: true, capture: true });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') window.saNavClose();
  });
})();

function renderWidgetClassesTable(students, classes, subjects) {
  const rows = classes.map(c => {
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0;
    sts.forEach(s => subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v)) { sum += +v; cnt++; }
    }));
    const avg = cnt ? (sum/cnt).toFixed(2) : '—';
    const cls = cnt ? (+avg >= 4.5 ? 'badge-green' : +avg >= 3.5 ? 'badge-blue' : 'badge-orange') : 'badge-gray';
    const b = DB.getBuildings().find(x => x.id === c.buildingId);

    return `<tr><td><b>${esc(c.name)}</b></td>
      <td class="hide-mobile">${esc(b ? b.name : '—')}</td>
      <td class="hide-mobile">${esc(t ? t.name : '—')}</td>
      <td class="text-right">${sts.length}</td>
      <td class="text-right"><span class="badge ${cls}">${avg}</span></td>
      <td class="text-right"><button class="btn btn-outline btn-sm btn-icon" onclick="exportClass(${c.id})" title="PDF">${icon('file-pdf', 12)}</button></td>

function renderWidgetRisks(students) {
  const risks = students.map(s => ({ s, r: studentRisk(s.id) }))
    .sort((a, b) => b.r.score - a.r.score).slice(0, 5);
  if (!risks.length) return `<div class="empty"><div class="empty-icon">✓</div><div>Нет учеников</div></div>`;
  return risks.map(({ s, r }) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
      <div><div style="font-weight:600;">${esc(fullName(s))}</div>
        <div class="muted" style="font-size:11px;">${esc(r.reasons.join(' · ') || 'нет данных')}</div></div>
      <span class="badge ${r.level === 'high' ? 'badge-red' : r.level === 'medium' ? 'badge-orange' : 'badge-green'}">
        ${r.level === 'high' ? 'высокий' : r.level === 'medium' ? 'средний' : 'низкий'}</span>
    </div>`).join('');
}
function renderWidgetTopStudents(students, subjects) {
  const tops = students.map(s => {
    let sum = 0, cnt = 0;
    subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v)) { sum += +v; cnt++; }
    });
    return { s, avg: cnt ? sum/cnt : 0 };
  }).filter(x => x.avg > 0).sort((a,b) => b.avg - a.avg).slice(0, 5);
  if (!tops.length) return `<div class="empty"><div class="empty-icon">👥</div><div>Нет данных</div></div>`;
  const medals = ['🥇','🥈','🥉'];
  return tops.map((x, i) => `
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
      <div>${i < 3 ? medals[i] : (i+1) + '.'} <b>${esc(fullName(x.s))}</b></div>
      <span class="badge badge-green">${x.avg.toFixed(2)}</span>
    </div>`).join('');
}

function initWidgetDrag() {
  const grid = document.getElementById('widgetGrid');
  if (!grid) return;
  const widgets = grid.querySelectorAll('.widget');
  let dragged = null;
  widgets.forEach(w => {
    w.addEventListener('dragstart', e => { dragged = w; w.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    w.addEventListener('dragend', () => {
      w.classList.remove('dragging');
      widgets.forEach(x => x.classList.remove('drag-over'));
      const newOrder = Array.from(grid.querySelectorAll('.widget')).map(x => x.dataset.widget);
      DB.setDashboardWidgets(newOrder);
    });
    w.addEventListener('dragover', e => { e.preventDefault(); if (dragged && dragged !== w) w.classList.add('drag-over'); });
    w.addEventListener('dragleave', () => w.classList.remove('drag-over'));
    w.addEventListener('drop', e => {
      e.preventDefault();
      w.classList.remove('drag-over');
      if (dragged && dragged !== w) {
        const all = Array.from(grid.children);
        if (all.indexOf(dragged) < all.indexOf(w)) w.after(dragged); else w.before(dragged);
      }
    });
  });
}

function syncClassInfo() {

function saveStudent(id) {
  const last = document.getElementById('f_last').value.trim();
  const first = document.getElementById('f_first').value.trim();
  const cid = +document.getElementById('f_class').value;
  if (!last || !first) { showToast('Укажите ФИО', 'error'); return; }
  if (!cid) { showToast('Выберите класс', 'error'); return; }
  const data = {
    lastName: last, firstName: first,
    middleName: document.getElementById('f_middle').value.trim(),
    birthDate: document.getElementById('f_birth').value, classId: cid,
  };
  if (!id) UndoStack.push('Добавление ученика');
  if (id) DB.updateStudent(id, data); else DB.addStudent(data);
  closeModal(); showToast(id ? 'Ученик обновлён' : 'Ученик добавлен', 'success'); render();
}
function delStudent(id) {
  const s = DB.getStudent(id);

  UndoStack.push('Удаление ученика');

function applyImportStudents() {
  const buildingId = +document.getElementById('imp_building').value || null;
  const defaultClassId = +document.getElementById('imp_class').value || null;
  const text = document.getElementById('imp_text').value;
  const list = parseStudentsText(text);
  if (!list.length) { showToast('Нет данных', 'error'); return; }

  UndoStack.push(`Импорт учеников (${list.length})`);
  let createdClasses = 0;
  let addedStudents = 0;

  list.forEach(s => {
    let cid = null;
    if (s.className) {
      const existing = DB.getClasses().find(c => c.name.toLowerCase() === s.className.toLowerCase());
      if (existing) {
        cid = existing.id;
      } else {
        const newC = DB.findOrCreateClass(s.className, buildingId);
        cid = newC.id;
        createdClasses++;
      }
    } else if (defaultClassId) {
      cid = defaultClassId;
    } else {
      return;
    }
    DB.addStudent({
      lastName: s.lastName,
      firstName: s.firstName,
      middleName: s.middleName,
      birthDate: s.birthDate,
      classId: cid,
    });
    addedStudents++;
  });

  closeModal();
  let msg = `Добавлено учеников: ${addedStudents}`;
  if (createdClasses > 0) msg += ` · создано классов: ${createdClasses}`;
  showToast(msg, 'success', 5000);
  render();
}
function openStudentsCsvModal() {
  const students = allowedStudents();
  const rows = [['Фамилия','Имя','Отчество','ДатаРождения','Класс']];
  students.forEach(s => {
    const c = DB.getClasses().find(x => x.id === s.classId);
    rows.push([s.lastName, s.firstName, s.middleName, s.birthDate, c ? c.name : '']);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  downloadCSV(`Ученики_${todayStr()}.csv`, csv);
}

function saveDiag(studentId, diagId) {
  const title = document.getElementById('d_title').value.trim();
  if (!title) { showToast('Укажите название', 'error'); return; }
  const scoreRaw = document.getElementById('d_score').value;
  const maxRaw = document.getElementById('d_max').value;
  const data = {
    studentId, title,
    type: document.getElementById('d_type').value,
    subject: document.getElementById('d_subject').value,
    date: document.getElementById('d_date').value,
    result: document.getElementById('d_result').value.trim(),
    score: scoreRaw === '' ? null : +scoreRaw,
    maxScore: maxRaw === '' ? null : +maxRaw,
    level: document.getElementById('d_level').value,
    comment: document.getElementById('d_comment').value.trim(),
  };
  if (!diagId) UndoStack.push('Добавление диагностики');
  if (diagId) DB.updateDiagnostic(diagId, data); else DB.addDiagnostic(data);
  closeModal(); showToast(diagId ? 'Обновлено' : 'Добавлено', 'success'); render();
}
function delDiag(id) {
  if (!confirm('Удалить?')) return;
  UndoStack.push('Удаление диагностики');
  DB.deleteDiagnostic(id);
  showToast('Удалено', 'success'); render();
}

function applyPromoteClass(classId) {

/* ============================================================
   СРАВНЕНИЕ С ПРЕДЫДУЩИМ ГОДОМ
   ============================================================ */
function openClassComparison(classId) {
  const comp = DB.getClassYearComparison(classId);
  const c = DB.getClasses().find(x => x.id === classId);
  if (!c) { showToast('Класс не найден', 'error'); return; }

  if (!comp || !comp.hasData) {
    showModal(`
      <h2>${icon('trending-up', 20)} Сравнение · ${esc(c.name)}</h2>
      <div class="alert alert-warn">${icon('alert', 14)}
        Недостаточно данных для сравнения. Нужны оценки как минимум за 2 учебных года по одним и тем же ученикам.
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="closeModal()">Закрыть</button>
      </div>
    `);
    return;
  }

  const years = comp.years;
  const firstYear = years[0];
  const lastYear = years[years.length - 1];
  const y1 = comp.perYear[firstYear];
  const y2 = comp.perYear[lastYear];

  const diffAvg = y1 && y2 ? +(y2.avg - y1.avg).toFixed(2) : 0;
  const diffQuality = y1 && y2 ? y2.quality - y1.quality : 0;
  const diffSuccess = y1 && y2 ? y2.success - y1.success : 0;

  const arrow = v => v > 0 ? '↑' : v < 0 ? '↓' : '→';
  const color = v => v > 0 ? 'var(--success)' : v < 0 ? 'var(--danger)' : 'var(--text-muted)';
  const sign = v => v > 0 ? '+' : '';

  const yearsRows = years.map(y => {
    const d = comp.perYear[y];
    if (!d) return '';
    return `<tr><td><b>${y}</b></td>
      <td class="text-right">${d.avg}</td>
      <td class="text-right">${d.quality}%</td>
      <td class="text-right">${d.success}%</td>
      <td class="text-right">${d.count}</td></tr>`;
  }).join('');

  const sorted = [...comp.perStudent].sort((a, b) => (b.diff ?? -99) - (a.diff ?? -99));
  const grew = sorted.filter(x => x.diff !== null && x.diff > 0);
  const fell = sorted.filter(x => x.diff !== null && x.diff < 0);
  const stayed = sorted.filter(x => x.diff !== null && x.diff === 0);

  const studentRows = sorted.map(x => {
    const v = x.diff;
    const dColor = v === null ? 'var(--text-muted)' : color(v);
    const dText = v === null ? '—' : `${arrow(v)} ${sign(v)}${v}`;
    return `<tr>
      <td><b>${esc(fullName(x.student))}</b></td>
      ${years.map(y => `<td class="text-right">${x.byYear[y] !== null ? x.byYear[y] : '—'}</td>`).join('')}
      <td class="text-right"><b style="color:${dColor};">${dText}</b></td>
    </tr>`;
  }).join('');

  showModal(`
    <h2>${icon('trending-up', 20)} Сравнение · ${esc(c.name)}</h2>

    <div class="alert alert-info">${icon('info', 14)}
      Сравнение тех же учеников за разные годы. Год берётся из поля <b>«учебный год»</b> в оценках.
    </div>

    <h3>Сводка по годам</h3>
    <div class="stats-grid" style="margin-bottom:20px;">
      <div class="stat-card"><div class="num">${y1 ? y1.avg : '—'}</div><div class="lbl">${firstYear} средний</div></div>
      <div class="stat-card"><div class="num">${y2 ? y2.avg : '—'}</div><div class="lbl">${lastYear} средний</div></div>
      <div class="stat-card" style="border-left-color:${color(diffAvg)};">
        <div class="num" style="color:${color(diffAvg)};">${arrow(diffAvg)} ${sign(diffAvg)}${diffAvg}</div>
        <div class="lbl">Динамика среднего</div></div>
      <div class="stat-card" style="border-left-color:${color(diffQuality)};">
        <div class="num" style="color:${color(diffQuality)};">${arrow(diffQuality)} ${sign(diffQuality)}${diffQuality}%</div>
        <div class="lbl">Динамика качества</div></div>
    </div>

    <h3>По годам</h3>
    <div class="table-wrap" style="margin-bottom:20px;">
      <table>
        <thead><tr><th>Год</th><th class="text-right">Ср. балл</th><th class="text-right">Качество</th><th class="text-right">Успеваемость</th><th class="text-right">Оценок</th></tr></thead>
        <tbody>${yearsRows}</tbody></table>
    </div>

    <h3>Динамика по каждому ученику</h3>
    <div class="row-flex" style="gap:10px;margin-bottom:12px;">
      <span class="badge badge-green">Растут: ${grew.length}</span>
      <span class="badge badge-red">Падают: ${fell.length}</span>
      <span class="badge badge-gray">Без изменений: ${stayed.length}</span>
    </div>
    <div class="table-wrap" style="margin-bottom:20px;max-height:400px;overflow:auto;">
      <table>
        <thead><tr><th>Ученик</th>${years.map(y => `<th class="text-right">${y}</th>`).join('')}<th class="text-right">Δ</th></tr></thead>
        <tbody>${studentRows}</tbody></table>
    </div>

    <div class="form-actions">
      <button class="btn btn-success" onclick="printClassComparison(${classId})">${icon('file-pdf', 14)} Печать сравнения</button>
      <button class="btn btn-outline" onclick="closeModal()">Закрыть</button>
    </div>
  `);
}

function printClassComparison(classId) {
  const comp = DB.getClassYearComparison(classId);
  const c = DB.getClasses().find(x => x.id === classId);
  if (!comp || !comp.hasData) { showToast('Недостаточно данных', 'error'); return; }
  const years = comp.years;
  const firstYear = years[0];
  const lastYear = years[years.length - 1];
  const y1 = comp.perYear[firstYear];
  const y2 = comp.perYear[lastYear];
  const diffAvg = y1 && y2 ? +(y2.avg - y1.avg).toFixed(2) : 0;
  const diffQuality = y1 && y2 ? y2.quality - y1.quality : 0;
  const today = new Date().toLocaleDateString('ru-RU');

  let html = `<h1>Сравнение успеваемости по годам</h1>
    <h2>${esc(c.name)} · ${firstYear} → ${lastYear} · ${today}</h2>
    <table class="info-table">
      <tr><td>Средний балл ${firstYear}:</td><td>${y1 ? y1.avg : '—'}</td></tr>
      <tr><td>Средний балл ${lastYear}:</td><td>${y2 ? y2.avg : '—'}</td></tr>
      <tr><td>Динамика среднего балла:</td><td><b>${diffAvg > 0 ? '+' : ''}${diffAvg}</b></td></tr>
      <tr><td>Динамика качества знаний:</td><td><b>${diffQuality > 0 ? '+' : ''}${diffQuality}%</b></td></tr>
    </table>
    <h3>По годам</h3>
    <table><thead><tr><th class="left">Год</th><th>Ср. балл</th><th>Качество</th><th>Успеваемость</th><th>Оценок</th></tr></thead><tbody>
      ${years.map(y => {
        const d = comp.perYear[y];
        if (!d) return '';
        return `<tr><td class="left">${y}</td><td>${d.avg}</td><td>${d.quality}%</td><td>${d.success}%</td><td>${d.count}</td></tr>`;
      }).join('')}
    </tbody></table>
    <h3>Динамика по ученикам</h3>
    <table><thead><tr><th class="left">Ученик</th>${years.map(y => `<th>${y}</th>`).join('')}<th>Δ</th></tr></thead><tbody>
      ${comp.perStudent.map(x => {
        const v = x.diff;
        const dText = v === null ? '—' : (v > 0 ? '+' : '') + v;
        return `<tr><td class="left">${esc(fullName(x.student))}</td>${years.map(y => `<td>${x.byYear[y] !== null ? x.byYear[y] : '—'}</td>`).join('')}<td>${dText}</td></tr>`;
      }).join('')}
    </tbody></table>
    <div class="sig">
      <div>Кл. руководитель: ___________________ / ____________</div>
      <div>Дата: «____» ____________ ${new Date().getFullYear()} г.</div>
    </div>
  `;
  exportPDF(html, `Сравнение — ${c.name}`);
}

function renderTeacherDetail(id) {
  if (SESSION.role !== 'admin' && SESSION.role !== 'director') { go('dashboard'); return; }
  const teacher = DB.getSubjectTeachersList().find(t => t.id === id);
  if (!teacher) { page('<div class="card"><div class="empty">Не найден</div></div>', 'subject-teachers'); return; }
  const classes = allowedClasses();
  const students = allowedStudents();
  const assignments = DB.getSubjectTeachers().filter(st => st.teacherId === id && classes.some(c => c.id === st.classId));
  let totalSum = 0, totalCnt = 0;
  const dist = {'5':0,'4':0,'3':0,'2':0};
  const perSubject = {};
  assignments.forEach(a => {
    if (!perSubject[a.subject]) perSubject[a.subject] = { sum: 0, cnt: 0, classes: [] };
    const classObj = DB.getClasses().find(c => c.id === a.classId);
    const sts = students.filter(s => s.classId === a.classId);
    let sum = 0, cnt = 0;
    sts.forEach(s => {
      DB.getGrades().filter(g => g.studentId === s.id && g.subject === a.subject && /^[2-5]$/.test(g.value))
        .forEach(g => { sum += +g.value; cnt++; totalSum += +g.value; totalCnt++; dist[g.value]++; });
    });
    perSubject[a.subject].sum += sum;
    perSubject[a.subject].cnt += cnt;
    if (classObj) perSubject[a.subject].classes.push(classObj.name);
  });
  const overallAvg = totalCnt ? (totalSum / totalCnt).toFixed(2) : '—';
  const subjectRows = Object.entries(perSubject).map(([sub, data]) => {
    const avg = data.cnt ? (data.sum / data.cnt).toFixed(2) : '—';
    const cls = data.cnt ? (+avg >= 4.5 ? 'badge-green' : +avg >= 3.5 ? 'badge-blue' : +avg >= 2.5 ? 'badge-orange' : 'badge-red') : 'badge-gray';
    return `<tr><td><b>${esc(sub)}</b></td>
      <td>${data.classes.map(c => `<span class="badge badge-blue">${esc(c)}</span>`).join(' ')}</td>
      <td class="text-right">${data.cnt}</td>
      <td class="text-right"><span class="badge ${cls}">${avg}</span></td></tr>`;

  const notes = teacher.notes || [];

      <td>${esc(n.author || '—')}</td>
      <td>${esc(n.text)}</td>
      <td class="text-right">
        <button class="btn btn-danger btn-sm btn-icon" onclick="delTeacherNote(${id},${n.id})" title="Удалить">${icon('trash', 12)}</button>
      </td></tr>`).join('');
  const canEdit = SESSION.role === 'admin';
  page(`
    <div class="card">
      <div class="row-flex" style="justify-content:space-between;align-items:flex-start;gap:12px;">
        <div style="flex:1;min-width:0;">
          <h2 style="margin-bottom:8px;">${icon('user', 22)} ${esc(teacher.name)}</h2>
          <div class="row-flex" style="gap:8px;">
            <span class="badge ${MCKO_CLASS[teacher.mckoLevel || 'нет']}" style="font-size:14px;">МЦКО: ${esc(teacher.mckoLevel || 'нет')}</span>
            ${teacher.mckoDate ? `<span class="muted">от ${esc(fmtDate(teacher.mckoDate))}</span>` : ''}
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-outline btn-sm" onclick="go('subject-teachers')" title="Назад">${icon('close', 14)} Назад</button>
          <button class="btn btn-success btn-sm" onclick="exportTeacherCard(${id})" title="PDF">${icon('file-pdf', 14)} PDF</button>
          <button class="btn btn-warn btn-sm" onclick="printTeacherCharacteristic(${id})" title="Характеристика">${icon('file-pdf', 14)} Характеристика</button>
          ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="openEditTeacherModal(${id})" title="Редактировать">${icon('edit', 14)}</button>` : ''}
        </div>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="num">${sizeMB} МБ</div><div class="lbl">Размер</div></div>

let journalState = { classId: '', period: 'I четверть', draft: {}, draftDiag: {} };
const JOURNAL_DRAFT_KEY = 'sa_journal_draft_v5';
function loadDraft() {
  try {
    const raw = localStorage.getItem(JOURNAL_DRAFT_KEY);
    if (raw) { const d = JSON.parse(raw); journalState.draft = d.draft || {}; journalState.draftDiag = d.draftDiag || {}; }
  } catch(e) {}
}
function saveDraft() { localStorage.setItem(JOURNAL_DRAFT_KEY, JSON.stringify({ draft: journalState.draft, draftDiag: journalState.draftDiag })); }
function clearDraft() { journalState.draft = {}; journalState.draftDiag = {}; localStorage.removeItem(JOURNAL_DRAFT_KEY); }

function renderJournal() {
  const classes = DB.getClasses();
  const subjects = DB.getSubjects();
  if (!journalState.classId && classes.length) journalState.classId = String(classes[0].id);
  const students = DB.getStudents().filter(s => s.classId === +journalState.classId).sort((a,b) => a.lastName.localeCompare(b.lastName, 'ru'));
  const existing = {};
  if (journalState.classId) {
    const sids = students.map(s => s.id);
    DB.getGrades().filter(g => g.period === journalState.period && sids.includes(g.studentId))
      .forEach(g => { existing[`${g.studentId}|${g.subject}|${g.type}`] = g.value; });
  }
  const getGrade = (sid, subject, type) => {
    const k = `${sid}|${subject}|${type}`;
    return journalState.draft[k] !== undefined ? journalState.draft[k] : (existing[k] || '');
  };
  let headerTop = '<th rowspan="2" class="name-col" style="text-align:left;min-width:150px;">ФИО</th>';
  let headerBottom = '';
  subjects.forEach(sub => {
    const teacher = DB.getSubjectTeacher(+journalState.classId, sub);
    headerTop += `<th colspan="3" class="subject-group" style="text-align:center;background:var(--bg-hover);color:var(--primary);">
      <span class="subject-name">${esc(sub)}</span>
      <span class="subject-teacher">${teacher ? esc(teacher.name) : '—'}</span></th>`;
    headerBottom += `<th style="text-align:center;"><span class="type-lbl">тек</span></th>
      <th style="text-align:center;"><span class="type-lbl">пром</span></th>
      <th style="text-align:center;"><span class="type-lbl">итог</span></th>`;
  });
  const rows = students.map(s => {
    let row = `<td class="name-cell">${esc(fullName(s))}</td>`;
    subjects.forEach(sub => {
      GRADE_TYPES.forEach(type => {
        const k = `${s.id}|${sub}|${type}`;
        const v = getGrade(s.id, sub, type);
        const existed = existing[k];
        let cls = 'journal-input';
        if (existed && v !== existed) cls += ' changed';
        else if (v) cls += ' filled';
        row += `<td class="subject-group" style="padding:2px;">
          <input class="${cls}" data-sid="${s.id}" data-subject="${esc(sub)}" data-type="${type}"
                 value="${esc(v)}" maxlength="8"
                 oninput="onJournalInput(${s.id},'${esc(sub)}','${type}',this.value)"
                 onkeydown="journalKeyNav(event)"></td>`;
      });
    });
    return `<tr>${row}</tr>`;
  }).join('');
  page(`
    <h2 style="margin-bottom:16px;color:var(--primary);">${icon('edit', 20)} Журнал</h2>
    <div class="card">
      <div class="form-grid mb-16">
        <div class="form-group"><label>Класс</label>
          <select onchange="journalState.classId=this.value;renderJournal();">
            ${classes.map(c => `<option value="${c.id}" ${journalState.classId==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div class="form-group"><label>Период</label>
          <select onchange="journalState.period=this.value;renderJournal();">
            ${PERIODS.map(p => `<option ${journalState.period===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
      </div>
      ${students.length ? `
        <div class="row-flex mb-16" style="gap:6px;flex-wrap:wrap;">
          ${['5','4','3','2'].map(v => `<button class="btn btn-outline btn-sm" onclick="fillAllTypes('${v}')">Все «${v}»</button>`).join('')}
          <button class="btn btn-outline btn-sm" onclick="clearAll()">Очистить</button>
        </div>
        <div class="table-wrap" style="max-height:60vh;overflow:auto;">
          <table class="journal-table"><thead><tr>${headerTop}</tr><tr>${headerBottom}</tr></thead>
          <tbody>${rows}</tbody></table>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="saveJournalGrades()">${icon('save', 14)} Сохранить</button>
          <button class="btn btn-outline" onclick="clearDraft();renderJournal();">Отменить</button>
        </div>` : `<div class="empty"><div class="empty-icon">📝</div><div>Нет учеников</div></div>`}
    </div>
  `, 'journal');
}
function onJournalInput(sid, subject, type, value) {
  const v = value.trim();
  const k = `${sid}|${subject}|${type}`;
  if (v === '') delete journalState.draft[k]; else journalState.draft[k] = v;
  saveDraft();
}
function journalKeyNav(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const inputs = Array.from(document.querySelectorAll('.journal-input'));
    const i = inputs.indexOf(e.target);
    if (i >= 0 && i < inputs.length - 1) inputs[i + 1].focus();
  }
}
function fillAllTypes(value) {
  const students = DB.getStudents().filter(s => s.classId === +journalState.classId);
  const subjects = DB.getSubjects();
  students.forEach(s => subjects.forEach(sub => GRADE_TYPES.forEach(ty => {
    journalState.draft[`${s.id}|${sub}|${ty}`] = value;
  })));
  saveDraft(); renderJournal();
}
function clearAll() { journalState.draft = {}; saveDraft(); renderJournal(); }
function saveJournalGrades() {
  if (!journalState.classId) { showToast('Выберите класс', 'error'); return; }
  const students = DB.getStudents().filter(s => s.classId === +journalState.classId);
  const entries = Object.entries(journalState.draft);
  if (!entries.length) { showToast('Нет оценок', 'error'); return; }
  UndoStack.push(`Сохранение оценок (${entries.length})`);
  let added = 0, updated = 0;
  const d = DB.load();
  const subjects = DB.getSubjects();
  entries.forEach(([key, value]) => {
    const [sidStr, subject, type] = key.split('|');
    const sid = +sidStr;
    if (!students.some(s => s.id === sid)) return;
    if (!GRADE_TYPES.includes(type) || !subjects.includes(subject)) return;
    const idx = d.grades.findIndex(g => g.studentId === sid && g.subject === subject
      && g.period === journalState.period && g.type === type);
    if (idx >= 0) { d.grades[idx].value = value; updated++; }
    else { d.grades.push({ id: d.nextIds.grade++, studentId: sid, subject, period: journalState.period, type, value, year: '2024-2025' }); added++; }
  });
  DB.save(); clearDraft();
  showToast(`Добавлено: ${added}, обновлено: ${updated}`, 'success');
  renderJournal();
}

function forceCloudSync() {
  if (typeof DB.syncFromCloud === 'function') {
    showToast('Синхронизация запущена...', 'info');
    DB._lastCloudSync = 0; // принудительно считаем облако источником правды
    DB.syncFromCloud();
  } else {
    showToast('Синхронизация недоступна', 'error');
  }
}
function downloadBackupJSON() {
  const json = DB.exportAll();
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `school_analytics_backup_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Скачано', 'success');
}
function openImportBackupModal() {
  showModal(`
    <h2>${icon('upload', 20)} Восстановление</h2>
    <div class="alert alert-warn">${icon('alert', 14)} Текущие данные будут заменены.</div>
    <div class="form-group mb-16"><label>Файл .json</label><input type="file" id="backupFile" accept=".json"></div>
    <div class="form-actions">
      <button class="btn btn-warn" onclick="applyImportBackup()">${icon('refresh', 14)} Заменить</button>
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
    </div>
  `);
}
function applyImportBackup() {
  const file = document.getElementById('backupFile')?.files?.[0];
  if (!file) { showToast('Выберите файл', 'error'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      DB.importAll(reader.result);
      showToast('Восстановлено', 'success');
      closeModal(); render();
    } catch (err) { showToast('Ошибка: ' + err.message, 'error', 5000); }
  };
  reader.readAsText(file);
}
function createSnapshotManual() {
  const label = prompt('Название снапшота:', 'Снапшот ' + new Date().toLocaleString('ru-RU'));
  if (!label) return;
  DB.createSnapshot(label);
  showToast('Создан', 'success'); renderBackup();
}
function restoreSnapshot(id) {
  if (!confirm('Восстановить?')) return;
  if (DB.restoreSnapshot(id)) { showToast('Восстановлено', 'success'); render(); }
  else showToast('Не найден', 'error');
}
function deleteSnapshot(id) { if (confirm('Удалить?')) { DB.deleteSnapshot(id); renderBackup(); } }
function clearAllSnapshots() {
  if (!confirm('Удалить ВСЕ снапшоты?')) return;
  const d = DB.load();
  d.snapshots = [];
  DB.save();
  renderBackup();
}

function saveAutoReports() {
  const email = document.getElementById('ar_email').value.trim();
  const schedule = document.getElementById('ar_schedule').value;
  const enabled = document.getElementById('ar_enabled').checked;
  DB.setAutoReports({ email, schedule, enabled });
  showToast('Сохранено', 'success'); closeModal(); render();
}
function sendReportNow() {
  const cfg = DB.getAutoReports();
  const email = document.getElementById('ar_email')?.value.trim() || cfg.email;
  if (!email) { showToast('Укажите email', 'error'); return; }
  const classes = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();
  let text = 'Аналитический отчёт\n\n' + new Date().toLocaleString('ru-RU') + '\n\n';
  classes.forEach(c => {
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0;
    sts.forEach(s => subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v)) { sum += +v; cnt++; }
    }));
    const avg = cnt ? (sum/cnt).toFixed(2) : '—';
    text += `Класс ${c.name}: ${sts.length} учеников, средний балл ${avg}\n`;
  });
  const subject = encodeURIComponent('Аналитический отчёт — ' + new Date().toLocaleDateString('ru-RU'));
  const body = encodeURIComponent(text);
  window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
  DB.setAutoReports({ ...cfg, lastSent: new Date().toISOString() });
  showToast('Открыто письмо', 'success');
  closeModal();
}
