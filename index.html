function exportStudent(id) {
  const s = DB.getStudent(id);
  if (!s) return;
  const c = DB.getClasses().find(x => x.id === s.classId);
  const b = c ? DB.getBuildings().find(x => x.id === c.buildingId) : null;
  const t = c ? DB.getTeachers().find(x => x.id === c.teacherId) : null;
  const m = gradeMatrix(id);
  const subjects = DB.getSubjects().filter(sub => PERIODS.some(p => m[sub + '|' + p]));
  const diags = DB.getDiagnostics().filter(d => d.studentId === id);
  let html = `<h1>Аналитическая справка</h1><h2>${esc(fullName(s))}</h2>
    <table class="info-table">
      <tr><td>Дата рождения:</td><td>${esc(fmtDate(s.birthDate))}</td></tr>
      <tr><td>Класс:</td><td>${esc(c ? c.name : '—')}</td></tr>
      <tr><td>Здание:</td><td>${esc(b ? b.name : '—')}</td></tr>
      <tr><td>Кл. руководитель:</td><td>${esc(t ? t.name : '—')}</td></tr>
    </table>`;
  if (subjects.length) {
    html += `<h3>Успеваемость</h3><table><thead><tr><th class="left">Предмет</th><th class="left">Учитель</th>
      ${PERIODS.map(p => `<th>${p}</th>`).join('')}</tr></thead><tbody>`;
    subjects.forEach(sub => {
      const st = c ? DB.getSubjectTeacher(c.id, sub) : null;
      html += `<tr><td class="left">${esc(sub)}</td><td class="left">${esc(st ? st.name : '—')}</td>`;
      PERIODS.forEach(p => {
        const cell = m[sub + '|' + p];
        if (!cell) { html += '<td>—</td>'; return; }
        const parts = [];
        ['текущая','промежуточная','итоговая'].forEach(ty => {
          if (cell[ty]) parts.push(`${cell[ty][cell[ty].length-1].value} <small>(${ty.slice(0,4)}.)</small>`);
        });
        html += `<td>${parts.join('<br>') || '—'}</td>`;
      });
      html += '</tr>';
    });
    html += `</tbody></table>`;
  }
  if (diags.length) {
    html += `<h3>Диагностики</h3><table><thead><tr><th class="left">Название</th><th>Тип</th><th>Дата</th>
      <th>Результат</th><th>Уровень</th></tr></thead><tbody>`;
    diags.forEach(d => {
      html += `<tr><td class="left">${esc(d.title)}</td><td>${esc(d.type||'')}</td>
        <td>${esc(fmtDate(d.date))}</td><td>${esc(d.result||'')}</td><td>${esc(d.level||'')}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  const chartGrades = DB.getGrades().filter(g => g.studentId === id && /^[2-5]$/.test(g.value));
  const values = PERIODS.map(p => {
    const gs = chartGrades.filter(g => g.period === p);
    return gs.length ? +(gs.reduce((a,b)=>a+ +b.value,0)/gs.length).toFixed(2) : null;
  });
  html += '<h3>Динамика по четвертям</h3>';
  html += renderChartToImage('line', 900, 400, {
    type: 'line',
    data: { labels: PERIODS, datasets: [{ label: 'Средний балл', data: values,
      borderColor: '#2c5282', backgroundColor: 'rgba(44,82,130,.12)',
      fill: true, tension: .3, pointRadius: 5, pointBackgroundColor: '#2c5282', spanGaps: true }] },
    options: { animation: false, responsive: false,
      plugins: { legend: { labels: { font: { size: 14 } } } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5 } } } }
  });
  const subjValues = subjects.map(sub => { const v = finalGrade(id, sub); return /^[2-5]$/.test(v) ? +v : null; });
  html += '<h3>Итоговые оценки</h3>';
  html += renderChartToImage('bar', 900, 400, {
    type: 'bar',
    data: { labels: subjects, datasets: [{ label: 'Итоговая', data: subjValues,
      backgroundColor: subjValues.map(v => v===5?'#38a169':v===4?'#3182ce':v===3?'#dd6b20':v===2?'#e53e3e':'#cbd5e0'),
      borderRadius: 6 }] },
    options: { animation: false, responsive: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: 1 } },
                x: { ticks: { maxRotation: 60, minRotation: 40, font: { size: 11 } } } } }
  });
  const counts = {'5':0,'4':0,'3':0,'2':0};
  chartGrades.forEach(g => counts[g.value]++);
  html += '<h3>Распределение оценок</h3>';
  html += renderChartToImage('doughnut', 600, 400, {
    type: 'doughnut',
    data: { labels: ['5','4','3','2'],
      datasets: [{ data: [counts['5'],counts['4'],counts['3'],counts['2']],
        backgroundColor: ['#38a169','#3182ce','#dd6b20','#e53e3e'], borderWidth: 2, borderColor: '#fff' }] },
    options: { animation: false, responsive: false, plugins: { legend: { position: 'bottom' } } }
  });
  html += `<div class="sig">
      <div>Классный руководитель: ___________________ / ${esc(t ? t.name : '____________')}</div>
      <div>Дата: «____» ____________ 20___ г.</div>
    </div>`;
  exportPDF(html, 'Справка — ' + fullName(s));
}

function exportTeacherCard(id) {
  const t = DB.getSubjectTeachersList().find(x => x.id === id);
  if (!t) return;
  const classes = allowedClasses();
  const students = allowedStudents();
  const assignments = DB.getSubjectTeachers().filter(st => st.teacherId === id && classes.some(c => c.id === st.classId));
  let totalSum = 0, totalCnt = 0;
  const perSubject = {};
  assignments.forEach(a => {
    if (!perSubject[a.subject]) perSubject[a.subject] = { sum: 0, cnt: 0, classes: [] };
    const classObj = DB.getClasses().find(c => c.id === a.classId);
    const sts = students.filter(s => s.classId === a.classId);
    let sum = 0, cnt = 0;
    sts.forEach(s => {
      DB.getGrades().filter(g => g.studentId === s.id && g.subject === a.subject && /^[2-5]$/.test(g.value))
        .forEach(g => { sum += +g.value; cnt++; totalSum += +g.value; totalCnt++; });
    });
    perSubject[a.subject].sum += sum;
    perSubject[a.subject].cnt += cnt;
    if (classObj) perSubject[a.subject].classes.push(classObj.name);
  });
  const overallAvg = totalCnt ? (totalSum / totalCnt).toFixed(2) : '—';
  let html = `<h1>Карточка учителя</h1><h2>${esc(t.name)}</h2>
    <table class="info-table">
      <tr><td>МЦКО:</td><td>${esc(t.mckoLevel || 'нет')}</td></tr>
      <tr><td>Дата МЦКО:</td><td>${esc(t.mckoDate ? fmtDate(t.mckoDate) : '—')}</td></tr>
      <tr><td>Всего оценок:</td><td>${totalCnt}</td></tr>
      <tr><td>Средний балл:</td><td><b>${overallAvg}</b></td></tr>
    </table>
    <h3>По предметам</h3>
    <table><thead><tr><th class="left">Предмет</th><th>Классы</th><th>Оценок</th><th>Ср. балл</th></tr></thead><tbody>
      ${Object.entries(perSubject).map(([sub, d]) => {
        const avg = d.cnt ? (d.sum/d.cnt).toFixed(2) : '—';
        return `<tr><td class="left">${esc(sub)}</td><td>${esc(d.classes.join(', '))}</td><td>${d.cnt}</td><td>${avg}</td></tr>`;
      }).join('')}
    </tbody></table>`;
  const notes = t.notes || [];
  if (notes.length) {

function exportStudentsXLSX() {
  const students = allowedStudents();

  const colored = [];
  students.sort((a,b) => a.lastName.localeCompare(b.lastName, 'ru')).forEach((s, ri) => {
    const c = DB.getClasses().find(x => x.id === s.classId);
    const row = [fullName(s), c ? c.name : ''];
    let sum = 0, cnt = 0;
    subjects.forEach((sub, ci) => {

      colored.push({ r: ri + 1, c: subjects.length + 2, bg, bold: true });

  });

/* ============================================================
   ДИНАМИКА ПО ПАРАЛЛЕЛЯМ
   ============================================================ */
function getParallelOf(className) {
  const m = String(className || '').match(/^(\d+)/);
  return m ? m[1] : null;
}
function groupClassesByParallel(classes) {
  const groups = {};
  classes.forEach(c => {
    const p = getParallelOf(c.name);
    if (!p) return;
    if (!groups[p]) groups[p] = [];
    groups[p].push(c);
  });
  Object.values(groups).forEach(arr => arr.sort((a, b) => a.name.localeCompare(b.name, 'ru')));
  return groups;
}
function classSubjectAvg(classId, subject, students) {
  const sts = students.filter(s => s.classId === classId);
  let sum = 0, cnt = 0;
  sts.forEach(s => {
    DB.getGrades()
      .filter(g => g.studentId === s.id && g.subject === subject && /^[2-5]$/.test(g.value))
      .forEach(g => { sum += +g.value; cnt++; });
  });
  return cnt ? +(sum / cnt).toFixed(2) : null;
}
function classSubjectQuality(classId, subject, students) {
  const sts = students.filter(s => s.classId === classId);
  let quality = 0, cnt = 0;
  sts.forEach(s => {
    DB.getGrades()
      .filter(g => g.studentId === s.id && g.subject === subject && /^[2-5]$/.test(g.value))
      .forEach(g => { cnt++; if (+g.value >= 4) quality++; });
  });
  return cnt ? Math.round(quality / cnt * 100) : null;
}
function parallelStats(parallel, classes, students, subjects) {
  const parallelClasses = classes.filter(c => getParallelOf(c.name) === parallel);
  const rows = [];
  subjects.forEach(subject => {
    const byClass = {};
    let bestId = null, bestAvg = -1;
    let worstId = null, worstAvg = 99;
    parallelClasses.forEach(c => {
      const avg = classSubjectAvg(c.id, subject, students);
      const quality = classSubjectQuality(c.id, subject, students);
      byClass[c.id] = { avg, quality, className: c.name };
      if (avg !== null) {
        if (avg > bestAvg) { bestAvg = avg; bestId = c.id; }
        if (avg < worstAvg) { worstAvg = avg; worstId = c.id; }
      }
    });
    rows.push({
      subject, byClass,
      leaderId: bestId, leaderAvg: bestAvg > -1 ? bestAvg : null,
      laggardId: worstId, laggardAvg: worstAvg < 99 ? worstAvg : null,
    });
  });
  const hasData = rows.some(r => Object.values(r.byClass).some(x => x.avg !== null));
  return { parallel, classes: parallelClasses, rows, hasData };
}
function renderAnalyticsParallels(tabs) {
  const allClasses = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();
  const groups = groupClassesByParallel(allClasses);
  const parallels = Object.keys(groups).sort((a, b) => +a - +b);
  const comparableParallels = parallels.filter(p => groups[p].length >= 2);

  if (!comparableParallels.length) {
    page(`
      <h1 style="margin-bottom:16px;color:var(--primary);">Аналитика</h1>
      ${tabs}
      <div class="card"><div class="empty">

        <div>Нет параллелей с двумя и более классами</div>
        <div class="muted">Например, «5А» и «5Б» — одна параллель. Добавьте классы с одинаковым номером.</div>
      </div></div>
    `, 'analytics');
    return;
  }

  const selected = analyticsFilter.parallel && comparableParallels.includes(analyticsFilter.parallel)
    ? analyticsFilter.parallel
    : comparableParallels[0];
  analyticsFilter.parallel = selected;

  const stats = parallelStats(selected, allClasses, students, subjects);

  const parallelTabs = comparableParallels.map(p => {
    const isActive = p === selected;
    return `<button class="btn ${isActive ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="analyticsFilter.parallel='${p}';renderAnalytics();">
      ${esc(p)} класс <span class="muted" style="color:${isActive ? '#fff' : 'inherit'};">(${groups[p].length})</span>
    </button>`;
  }).join('');

  const headerCells = stats.classes.map(c => `<th class="nowrap" style="text-align:center;">${esc(c.name)}</th>`).join('');
  const tableRows = stats.rows.map(r => {
    const cells = stats.classes.map(c => {
      const cell = r.byClass[c.id];
      if (!cell || cell.avg === null) return `<td style="text-align:center;">—</td>`;
      const isLeader = r.leaderId === c.id && r.leaderId !== r.laggardId;
      const isLaggard = r.laggardId === c.id && r.leaderId !== r.laggardId;
      const bg = isLeader ? 'background:#c6f6d5;color:#22543d;font-weight:700;'
              : isLaggard ? 'background:#fed7d7;color:#742a2a;font-weight:700;'
              : '';
      const iconSym = isLeader ? ' 🏆' : isLaggard ? ' ⚠' : '';
      return `<td style="text-align:center;${bg}" title="Качество: ${cell.quality ?? '—'}%">${cell.avg}${iconSym}</td>`;
    }).join('');
    return `<tr><td><b>${esc(r.subject)}</b></td>${cells}</tr>`;
  }).join('');

  const comparisonCards = stats.rows
    .filter(r => r.leaderId && r.laggardId && r.leaderId !== r.laggardId)
    .map(r => {
      const leader = r.byClass[r.leaderId];
      const laggard = r.byClass[r.laggardId];
      const diff = (r.leaderAvg - r.laggardAvg).toFixed(2);
      return `<tr>
        <td><b>${esc(r.subject)}</b></td>
        <td><span class="badge badge-green">🏆 ${esc(leader.className)}</span> ${leader.avg}</td>
        <td><span class="badge badge-red">⚠ ${esc(laggard.className)}</span> ${laggard.avg}</td>
        <td class="text-right"><b style="color:var(--primary);">+${diff}</b></td>
      </tr>`;
    }).join('');

  const chartLabels = stats.rows.map(r => r.subject);
  const chartSeries = stats.classes.map((c, idx) => {
    const colors = ['#04558a', '#38a169', '#dd6b20', '#805ad5', '#c53030', '#1893d2', '#6b46c1'];
    return { name: c.name, color: colors[idx % colors.length], data: stats.rows.map(r => r.byClass[c.id]?.avg ?? null) };
  });
  window._parallelsChartData = { labels: chartLabels, series: chartSeries, parallel: selected };

  page(`
    <h1 style="margin-bottom:16px;color:var(--primary);">Аналитика · Параллели</h1>
    ${tabs}

    <div class="card">
      <div class="row-flex" style="justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <h2 style="margin:0;">${icon('users', 18)} Параллель</h2>
        <div class="btn-group">${parallelTabs}</div>
      </div>
    </div>

    ${!stats.hasData ? `<div class="card"><div class="empty"><div class="empty-icon">📊</div>
      <div>Пока нет оценок по предметам у классов этой параллели</div></div></div>` : `

    <div class="card">
      <h2>${icon('bar-chart', 18)} Средний балл по предметам</h2>
      <div class="alert alert-info" style="font-size:13px;">${icon('info', 14)} 🏆 — лучший класс параллели по предмету, ⚠ — отстающий. Наведите на ячейку — покажет качество знаний.</div>
      <div class="table-wrap">
        <table><thead><tr><th>Предмет</th>${headerCells}</tr></thead><tbody>${tableRows}</tbody></table>
      </div>
    </div>

    <div class="card">
      <h2>${icon('chart', 18)} Сравнение классов параллели ${esc(selected)}</h2>
      <div class="chart-box-lg" style="position:relative;height:420px;"><canvas id="parallelsChart"></canvas></div>
    </div>

    ${comparisonCards ? `<div class="card">
      <h2>${icon('award', 18)} Лидеры и отстающие</h2>
      <div class="table-wrap">
        <table><thead><tr><th>Предмет</th><th>Лидер</th><th>Отстающий</th><th class="text-right">Разрыв</th></tr></thead>
        <tbody>${comparisonCards}</tbody></table>
      </div>
    </div>` : ''}

    `}
  `, 'analytics');

  setTimeout(() => drawParallelsChart(), 150);
}

function renderAnalyticsHeatmap(tabs) {
  const classes = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();
  const matrix = {}; const overall = {};
  subjects.forEach(sub => {
    let totalSum = 0, totalCnt = 0;
    classes.forEach(c => {
      const sts = students.filter(s => s.classId === c.id);
      let sum = 0, cnt = 0;
      sts.forEach(s => {
        DB.getGrades().filter(g => g.studentId === s.id && g.subject === sub && /^[2-5]$/.test(g.value))
          .forEach(g => { sum += +g.value; cnt++; });
      });
      const avg = cnt ? sum/cnt : 0;
      matrix[c.id + '|' + sub] = { avg, cnt };
      totalSum += sum; totalCnt += cnt;
    });
    overall[sub] = totalCnt ? totalSum/totalCnt : 0;
  });
  const headerRow = `<th>Класс</th>` + subjects.map(s => `<th class="nowrap">${esc(s.length > 10 ? s.slice(0,9)+'.' : s)}</th>`).join('');
  const rows = classes.map(c => {
    const cells = subjects.map(sub => {
      const m = matrix[c.id + '|' + sub];
      if (!m.cnt) return `<td>—</td>`;
      const diff = m.avg - overall[sub];
      let heat = 'heat-2';
      if (diff > 0.3) heat = 'heat-4';
      else if (diff > 0.05) heat = 'heat-3';
      else if (diff < -0.3) heat = 'heat-1';
      return `<td class="${heat}" title="Ср: ${m.avg.toFixed(2)} / по школе: ${overall[sub].toFixed(2)}">${m.avg.toFixed(2)}</td>`;
    }).join('');
    return `<tr><td class="class-col">${esc(c.name)}</td>${cells}</tr>`;
  }).join('');

function diagComputeTopicStats(template, results) {
  if (!template || !results || !results.length) return [];
  const topics = {};
  template.tasks.forEach(t => { if (!topics[t.topic]) topics[t.topic] = []; topics[t.topic].push(t); });
  const out = [];
  Object.entries(topics).forEach(([topic, tasks]) => {
    let done = 0, total = 0;
    results.forEach(r => { tasks.forEach(t => { total++; if (r.scores && r.scores[t.num] === 1) done++; }); });
    const percent = total ? Math.round(done / total * 100) : 0;
    const level = percent >= 80 ? 'высокий' : percent >= 50 ? 'базовый' : 'низкий';
    out.push({ topic, done, total, percent, level, tasksCount: tasks.length });
  });
  out.sort((a, b) => a.percent - b.percent);
  return out;
}

window.diagTaskUpdate = function(i, v) { if (window._diagTasksDraft && window._diagTasksDraft[i]) window._diagTasksDraft[i].topic = v; };
window.diagTaskAdd = function() { if (!window._diagTasksDraft) return; window._diagTasksDraft.push({ num:window._diagTasksDraft.length + 1, topic:'' }); diagRedrawTasks(); };
window.diagTaskRemove = function(i) {

function diagRedrawTasks() {

window.diagSaveTemplate = function(id) {
  const name = (document.getElementById('tpl_name').value || '').trim();
  const type = document.getElementById('tpl_type').value;
  const subject = (document.getElementById('tpl_subject').value || '').trim();
  const classLevel = (document.getElementById('tpl_level').value || '').trim();
  const tasks = (window._diagTasksDraft || []).filter(t => (t.topic || '').trim());
  if (!name) { showToast('Укажите название', 'error'); return; }
  if (!tasks.length) { showToast('Добавьте задания', 'error'); return; }
  tasks.forEach((t, i) => { t.num = i + 1; t.maxScore = 1; });
  const data = { name, type, subject, classLevel, tasks };
  if (id) { DB.updateTemplate(id, data); showToast('Обновлён', 'success'); }

window.diagToggle = function(sid, num) {
  const key = `${sid}|${num}`;
  const cur = diagInputState.draft[key];
  if (cur === undefined) diagInputState.draft[key] = 1;
  else if (cur === 1) diagInputState.draft[key] = 0;
  else delete diagInputState.draft[key];
  renderDiagnosticsPage('input');
};
window.diagFillAll = function(val) {
  const template = DB.getTemplates().find(t => t.id === +diagInputState.templateId);
  if (!template) return;
  const students = DB.getStudents().filter(s => s.classId === +diagInputState.classId);
  students.forEach(s => template.tasks.forEach(t => { diagInputState.draft[`${s.id}|${t.num}`] = val; }));
  renderDiagnosticsPage('input');
};
window.diagClearAll = function() { diagInputState.draft = {}; renderDiagnosticsPage('input'); };
window.diagSaveInput = function() {
  const template = DB.getTemplates().find(t => t.id === +diagInputState.templateId);
  if (!template) { showToast('Шаблон не найден', 'error'); return; }
  const students = DB.getStudents().filter(s => s.classId === +diagInputState.classId);
  if (!students.length) { showToast('Нет учеников', 'error'); return; }
  const results = {};
  students.forEach(s => {
    const scores = {}; let hasAny = false;
    template.tasks.forEach(t => {
      const key = `${s.id}|${t.num}`;
      let v = diagInputState.draft[key];
      if (v === undefined) {
        const ex = DB.getTaskResults().find(r => r.studentId === s.id && r.templateId === template.id);
        v = ex && ex.scores ? (ex.scores[t.num] === 1 ? 1 : 0) : null;
      }
      if (v === 1 || v === 0) { scores[t.num] = v; hasAny = true; }
    });
    if (hasAny) results[s.id] = scores;
  });
  const count = Object.keys(results).length;
  if (!count) { showToast('Нет данных', 'error'); return; }
  Object.entries(results).forEach(([sid, scores]) => DB.saveTaskResult(+sid, template.id, scores));
  diagInputState.draft = {};
  showToast(`Сохранено: ${count}`, 'success');
  renderDiagnosticsPage('input');
};

function diagRenderCalendarTab() {
  const templates = DB.getTemplates();
  const planned = DB.getPlannedDiagnostics();
  const results = DB.getTaskResults();

  const events = [];
  planned.forEach(p => {
    const tpl = templates.find(t => t.id === p.templateId);
    const cls = DB.getClasses().find(c => c.id === p.classId);
    events.push({
      id: 'p' + p.id,
      kind: 'planned',
      date: p.plannedDate,
      title: tpl ? tpl.name : '—',
      type: tpl ? tpl.type : '—',
      subject: tpl ? tpl.subject : '',
      className: cls ? cls.name : '—',
      status: p.status,
      notes: p.notes || '',
      raw: p,
    });
  });

  const seen = new Set();
  results.forEach(r => {
    const tpl = templates.find(t => t.id === r.templateId);
    if (!tpl) return;
    const student = DB.getStudent(r.studentId);
    if (!student) return;
    const key = `${r.date}|${r.templateId}|${student.classId}`;
    if (seen.has(key)) return;
    seen.add(key);
    const cls = DB.getClasses().find(c => c.id === student.classId);
    events.push({
      id: 'r' + r.id,
      kind: 'past',
      date: r.date,
      title: tpl.name,
      type: tpl.type,
      subject: tpl.subject,
      className: cls ? cls.name : '—',
      status: 'done',
    });
  });

  events.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  let filtered = events.slice();
  if (diagCalendarFilter.month) {
    filtered = filtered.filter(e => e.date && e.date.slice(0, 7) === diagCalendarFilter.month);
  }
  if (diagCalendarFilter.type) {
    filtered = filtered.filter(e => e.type === diagCalendarFilter.type);
  }

  const upcoming = filtered.filter(e => e.kind === 'planned');
  const past = filtered.filter(e => e.kind === 'past');
  const availableMonths = [...new Set(events.map(e => e.date ? e.date.slice(0, 7) : null).filter(Boolean))].sort();

  const buildRows = (list, kind) => list.map(e => {
    const cls = kind === 'planned' ? 'badge-blue' : 'badge-green';

      <td class="nowrap"><b>${esc(fmtDate(e.date))}</b></td>
      <td><span class="badge ${cls}">${esc(e.type || '—')}</span></td>
      <td>${esc(e.title)}</td>
      <td class="nowrap">${esc(e.className)}</td>
      <td>${esc(e.subject || '—')}</td>

        ${kind === 'planned' ? `
          <button class="btn btn-outline btn-sm btn-icon" onclick="openPlannedDiagForm(${e.raw.id})" title="Редактировать">${icon('edit', 12)}</button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="deletePlannedDiag(${e.raw.id})" title="Удалить">${icon('trash', 12)}</button>
        ` : `<span class="badge badge-gray">проведена</span>`}
      </td>
    </tr>`;
  }).join('');

  const now = new Date();
  const curYear = now.getFullYear();
  const curMonth = now.getMonth();
  const firstDay = new Date(curYear, curMonth, 1);
  const lastDay = new Date(curYear, curMonth + 1, 0);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  const daysInMonth = lastDay.getDate();
  const monthEvents = {};
  events.forEach(e => {
    if (!e.date) return;
    const d = new Date(e.date);
    if (d.getFullYear() === curYear && d.getMonth() === curMonth) {
      const day = d.getDate();
      if (!monthEvents[day]) monthEvents[day] = [];
      monthEvents[day].push(e);
    }
  });

  let calendarHtml = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px;">';
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => {
    calendarHtml += `<div style="text-align:center;font-weight:700;color:var(--primary);padding:6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;">${d}</div>`;
  });
  for (let i = 0; i < startWeekday; i++) calendarHtml += `<div></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const dayEvents = monthEvents[day] || [];
    const hasPlanned = dayEvents.some(e => e.kind === 'planned');
    const hasPast = dayEvents.some(e => e.kind === 'past');
    const isToday = day === now.getDate();
    let bg = 'var(--bg-card)';
    if (hasPlanned) bg = '#fff3e0';
    if (hasPast) bg = '#e8f5e9';

    calendarHtml += `<div style="background:${bg};border:1px solid var(--border);border-radius:6px;padding:4px;min-height:60px;position:relative;${isToday ? 'outline:2px solid var(--primary);' : ''}">
      <div style="font-weight:700;font-size:12px;color:var(--text-2);">${day}</div>
      ${dayEvents.slice(0, 2).map(e => `<div style="font-size:10px;color:${e.kind === 'planned' ? '#bf6a00' : '#1e5e2b'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(e.title)} · ${esc(e.className)}">• ${esc(e.className)}</div>`).join('')}
      ${dayEvents.length > 2 ? `<div style="font-size:10px;color:var(--text-muted);">+${dayEvents.length - 2}</div>` : ''}
    </div>`;
  }

  return `
    <div class="card">
      <div class="row-flex" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div>

          <div class="muted" style="font-size:12px;margin-top:4px;">

          </div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openPlannedDiagForm()">${icon('plus', 14)} Запланировать работу</button>
      </div>

      <div class="alert alert-info" style="font-size:13px;">${icon('info', 14)} Календарь на текущий месяц. Ниже — список работ с фильтрами.</div>

      ${calendarHtml}

      <div class="form-grid mb-16">
        <div class="form-group"><label>Месяц</label>

          </select></div>
        <div class="form-group"><label>Тип</label>
          <select onchange="diagCalendarFilter.type=this.value;renderDiagnosticsPage('calendar');">
            <option value="">Все типы</option>
            ${typeOptions.map(t => `<option value="${t}" ${diagCalendarFilter.type === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
          </select></div>
      </div>

      ${upcoming.length ? `
        <h3 style="margin-top:20px;">${icon('alert', 16)} Запланированные (${upcoming.length})</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Дата</th><th>Тип</th><th>Работа</th><th>Класс</th><th>Предмет</th><th></th></tr></thead>
          <tbody>${buildRows(upcoming, 'planned')}</tbody></table></div>
      ` : ''}

      ${past.length ? `

          <thead><tr><th>Дата</th><th>Тип</th><th>Работа</th><th>Класс</th><th>Предмет</th><th></th></tr></thead>
          <tbody>${buildRows(past, 'past')}</tbody></table></div>

      ${!upcoming.length && !past.length ? `<div class="empty"><div class="empty-icon">📅</div><div>Нет работ по фильтрам</div></div>` : ''}
    </div>
  `;
}

/* ============================================================
   МОДУЛЬ ОТЧЁТОВ
   ============================================================ */
function reportsComputeSubjectStats(subject) {
  const students = allowedStudents();
  let sum = 0, cnt = 0, excellent = 0, good = 0, satisfactory = 0, poor = 0;
  students.forEach(s => {
    const v = finalGrade(s.id, subject);
    if (/^[2-5]$/.test(v)) {
      sum += +v; cnt++;
      if (v === '5') excellent++;
      else if (v === '4') good++;
      else if (v === '3') satisfactory++;
      else poor++;
    }
  });
  const avg = cnt ? sum / cnt : 0;
  const quality = cnt ? Math.round((excellent + good) / cnt * 100) : 0;
  const success = cnt ? Math.round((excellent + good + satisfactory) / cnt * 100) : 0;
  return { subject, count: cnt, avg: +avg.toFixed(2), quality, success, excellent, good, satisfactory, poor };
}
function reportsComputeClassStats(classId) {
  const classObj = DB.getClasses().find(c => c.id === classId);
  if (!classObj) return null;
  const students = DB.getStudents().filter(s => s.classId === classId);
  const subjects = DB.getSubjects();
  let totalSum = 0, totalCnt = 0;
  let excellent = 0, good = 0, satisfactory = 0, poor = 0;
  students.forEach(s => {
    let sSum = 0, sCnt = 0;
    subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v)) { totalSum += +v; totalCnt++; sSum += +v; sCnt++; }
    });
    const sAvg = sCnt ? sSum / sCnt : 0;
    if (sAvg >= 4.5) excellent++;
    else if (sAvg >= 3.5) good++;
    else if (sAvg >= 2.5) satisfactory++;
    else if (sCnt > 0) poor++;
  });
  const avg = totalCnt ? totalSum / totalCnt : 0;
  const quality = students.length ? Math.round((excellent + good) / students.length * 100) : 0;
  return { classObj, students: students.length, avg: +avg.toFixed(2), quality, excellent, good, satisfactory, poor, totalGrades: totalCnt };
}
function reportsComputeClassDynamics(classId) {
  const students = DB.getStudents().filter(s => s.classId === classId);
  const sids = students.map(s => s.id);
  const grades = DB.getGrades().filter(g => sids.includes(g.studentId) && /^[2-5]$/.test(g.value));
  const periods = ['I четверть','II четверть','III четверть','IV четверть'];
  const byPeriod = {};
  periods.forEach(p => {
    const gs = grades.filter(g => g.period === p);
    byPeriod[p] = gs.length ? gs.reduce((a,b) => a + +b.value, 0) / gs.length : null;
  });
  let last = null, prev = null;
  for (let i = periods.length - 1; i >= 0; i--) {
    if (byPeriod[periods[i]] !== null) {
      if (!last) last = { period: periods[i], avg: byPeriod[periods[i]] };
      else if (!prev) { prev = { period: periods[i], avg: byPeriod[periods[i]] }; break; }
    }
  }
  if (!last || !prev) return { diff: 0, last, prev, hasData: false };
  return { diff: +(last.avg - prev.avg).toFixed(2), last, prev, hasData: true };
}
function reportsFindStruggling(options) {
  options = options || {};
  const students = allowedStudents();
  const subjects = DB.getSubjects();
  const result = [];
  students.forEach(s => {
    if (options.classId && s.classId !== options.classId) return;
    const problems = [];
    let totalSum = 0, totalCnt = 0, countTwos = 0;
    subjects.forEach(sub => {
      if (options.subject && sub !== options.subject) return;
      const grades = DB.getGrades().filter(g => g.studentId === s.id && g.subject === sub && /^[2-5]$/.test(g.value));
      grades.forEach(g => { if (g.value === '2') { countTwos++; problems.push({ subject: sub, type: 'two', period: g.period }); } });
      if (grades.length) {
        const subAvg = grades.reduce((a,g) => a + +g.value, 0) / grades.length;
        totalSum += grades.reduce((a,g) => a + +g.value, 0);
        totalCnt += grades.length;
        if (subAvg < 3.0) problems.push({ subject: sub, type: 'low_avg', avg: +subAvg.toFixed(2) });
      }
    });
    const overallAvg = totalCnt ? +(totalSum / totalCnt).toFixed(2) : 0;
    if (problems.length > 0 || (overallAvg > 0 && overallAvg < 3.0)) {
      if (options.teacherId) {
        const teacherSubjects = DB.getSubjectTeachers().filter(st => st.teacherId === options.teacherId && st.classId === s.classId).map(st => st.subject);
        const hasTP = problems.some(p => teacherSubjects.includes(p.subject));
        if (!hasTP) return;
      }
      result.push({ student: s, classObj: DB.getClasses().find(c => c.id === s.classId), overallAvg, countTwos, problems,
        problemSubjects: [...new Set(problems.map(p => p.subject))] });
    }
  });
  result.sort((a, b) => b.countTwos - a.countTwos || a.overallAvg - b.overallAvg);
  return result;
}

function reportsRenderRatingTab() {
  const classes = allowedClasses();
  const data = classes.map(c => {
    const stats = reportsComputeClassStats(c.id);
    const dyn = reportsComputeClassDynamics(c.id);
    return { ...stats, dyn };
  }).filter(Boolean);
  const sorted = [...data].sort((a, b) => b.avg - a.avg);
  const withMedals = sorted.map((x, i) => ({ ...x, rank: i + 1 }));
  const rows = withMedals.map(x => {
    const medal = x.rank <= 3 ? ['🥇','🥈','🥉'][x.rank-1] : x.rank;
    const ac = x.avg >= 4.0 ? 'var(--success)' : x.avg >= 3.5 ? 'var(--primary)' : x.avg >= 3.0 ? 'var(--warning)' : 'var(--danger)';
    const qc = x.quality >= 70 ? 'var(--success)' : x.quality >= 50 ? 'var(--warning)' : 'var(--danger)';
    let dynHtml = '—';
    if (x.dyn.hasData) {
      const arrow = x.dyn.diff > 0 ? '↑' : x.dyn.diff < 0 ? '↓' : '→';
      const color = x.dyn.diff > 0 ? 'var(--success)' : x.dyn.diff < 0 ? 'var(--danger)' : 'var(--text-muted)';
      const sign = x.dyn.diff > 0 ? '+' : '';
      dynHtml = `<b style="color:${color};">${arrow} ${sign}${x.dyn.diff}</b>`;
    }
    return `<tr><td><b>${medal}</b></td><td><b>${esc(x.classObj.name)}</b></td>
      <td class="text-right">${x.students}</td>
      <td class="text-right"><b style="color:${ac};">${x.avg}</b></td>
      <td class="text-right"><b style="color:${qc};">${x.quality}%</b></td>
      <td class="text-right">${dynHtml}</td>
      <td class="text-right" style="font-size:12px;color:var(--text-muted);">${x.excellent} / ${x.good} / ${x.satisfactory} / ${x.poor}</td>
    </tr>`;
  }).join('');
  const withDyn = data.filter(x => x.dyn.hasData);
  const growing = [...withDyn].sort((a, b) => b.dyn.diff - a.dyn.diff).slice(0, 3).filter(x => x.dyn.diff > 0);
  const falling = [...withDyn].sort((a, b) => a.dyn.diff - b.dyn.diff).slice(0, 3).filter(x => x.dyn.diff < 0);
  window._ratingChartData = sorted.map(x => ({ name: x.classObj.name, avg: x.avg, quality: x.quality }));
  return `
    <div class="stats-grid">
      <div class="stat-card"><div class="num">${classes.length}</div><div class="lbl">Классов</div></div>
      <div class="stat-card"><div class="num">${data.reduce((a,x) => a + x.students, 0)}</div><div class="lbl">Учеников</div></div>
      <div class="stat-card"><div class="num" style="color:var(--success);">${growing.length}</div><div class="lbl">Растут</div></div>
      <div class="stat-card"><div class="num" style="color:var(--danger);">${falling.length}</div><div class="lbl">Падают</div></div>
    </div>
    ${growing.length ? `<div class="card"><h2>${icon('trending-up', 18)} Растущие</h2>
      <div class="row-flex" style="gap:12px;flex-wrap:wrap;">
        ${growing.map(x => `<div class="card" style="flex:1;min-width:200px;margin:0;border-left:4px solid var(--success);">
          <div style="font-weight:700;color:var(--primary);margin-bottom:6px;">${esc(x.classObj.name)}</div>
          <div style="font-size:24px;font-weight:700;color:var(--success);">↑ +${x.dyn.diff}</div>
          <div class="muted">средний ${x.avg}</div></div>`).join('')}
      </div></div>` : ''}
    ${falling.length ? `<div class="card"><h2>${icon('trending-down', 18)} Падающие</h2>
      <div class="row-flex" style="gap:12px;flex-wrap:wrap;">
        ${falling.map(x => `<div class="card" style="flex:1;min-width:200px;margin:0;border-left:4px solid var(--danger);">
          <div style="font-weight:700;color:var(--primary);margin-bottom:6px;">${esc(x.classObj.name)}</div>
          <div style="font-size:24px;font-weight:700;color:var(--danger);">↓ ${x.dyn.diff}</div>
          <div class="muted">средний ${x.avg}</div></div>`).join('')}
      </div></div>` : ''}
    <div class="card">
      <div class="row-flex" style="justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
        <h2 style="margin:0;">${icon('chart', 18)} Рейтинг классов</h2>
        <button class="btn btn-success btn-sm" onclick="reportsExportRatingXlsx()">${icon('file-excel', 14)} Excel</button>
      </div>
      <div class="alert alert-info" style="font-size:13px;">${icon('info', 14)} Динамика — разница среднего балла между последней и предыдущей четвертями с данными.</div>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Класс</th><th class="text-right">Учеников</th>
        <th class="text-right">Средний балл</th><th class="text-right">Качество</th>
        <th class="text-right">Динамика</th><th class="text-right">5/4/3/2</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
    <div class="card"><h2>${icon('bar-chart', 18)} Средний балл по классам</h2>
      <div class="chart-box-lg" style="position:relative;height:380px;"><canvas id="ratingChart"></canvas></div>
    </div>
  `;
}
function reportsRenderStrugglingTab() {
  const classes = allowedClasses();
  const subjects = usedSubjects();
  const teachersList = DB.getSubjectTeachersList();
  const list = reportsFindStruggling({
    classId: reportsStrugglingFilter.classId ? +reportsStrugglingFilter.classId : null,
    subject: reportsStrugglingFilter.subject || null,
    teacherId: reportsStrugglingFilter.teacherId ? +reportsStrugglingFilter.teacherId : null,
  });
  let filtered = list.filter(x => x.overallAvg < reportsStrugglingFilter.minAvg || x.countTwos > 0);
  if (reportsStrugglingFilter.onlyTwos) filtered = filtered.filter(x => x.countTwos > 0);
  const totalTwos = filtered.reduce((a, x) => a + x.countTwos, 0);
  const withTwos = filtered.filter(x => x.countTwos > 0).length;
  const lowAvg = filtered.filter(x => x.overallAvg > 0 && x.overallAvg < 3.0).length;
  const byClass = {};
  filtered.forEach(x => { const cn = x.classObj ? x.classObj.name : '—'; if (!byClass[cn]) byClass[cn] = []; byClass[cn].push(x); });
  const rows = filtered.map(x => {
    const avgColor = x.overallAvg >= 3.0 ? 'var(--warning)' : 'var(--danger)';
    const problemText = x.problemSubjects.map(sub => {
      const sp = x.problems.filter(p => p.subject === sub);
      const parts = [];
      if (sp.some(p => p.type === 'two')) parts.push(`двойки (${sp.filter(p => p.type === 'two').length})`);
      const low = sp.find(p => p.type === 'low_avg');
      if (low) parts.push(`ср. ${low.avg}`);
      return `<div style="margin-bottom:4px;"><b>${esc(sub)}</b> — ${parts.join(', ')}</div>`;
    }).join('');
    return `<tr><td class="nowrap"><b>${esc(fullName(x.student))}</b></td>
      <td class="nowrap">${esc(x.classObj ? x.classObj.name : '—')}</td>
      <td class="text-right"><b style="color:${avgColor};">${x.overallAvg || '—'}</b></td>
      <td class="text-right">${x.countTwos > 0 ? `<span class="badge badge-red">${x.countTwos}</span>` : '—'}</td>
      <td style="font-size:13px;">${problemText || '—'}</td>
      <td class="text-right nowrap"><button class="btn btn-outline btn-sm btn-icon" onclick="location.hash='student/${x.student.id}'" title="Карточка">${icon('user', 12)}</button></td>
    </tr>`;
  }).join('');
  const classRows = Object.entries(byClass).map(([cn, items]) => `<tr>
    <td><b>${esc(cn)}</b></td><td class="text-right">${items.length}</td>
    <td class="text-right">${items.reduce((a,x) => a + x.countTwos, 0)}</td>
    <td class="text-right"><button class="btn btn-outline btn-sm" onclick="reportsCopyClassList('${esc(cn)}')">${icon('download', 12)} Копировать</button></td>
  </tr>`).join('');
  return `
    <div class="stats-grid">
      <div class="stat-card" style="border-left-color:var(--danger);"><div class="num" style="color:var(--danger);">${filtered.length}</div><div class="lbl">В зоне риска</div></div>
      <div class="stat-card" style="border-left-color:var(--danger);"><div class="num" style="color:var(--danger);">${withTwos}</div><div class="lbl">С двойками</div></div>
      <div class="stat-card" style="border-left-color:var(--warning);"><div class="num" style="color:var(--warning);">${lowAvg}</div><div class="lbl">Ср. балл &lt; 3.0</div></div>
      <div class="stat-card"><div class="num">${totalTwos}</div><div class="lbl">Всего двоек</div></div>
    </div>
    <div class="card"><h2>${icon('settings', 18)} Фильтры</h2>
      <div class="form-grid">
        <div class="form-group"><label>Класс</label>
          <select onchange="reportsStrugglingFilter.classId=this.value;renderReportsPage('struggling');">
            <option value="">Все классы</option>
            ${classes.map(c => `<option value="${c.id}" ${reportsStrugglingFilter.classId==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Предмет</label>
          <select onchange="reportsStrugglingFilter.subject=this.value;renderReportsPage('struggling');">
            <option value="">Все предметы</option>
            ${subjects.map(s => `<option ${reportsStrugglingFilter.subject===s?'selected':''}>${esc(s)}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Учитель</label>
          <select onchange="reportsStrugglingFilter.teacherId=this.value;renderReportsPage('struggling');">
            <option value="">Все учителя</option>
            ${teachersList.map(t => `<option value="${t.id}" ${reportsStrugglingFilter.teacherId==t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Порог среднего балла</label>
          <select onchange="reportsStrugglingFilter.minAvg=+this.value;renderReportsPage('struggling');">
            <option value="2.5" ${reportsStrugglingFilter.minAvg==2.5?'selected':''}>Ниже 2.5</option>
            <option value="3.0" ${reportsStrugglingFilter.minAvg==3.0?'selected':''}>Ниже 3.0</option>
            <option value="3.5" ${reportsStrugglingFilter.minAvg==3.5?'selected':''}>Ниже 3.5</option>
            <option value="4.0" ${reportsStrugglingFilter.minAvg==4.0?'selected':''}>Ниже 4.0</option>
          </select></div>
      </div>
      <div class="mt-16">
        <label style="font-size:13px;font-weight:600;cursor:pointer;">
          <input type="checkbox" ${reportsStrugglingFilter.onlyTwos?'checked':''}
                 onchange="reportsStrugglingFilter.onlyTwos=this.checked;renderReportsPage('struggling');">
          Только с двойками
        </label>
      </div>
    </div>
    ${filtered.length ? `
      <div class="card">
        <div class="row-flex" style="justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
          <h2 style="margin:0;">${icon('alert', 18)} Список (${filtered.length})</h2>
          <div class="btn-group">
            <button class="btn btn-success btn-sm" onclick="reportsExportStrugglingXlsx()">${icon('file-excel', 14)} Excel</button>
            <button class="btn btn-outline btn-sm" onclick="reportsCopyAllStruggling()">${icon('download', 14)} Копировать всё</button>
          </div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>ФИО</th><th>Класс</th><th class="text-right">Ср. балл</th>
          <th class="text-right">Двоек</th><th>Проблемы</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table></div>
      </div>
      <div class="card"><h2>${icon('users', 18)} По классам</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>Класс</th><th class="text-right">Учеников</th>
          <th class="text-right">Двоек</th><th></th></tr></thead>
          <tbody>${classRows}</tbody></table></div>
      </div>
    ` : `<div class="card"><div class="empty"><div class="empty-icon">✓</div><div>Неуспевающих нет</div></div></div>`}
  `;
}
window.reportsCopyClassList = function(className) {
  const list = reportsFindStruggling({ classId: reportsStrugglingFilter.classId ? +reportsStrugglingFilter.classId : null })
    .filter(x => x.classObj && x.classObj.name === className);
  const text = `Список неуспевающих — ${className}\n\n` + list.map((x, i) =>
    `${i+1}. ${fullName(x.student)} — ср. ${x.overallAvg}, двоек ${x.countTwos}. Проблемы: ${x.problemSubjects.join(', ')}`).join('\n');
  navigator.clipboard.writeText(text).then(() => showToast('Скопировано', 'success')).catch(() => prompt('Скопируйте:', text));
};
window.reportsCopyAllStruggling = function() {
  const list = reportsFindStruggling({
    classId: reportsStrugglingFilter.classId ? +reportsStrugglingFilter.classId : null,
    subject: reportsStrugglingFilter.subject || null,
    teacherId: reportsStrugglingFilter.teacherId ? +reportsStrugglingFilter.teacherId : null,
  }).filter(x => x.overallAvg < reportsStrugglingFilter.minAvg || x.countTwos > 0);
  const text = `Список неуспевающих (${todayStr()})\n\n` + list.map((x, i) => {
    const cn = x.classObj ? x.classObj.name : '—';
    return `${i+1}. ${fullName(x.student)} (${cn}) — ср. ${x.overallAvg}, двоек ${x.countTwos}. Проблемы: ${x.problemSubjects.join(', ')}`;
  }).join('\n');
  navigator.clipboard.writeText(text).then(() => showToast('Скопировано', 'success')).catch(() => prompt('Скопируйте:', text));
};
window.reportsExportQualityXlsx = function() {
  if (typeof XLSX === 'undefined') { showToast('XLSX не загружен', 'error'); return; }
  const subjects = usedSubjects();
  const stats = subjects.map(sub => reportsComputeSubjectStats(sub));
  const sorted = [...stats].sort((a, b) => a.quality - b.quality);
  const rows = [['Предмет','Оценок','Средний балл','Качество %','Успеваемость %','5','4','3','2']];
  const colored = [];
  sorted.forEach((s, i) => {
    rows.push([s.subject, s.count, s.avg, s.quality, s.success, s.excellent, s.good, s.satisfactory, s.poor]);
    const bg = s.quality >= 70 ? 'C6F6D5' : s.quality >= 50 ? 'FEFCBF' : 'FED7D7';
    colored.push({ r: i+1, c: 3, bg, bold: true });
  });
  downloadXLSX(`Качество_знаний_${todayStr()}.xlsx`, [{ name:'Качество', rows, colWidths:[30,10,14,12,16,10,10,10,10], coloredCells: colored }]);
};
window.reportsExportRatingXlsx = function() {
  if (typeof XLSX === 'undefined') { showToast('XLSX не загружен', 'error'); return; }
  const classes = allowedClasses();
  const data = classes.map(c => ({ ...reportsComputeClassStats(c.id), dyn: reportsComputeClassDynamics(c.id) })).filter(Boolean).sort((a, b) => b.avg - a.avg);
  const rows = [['#','Класс','Учеников','Средний балл','Качество %','Динамика','Отлично','Хорошо','Удовл.','Неуд.']];
  const colored = [];
  data.forEach((x, i) => {
    rows.push([i+1, x.classObj.name, x.students, x.avg, x.quality, x.dyn.hasData ? x.dyn.diff : '—', x.excellent, x.good, x.satisfactory, x.poor]);
    const bg = x.avg >= 4.0 ? 'C6F6D5' : x.avg >= 3.5 ? 'BEE3F8' : x.avg >= 3.0 ? 'FEFCBF' : 'FED7D7';
    colored.push({ r: i+1, c: 3, bg, bold: true });
    if (x.dyn.hasData) {
      const dbg = x.dyn.diff > 0 ? 'C6F6D5' : x.dyn.diff < 0 ? 'FED7D7' : 'FFFFFF';
      colored.push({ r: i+1, c: 5, bg: dbg, bold: true });
    }
  });
  downloadXLSX(`Рейтинг_классов_${todayStr()}.xlsx`, [{ name:'Рейтинг', rows, colWidths:[6,12,12,14,12,12,10,10,10,10], coloredCells: colored }]);
};
window.reportsExportStrugglingXlsx = function() {
  if (typeof XLSX === 'undefined') { showToast('XLSX не загружен', 'error'); return; }
  const list = reportsFindStruggling({
    classId: reportsStrugglingFilter.classId ? +reportsStrugglingFilter.classId : null,
    subject: reportsStrugglingFilter.subject || null,
    teacherId: reportsStrugglingFilter.teacherId ? +reportsStrugglingFilter.teacherId : null,
  }).filter(x => x.overallAvg < reportsStrugglingFilter.minAvg || x.countTwos > 0);
  const rows = [['ФИО','Класс','Средний балл','Двоек','Проблемные предметы']];
  const colored = [];
  list.forEach((x, i) => {
    rows.push([fullName(x.student), x.classObj ? x.classObj.name : '', x.overallAvg, x.countTwos, x.problemSubjects.join(', ')]);
    const bg = x.countTwos > 0 ? 'FED7D7' : x.overallAvg < 3.0 ? 'FEFCBF' : 'FFFFFF';
    colored.push({ r: i+1, c: 2, bg, bold: true });
    if (x.countTwos > 0) colored.push({ r: i+1, c: 3, bg: 'FED7D7', bold: true });
  });
  downloadXLSX(`Неуспевающие_${todayStr()}.xlsx`, [{ name:'Неуспевающие', rows, colWidths:[30,10,14,10,40], coloredCells: colored }]);
};

/* ============================================================
   СТАРТ ПРИЛОЖЕНИЯ
   ============================================================ */
loadDraft();
initMobileMode();
UndoStack.load();
render();

// Облачная синхронизация при старте — один раз
setTimeout(() => {
  if (typeof DB !== 'undefined' && typeof DB.syncFromCloud === 'function') {
    DB.syncFromCloud();
  }
}, 1500);

window.addEventListener('load', () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(reg => reg.update());
});
</script>
