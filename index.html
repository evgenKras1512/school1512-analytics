function drawTeachersComparison(subject) {
  const block = document.getElementById('comparisonBlock');
  if (!block) return;
  if (!subject) {
    block.innerHTML = '<div class="empty">Выберите предмет выше.</div>';
    return;
  }

  const classes = allowedClasses();
  const students = allowedStudents();
  const classesWithSubject = classes.filter(c => DB.getSubjectTeacher(c.id, subject));

  if (!classesWithSubject.length) {
    block.innerHTML = `<div class="empty">По предмету «${esc(subject)}» нет назначенных учителей</div>`;
    return;
  }

  const rows = classesWithSubject.map(c => {
    const t = DB.getSubjectTeacher(c.id, subject);
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0;
    const dist = {'5':0,'4':0,'3':0,'2':0};
    sts.forEach(s => {
      DB.getGrades().filter(g => g.studentId === s.id && g.subject === subject && /^[2-5]$/.test(g.value))
        .forEach(g => { sum += +g.value; cnt++; dist[g.value]++; });
    });
    const avg = cnt ? (sum / cnt).toFixed(2) : '—';
    const avgClass = cnt
      ? (+avg >= 4.5 ? 'badge-green' : +avg >= 3.5 ? 'badge-blue' : +avg >= 2.5 ? 'badge-orange' : 'badge-red')
      : 'badge-gray';
    return { classObj: c, teacher: t, students: sts.length, cnt, avg, avgClass, dist };
  });

  const tableRows = rows.map(r => `<tr>
    <td><b>${esc(r.classObj.name)}</b></td>
    <td>
      ${esc(r.teacher.name)}<br>
      <span class="badge ${MCKO_CLASS[r.teacher.mckoLevel || 'нет']}" style="font-size:.68rem;">
        МЦКО: ${esc(r.teacher.mckoLevel || 'нет')}
      </span>
    </td>
    <td class="text-right">${r.students}</td>
    <td class="text-right">${r.cnt}</td>
    <td class="text-right"><span class="badge ${r.avgClass}">${r.avg}</span></td>
    <td class="text-right hide-mobile">
      ${r.dist['5']} / ${r.dist['4']} / ${r.dist['3']} / ${r.dist['2']}
    </td>
  </tr>`).join('');

  block.innerHTML = `
    <div class="table-wrap mb-16"><table>
      <thead><tr>
        <th>Класс</th>
        <th>Учитель</th>
        <th class="text-right">Учеников</th>
        <th class="text-right">Оценок</th>
        <th class="text-right">Ср. балл</th>
        <th class="text-right hide-mobile">5/4/3/2</th>
      </tr></thead>
      <tbody>${tableRows}</tbody></table></div>

    <div class="chart-box"><canvas id="compareChart"></canvas></div>
  `;

  requestAnimationFrame(() => {
    destroyChart('compareChart');
    const ctx = document.getElementById('compareChart');
    if (!ctx) return;
    const labels = rows.map(r => `${r.classObj.name} — ${r.teacher.name.split(' ')[0]}`);
    const values = rows.map(r => r.avg === '—' ? 0 : +r.avg);
    charts.compareChart = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Ср. балл', data: values,
        backgroundColor: values.map(v => v>=4.5?'#38a169':v>=3.5?'#3182ce':v>=2.5?'#dd6b20':'#e53e3e'),
        borderRadius: 8 }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          title: { display: true, text: `Предмет: ${subject}`, font: CHART_FONT } },
        scales: { y: { min: 0, max: 5, ticks: { stepSize: .5, font: CHART_FONT } },
                  x: { ticks: { font: CHART_FONT, maxRotation: 45 }, grid: { display: false } } } }
    });
  });
}

function drawTeachersDistribution(ctxId, teacherStats) {
  destroyChart(ctxId);
  const ctx = document.getElementById(ctxId);
  if (!ctx) return;
  const top = teacherStats.slice(0, 8);
  const labels = top.map(x => x.t.name.split(' ')[0] + ' ' + (x.t.name.split(' ')[1] || '').charAt(0) + '.');
  charts[ctxId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [
      { label: '5', data: top.map(x => x.dist['5']), backgroundColor: '#38a169' },
      { label: '4', data: top.map(x => x.dist['4']), backgroundColor: '#3182ce' },
      { label: '3', data: top.map(x => x.dist['3']), backgroundColor: '#dd6b20' },
      { label: '2', data: top.map(x => x.dist['2']), backgroundColor: '#e53e3e' },
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: CHART_FONT } } },
      scales: {
        x: { stacked: true, ticks: { font: CHART_FONT, maxRotation: 45 }, grid: { display: false } },
        y: { stacked: true, beginAtZero: true, ticks: { font: CHART_FONT } }
      } }
  });
}

function drawAllGradesPie(students) {
  destroyChart('anPie');
  const ctx = document.getElementById('anPie');
  if (!ctx) return;
  const ids = students.map(s => s.id);
  const fSubj = analyticsFilter.subject;
  const fPeriod = analyticsFilter.period;
  const grades = DB.getGrades().filter(g => ids.includes(g.studentId) && /^[2-5]$/.test(g.value)
    && (!fSubj || g.subject === fSubj) && (!fPeriod || g.period === fPeriod));
  const counts = {'5':0,'4':0,'3':0,'2':0};
  grades.forEach(g => counts[g.value]++);
  charts.anPie = new Chart(ctx, {
    type: 'pie',
    data: { labels: ['5','4','3','2'],
      datasets: [{ data: [counts['5'],counts['4'],counts['3'],counts['2']],
        backgroundColor: ['#38a169','#3182ce','#dd6b20','#e53e3e'], borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: CHART_FONT } } } }
  });
}

function drawDiagLevelsChart(students) {
  destroyChart('anLevels');
  const ctx = document.getElementById('anLevels');
  if (!ctx) return;
  const ids = students.map(s => s.id);
  const diags = DB.getDiagnostics().filter(d => ids.includes(d.studentId));
  const counts = {'высокий':0,'повышенный':0,'базовый':0,'низкий':0,'':0};
  diags.forEach(d => counts[d.level || '']++);
  charts.anLevels = new Chart(ctx, {
    type: 'bar',
    data: { labels: ['высок.','повыш.','базов.','низк.','—'],
      datasets: [{ label: 'Диагностик',
        data: [counts['высокий'],counts['повышенный'],counts['базовый'],counts['низкий'],counts['']],
        backgroundColor: ['#38a169','#3182ce','#dd6b20','#e53e3e','#a0aec0'], borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: CHART_FONT } },
                x: { ticks: { font: CHART_FONT } } } }
  });
}

function drawCompareStudents() {
  destroyChart('anCompare');
  const ctx = document.getElementById('anCompare');
  if (!ctx) return;
  const a = +analyticsFilter.studentA;
  const b = +analyticsFilter.studentB;
  if (!a || !b) {
    charts.anCompare = new Chart(ctx, {
      type: 'line', data: { labels: PERIODS, datasets: [] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          title: { display: true, text: 'Выберите двух учеников', font: { ...CHART_FONT, size: 13 } } },
        scales: { y: { min: 2, max: 5, ticks: { stepSize: .5, font: CHART_FONT } },
                  x: { ticks: { font: CHART_FONT } } } }
    });
    return;
  }
  const sA = DB.getStudent(a);
  const sB = DB.getStudent(b);
  const buildData = (sid) => PERIODS.map(p => {
    const gs = DB.getGrades().filter(g => g.studentId === sid && g.period === p && /^[2-5]$/.test(g.value)
      && (!analyticsFilter.subject || g.subject === analyticsFilter.subject));
    return gs.length ? +(gs.reduce((x,y)=>x+ +y.value,0)/gs.length).toFixed(2) : null;
  });
  charts.anCompare = new Chart(ctx, {
    type: 'line',
    data: { labels: PERIODS, datasets: [
      { label: sA ? shortName(sA) : 'A', data: buildData(a),
        borderColor: '#2c5282', fill: false, tension: .3, pointRadius: 5, spanGaps: true },
      { label: sB ? shortName(sB) : 'B', data: buildData(b),
        borderColor: '#dd6b20', fill: false, tension: .3, pointRadius: 5, spanGaps: true }
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: CHART_FONT } } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5, font: CHART_FONT } },
                x: { ticks: { font: CHART_FONT } } } }
  });
}

function drawGlobalDynamics(students) {
  destroyChart('anDynamics');
  const ctx = document.getElementById('anDynamics');
  if (!ctx) return;
  const palette = ['#2c5282','#38a169','#dd6b20','#805ad5','#d53f8c','#3182ce','#b7791f','#e53e3e'];
  const datasets = students.slice(0, 8).map((s, i) => {
    const data = PERIODS.map(p => {
      const gs = DB.getGrades().filter(g => g.studentId === s.id && g.period === p
        && /^[2-5]$/.test(g.value)
        && (!analyticsFilter.subject || g.subject === analyticsFilter.subject));
      return gs.length ? +(gs.reduce((a,b)=>a+ +b.value,0)/gs.length).toFixed(2) : null;
    });
    return { label: shortName(s), data, borderColor: palette[i % palette.length],
             backgroundColor: 'transparent', tension: .3, spanGaps: true, pointRadius: 3 };
  });
  charts.anDynamics = new Chart(ctx, {
    type: 'line',
    data: { labels: PERIODS, datasets },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: CHART_FONT, boxWidth: 12 } } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5, font: CHART_FONT } },
                x: { ticks: { font: CHART_FONT } } } }
  });
}

function exportAnalytics() {
  const classes = allowedClasses();
  const students = allowedStudents();
  const subjects = usedSubjects();
  const fSubj = analyticsFilter.subject;
  let filteredStudents = students;
  if (analyticsFilter.classId) filteredStudents = filteredStudents.filter(s => s.classId === +analyticsFilter.classId);

  let html = `<h1>Аналитический отчёт</h1>`;
  html += '<h3>Средний балл по классам</h3>';
  const labels = [], values = [];
  classes.forEach(c => {
    const sts = students.filter(s => s.classId === c.id);
    let sum = 0, cnt = 0;
    sts.forEach(s => subjects.forEach(sub => {
      const v = finalGrade(s.id, sub);
      if (/^[2-5]$/.test(v) && (!fSubj || sub === fSubj)) { sum += +v; cnt++; }
    }));
    labels.push(c.name);
    values.push(cnt ? +(sum/cnt).toFixed(2) : 0);
  });
  html += renderChartToImage('bar', 900, 400, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Ср. балл', data: values,
      backgroundColor: values.map(v => v>=4.5?'#38a169':v>=3.5?'#3182ce':v>=2.5?'#dd6b20':'#e53e3e'),
      borderRadius: 8 }] },
    options: { animation: false, responsive: false, plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: .5 } } } }
  });
  html += `<div class="sig">
      <div>Ответственный: ___________________</div>
      <div>Дата: «____» ____________ 20___ г.</div>
    </div>`;
  exportPDF(html, 'Аналитический отчёт');
}

function exportComparison() {
  const a = +analyticsFilter.studentA;
  const b = +analyticsFilter.studentB;
  if (!a || !b) { alert('Выберите двух учеников'); return; }
  const sA = DB.getStudent(a);
  const sB = DB.getStudent(b);
  const buildData = (sid) => PERIODS.map(p => {
    const gs = DB.getGrades().filter(g => g.studentId === sid && g.period === p && /^[2-5]$/.test(g.value)
      && (!analyticsFilter.subject || g.subject === analyticsFilter.subject));
    return gs.length ? +(gs.reduce((x,y)=>x+ +y.value,0)/gs.length).toFixed(2) : null;
  });
  let html = `<h1>Сравнительный отчёт</h1>
    <h2>${esc(fullName(sA))} и ${esc(fullName(sB))}</h2>`;
  html += renderChartToImage('line', 900, 400, {
    type: 'line',
    data: { labels: PERIODS, datasets: [
      { label: fullName(sA), data: buildData(a), borderColor: '#2c5282', fill: false, tension: .3, pointRadius: 5, spanGaps: true },
      { label: fullName(sB), data: buildData(b), borderColor: '#dd6b20', fill: false, tension: .3, pointRadius: 5, spanGaps: true }
    ]},
    options: { animation: false, responsive: false,
      plugins: { legend: { position: 'bottom' } },
      scales: { y: { min: 2, max: 5, ticks: { stepSize: .5 } } } }
  });
  exportPDF(html, 'Сравнительный отчёт');
}

/* ============================================================
   СПРАВОЧНИКИ
   ============================================================ */
function renderDirectories() {
  const buildings = DB.getBuildings();
  const teachers = DB.getTeachers();
  const subjects = DB.getSubjects();

  const bList = buildings.map(b => `<tr><td>${esc(b.name)}</td>
    <td class="text-right"><button class="btn btn-danger btn-sm" onclick="delBuilding(${b.id})">✕</button></td></tr>`).join('');
  const tList = teachers.map(t => `<tr><td>${esc(t.name)}</td>
    <td class="text-right"><button class="btn btn-danger btn-sm" onclick="delTeacher(${t.id})">✕</button></td></tr>`).join('');
  const sList = subjects.map(s => `<tr><td>${esc(s)}</td>
    <td class="text-right"><button class="btn btn-danger btn-sm" onclick="delSubject('${esc(s)}')">✕</button></td></tr>`).join('');

  page(`
    <h2 style="margin-bottom:16px;color:#1e3a5f;">Справочники</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;">
      <div class="card">
        <h2>Здания</h2>
        <div class="search-bar"><input id="nb" placeholder="Название"><button class="btn btn-primary btn-sm" onclick="addBuilding()">+</button></div>
        <table><tbody>${bList || '<tr><td class="muted">Пусто</td></tr>'}</tbody></table>
      </div>
      <div class="card">
        <h2>Классные руководители</h2>
        <div class="search-bar"><input id="nt" placeholder="ФИО"><button class="btn btn-primary btn-sm" onclick="addTeacher()">+</button></div>
        <table><tbody>${tList || '<tr><td class="muted">Пусто</td></tr>'}</tbody></table>
      </div>
      <div class="card">
        <h2>Предметы</h2>
        <div class="search-bar"><input id="ns" placeholder="Название"><button class="btn btn-primary btn-sm" onclick="addSubject()">+</button></div>
        <table><tbody>${sList || '<tr><td class="muted">Пусто</td></tr>'}</tbody></table>
      </div>
    </div>
  `, 'directories');
}

function addBuilding() { const v = document.getElementById('nb').value.trim(); if (!v) return; DB.addBuilding(v); render(); }
function addTeacher() { const v = document.getElementById('nt').value.trim(); if (!v) return; DB.addTeacher(v); render(); }
function addSubject() { const v = document.getElementById('ns').value.trim(); if (!v) return; DB.addSubject(v); render(); }
function delBuilding(id) { if (confirm('Удалить?')) { DB.deleteBuilding(id); render(); } }
function delTeacher(id) { if (confirm('Удалить?')) { DB.deleteTeacher(id); render(); } }
function delSubject(s) { if (confirm(`Удалить «${s}»?`)) { DB.deleteSubject(s); render(); } }

/* ============================================================
   ПОЛЬЗОВАТЕЛИ
   ============================================================ */
function renderUsers() {
  const users = DB.getUsers();
  const rows = users.map(u => {
    const t = u.teacherId ? DB.getTeachers().find(x => x.id === u.teacherId) : null;
    return `<tr>
      <td><b>${esc(u.login)}</b></td>
      <td>${esc(u.name)}</td>
      <td><span class="badge ${u.role==='admin'?'badge-red':u.role==='director'?'badge-orange':'badge-blue'}">${ROLE_NAMES[u.role]}</span></td>
      <td class="hide-mobile">${esc(t ? t.name : '—')}</td>
      <td class="text-right nowrap">
        <button class="btn btn-outline btn-sm" onclick="userForm(${u.id})">✎</button>
        ${u.id !== SESSION.id ? `<button class="btn btn-danger btn-sm" onclick="delUser(${u.id})">✕</button>` : ''}
      </td>
    </tr>`;
  }).join('');

  page(`
    <div class="card">
      <div class="row-flex" style="justify-content:space-between;margin-bottom:16px;">
        <h2 style="margin:0;">Пользователи</h2>
        <button class="btn btn-primary btn-sm" onclick="userForm()">+ Создать</button>
      </div>
      <div class="alert alert-info">
        <b>Классный руководитель</b> — видит только свой класс.<br>
        <b>Руководитель ОО</b> — все классы, только чтение.<br>
        <b>Администратор</b> — полный доступ.
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Логин</th><th>ФИО</th><th>Роль</th><th class="hide-mobile">Руководство</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
  `, 'users');
}

function userForm(id) {
  const u = id ? DB.getUsers().find(x => x.id === id) : null;
  const teachers = DB.getTeachers();
  showModal(`
    <h2>${u ? 'Редактирование' : 'Новый'} пользователь</h2>
    <div class="form-grid">
      <div class="form-group"><label>Логин *</label><input id="u_login" value="${esc(u?u.login:'')}"></div>
      <div class="form-group"><label>Пароль ${u?'(пусто — не менять)':''}</label><input id="u_pass" type="text"></div>
      <div class="form-group"><label>ФИО *</label><input id="u_name" value="${esc(u?u.name:'')}"></div>
      <div class="form-group"><label>Роль</label>
        <select id="u_role" onchange="toggleTeacherField()">
          <option value="teacher" ${u&&u.role==='teacher'?'selected':''}>Классный руководитель</option>
          <option value="director" ${u&&u.role==='director'?'selected':''}>Руководитель ОО</option>
          <option value="admin" ${u&&u.role==='admin'?'selected':''}>Администратор</option>
        </select></div>
    </div>
    <div id="teacherBlock" style="margin-top:16px;">
      <div class="form-group"><label>Классное руководство</label>
        <select id="u_teacher">
          <option value="">— создать нового по ФИО —</option>
          ${teachers.map(t => `<option value="${t.id}" ${u&&u.teacherId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
        </select></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveUser(${id||'null'})">Сохранить</button>
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
    </div>
  `);
  toggleTeacherField();
}

function toggleTeacherField() {
  const role = document.getElementById('u_role').value;
  document.getElementById('teacherBlock').style.display = role === 'teacher' ? 'block' : 'none';
}

function saveUser(id) {
  const login = document.getElementById('u_login').value.trim();
  const pass = document.getElementById('u_pass').value;
  const name = document.getElementById('u_name').value.trim();
  const role = document.getElementById('u_role').value;
  if (!login || !name) { alert('Заполните'); return; }
  if (!id && !pass) { alert('Пароль'); return; }
  const all = DB.getUsers();
  if (all.some(u => u.login === login && u.id !== id)) { alert('Логин занят'); return; }
  let teacherId = null;
  if (role === 'teacher') {
    const sel = +document.getElementById('u_teacher').value;
    teacherId = sel || DB.addTeacher(name).id;
  }
  if (id) {
    const patch = { login, name, role, teacherId };
    if (pass) patch.password = pass;
    DB.updateUser(id, patch);
    if (id === SESSION.id) setSession({ ...SESSION, ...patch });
  } else {
    DB.addUser({ login, password: pass, name, role, teacherId });
  }
  closeModal();
  render();
}

function delUser(id) {
  if (!confirm('Удалить?')) return;
  DB.deleteUser(id);
  render();
}

/* ============================================================
   РОУТЕР
   ============================================================ */
function render() {
  DB.load();
  UndoStack.load();
  if (!SESSION) { renderLogin(); return; }

  const hash = location.hash.replace('#', '') || 'dashboard';
  const [route, param] = hash.split('/');

  switch (route) {
    case 'dashboard':  renderDashboard(); break;
    case 'students':   renderStudents(); break;
    case 'student':    renderStudentDetail(+param); break;
    case 'classes':    renderClasses(); break;
    case 'analytics':  renderAnalytics(); break;
    case 'journal':    renderJournal(); break;
    case 'subject-teachers': if (SESSION.role === 'admin') renderSubjectTeachers(); else renderDashboard(); break;
    case 'teacher':    if (SESSION.role === 'admin' || SESSION.role === 'director') renderTeacherDetail(+param); else renderDashboard(); break;
    case 'directories': if (SESSION.role === 'admin') renderDirectories(); else renderDashboard(); break;
    case 'users':       if (SESSION.role === 'admin') renderUsers(); else renderDashboard(); break;
    default: renderDashboard();
  }
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
loadDraft();
UndoStack.load();
initMobileMode();
render();

window.addEventListener('load', () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(reg => { reg.update(); });
  }
});
</script>
